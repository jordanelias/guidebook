# Where the repository contradicts ITSELF about a table's stage. The map still has
# to place these, and `tables:` above records where — but taking a side silently
# is curating a fact nothing can check, so both readings are kept with their
# citations. This is a Layer 0 vs Layer 1 conflict (CLAUDE.md §3 against
# pipeline-contract.yaml), so under rule 0 an owner ruling settles it and the
# contract is what gets corrected. Until then this file is the only record, which
# is itself a reason to resolve it in a DR rather than here.
disputed:
  extraction_relations: >-
    Inherits its parent exactly: both ends are FKs into source_value_extractions, so it cann
    ot sit in a different stage from it. Disputed for the same reason and by the same docume
    nts.
  gaps: >-
    SYNTHESIS IS THE ONE STAGE WITH NO SUPPORT, and it is where this map put it. The contrac
    t makes "an OPEN gap" the RESEARCH stage's entry; most live rows were written by researc
    h-batch sessions (derive, never quote: SELECT created_by_session, COUNT(*) FROM gaps GRO
    UP BY 1); evidence_population_match.gap_id is a FK from judgment INTO gaps; and §3 defin
    es synthesis as weighing, convergence and cross-slug findings, which a gap is none of. a
    ssess_cell also writes it at specification. The honest answer is a cross-stage register 
    with no single home.
  source_value_extractions: >-
    CLAUDE.md §3 puts extraction at EVIDENCE ("what was admitted, its identity, verification
     and extraction"). governance/pipeline-contract.yaml calls the same rows JUDGMENT under 
    its `- id: judgment` stage -- "One evidence source may provide many judgment rows" -- an
    d assess_cell.py:78 calls it "the JUDGMENT item (D-0168)". Four contract criteria naming
     it sit under judgment. Rendered at evidence; the dispute is real and open.
