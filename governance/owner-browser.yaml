    context: |-
      You confirmed that an unretrievable source keeps its tier and may still anchor, earning no band above the empty circle, but only when it is properly cited in an academic context.

      A paper or a report has an academic route: a DOI, an index record or a citing bibliography. A code or a standard is cited by jurisdiction, number and clause, and it is not found in academic indices. As of 2026-10-29 six held sources are unverified: one T1 paper, one T4 standard and four T6 codes, and none of the five regulatory ones has a DOI. Re-derive with: select ref_id, tier, verification_method, doi from evidence_sources where verification_status = 'UNVERIFIED'.

      No source states a preference between the options below.
    blocks: "The engine change for the empty-circle rule."
    options:
      - key: registry-route
        label: "A registry citation is a valid route for T4 to T6"
        effect: "An unretrievable code or standard keeps its tier and may anchor below the weak band when it is cited by jurisdiction, standard number and clause. The academic route is required of the other kinds of source."
      - key: literal
        label: "Literally: no academic route, no tier and no anchor"
        effect: "The four T6 codes and the T4 standard that are unverified lose their tier claim and stop anchoring until they are retrieved. Determinations that rest on them read weaker or are not written."
      - key: other
        label: "Something else"
        effect: "Say what in the note."
    source: "Ruling OR-23 of 2026-10-29 (ledger); governance/tier-system.md section 5 and 8"

