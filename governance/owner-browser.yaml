  - id: OR-10b
    gates: false
    title: Which way does a rounded conversion move?
    question: "When a converted length is rounded to the nearest quarter inch or 5 mm, should a minimum never round down and a maximum never round up?"
    why_yours: "Rounding to the nearest can put a shown figure on the wrong side of what the source requires."
    context: |-
      Your ruling shows both units, the converted figure rounded to the nearest quarter inch or 5 mm.

      Example: a source says at least 30 in. That is exactly 762 mm, and the nearest 5 mm is 760 mm, which is below what the source requires. A source that says at most 30 in would show the same 760 mm, which is under its limit and so safe. Rounding to the nearest is safe for a maximum when it rounds down and for a minimum when it rounds up, and the nearest can go either way.
    blocks: "The reading change (T-1 step 9)."
    options:
      - key: safe-side
        label: "Round to the safe side"
        effect: "A minimum rounds up and a maximum rounds down, so the shown figure never undercuts what the source requires. 762 mm as a minimum shows as 765 mm."
      - key: nearest
        label: "Round to the nearest, as ruled"
        effect: "The shown figure can sit below a source's minimum. It is shown beside the source's own figure and marked as rounded."
      - key: other
        label: "Something else"
        effect: "Say what in the note."
    source: "Ruling OR-10 of 2026-10-29 (ledger)"

