glossary:
  access_duration: "How long a barrier affects a person: permanent, temporary or situational. A short fixed list of terms."
  access_need_icf: "Links each access need to the ICF codes (body functions, activities, environment) it concerns, with a confidence level."
  access_needs: "The access needs the guidebook designs for, such as being usable without sight. Each carries the design obligation it creates."
  access_stakes: "How serious it is when a need is not met: safety-critical, exclusion or friction. A short fixed list of terms."
  adversarial_findings: "One finding from an adversarial review: the claim that was attacked, how, and whether it survived, was sustained or was repaired."
  adversarial_passes: "One adversarial review of a work session: which session and commit was attacked, and which models reviewed and wrote it."
  base_icf: "The WHO ICF classification codes the project uses, with their titles."
  base_parameters: "The design parameters a determination is made for, such as a slope or a width. Each points to a term."
  base_taxonomy_identity: "The groups of disabled people the guidebook recognises (the identity lens), arranged as a tree."
  base_taxonomy_medical: "The medical-condition lens: conditions with their ICD-11 anchors."
  case_studies: "Built examples of accessible design, with building type, place, setting and the people served."
  citation_mining: "A record that a source's reference list (backward) or the works citing it (forward) were searched for further sources."
  conflicts: "Places where guidance for different groups of people pulls in opposite directions, and how each was resolved."
  connection_targets: "The things a connection record points at."
  connections: "Cross-links the project found between topics, groups or findings."
  convergence_assessment: "One verdict on how far the sources for a parameter agree, with its reasoning."
  convergence_sources: "Which sources took part in each convergence verdict, and the role each played."
  data_migrations: "The ledger of every change applied to the database. Append-only; nothing here is edited."
  decisions: "The project's recorded decisions (D-numbers): what was decided, by whom, why, and whether it still stands."
  determination_gates: "A flag raised against a determination when new evidence may overturn it. It stays open until someone resolves it."
  economics_entries: "Cost and funding facts, such as grants and construction costs, with the source each came from."
  evidence_population_match: "For each source, how closely the people studied match the people the guidebook serves: exact, partial, proxy or mismatch."
  evidence_source_authors: "The authors of each source, one row per author in order, so credit and co-production can be checked."
  evidence_sources: "Every source the project has admitted (paper, standard or report) with its tier, whether it could be retrieved, and how it was verified."
  external_root_registry: "Original studies that several sources merely repeat, so a repeated figure is not counted as independent."
  extraction_follow_ups: "A note that a figure read from a source needs another pass, with the reason."
  extraction_relations: "How one extracted figure relates to another: confirms, qualifies, derived from, and so on."
  gap_mining: "Records of searches run specifically to close a recorded gap."
  gaps: "Known weaknesses in the evidence: what is missing, how much it matters, and whether it is still open."
  icf_medical_map: "Maps ICF codes to medical conditions."
  identity_icf_map: "Maps each group of people to the ICF codes that describe their functioning, with where each mapping came from."
  identity_medical_map: "Maps each group of people to medical conditions."
  lang_jur_map: "Which languages are searched for which jurisdictions, and whether a language is primary there."
  life_stage_modifiers: "Life-stage modifiers, such as older adults and children, that apply across every group and need."
  observed_terms: "A phrase a source uses for a concept, recorded in the source's own words with where it appears. Not yet judged."
  parameter_declinations: "Terms considered as design parameters and turned down, with the reason. A declination can be revoked."
  reasoning_doc_citations: "Claims quoted from older reasoning documents, with the source each one cited."
  research_code_leads: "Pointers to codes and standards worth fetching (jurisdiction, standard, clause). They say where to look, never what it says."
  rooms: "The kinds of room and space the guidebook covers, such as a bathroom, bedroom or canteen."
  search_admissions: "Joins each search to the sources it led to admitting."
  search_candidates: "Candidate sources a search turned up, and what became of each."
  search_execution_artefacts: "Pointers to the saved files behind each search, such as the retrieved pages."
  search_executions: "One logged search: the query as typed, where it ran, how many results came back and how many were admitted. Empty searches are kept."
  slugs: "The research topics that searches are organised under."
  source_locators: "Where each known source can be found (DOI, URL, PMID, ISBN, standard number), including leads not yet admitted."
  source_scans: "A record that a source was read in full against the parameter list, and how much of it was read."
  source_slug_links: "Which sources were admitted under which research topics."
  source_value_extractions: "A figure or finding read out of a source, with its quote, the parameter and groups it concerns, and how it was read. The raw material of every determination."
  specification_extraction_links: "Which extracted figures a determination used, and why each unused one did not govern."
  specification_source_links: "Which sources a determination rests on, and in what role."
  specifications: "The determinations: for one parameter and one lens, the answer, its evidence marker and its state. Computed by the engine, never typed."
  supersession_check: "A check that an anchor source is still the best current evidence."
  term_adjudications: "The decision about an observed phrase: it names an existing term, names a new one, is not ours, or is deferred, with the reason."
  term_aliases: "Alternative names for each term, by language and jurisdiction, used when searching."
  terms: "The project's vocabulary: each concept's canonical English name and definition."
  weighting_profile: "How evidence tiers are weighted and presented for each audience and use."

words:
  - term: parameter
    meaning: "A design quantity the project gives an answer for, such as the running slope of a ramp or the clear width of a corridor."
  - term: determination
    meaning: "The project's answer for one parameter and one lens: a value or range, an evidence marker and a state. The engine computes it from the evidence; nobody types it."
  - term: lens
    meaning: "Who or what an answer is for: an identity group (for example wheelchair users), an ICF function code, an access need or a medical condition. A determination has at least one."
  - term: tiers
    meaning: "T1 is primary controlled research. Co-1 is lived-experience and participatory work, co-primary with T1. T2 is syntheses. Co-2 is occupational-therapy body guidelines. T3 is grey primary work. T4 to T6 are the regulatory stratum: standards, national frameworks and codes."
  - term: anchoring
    meaning: "T1, Co-1, T2 and Co-2 sources can anchor a value. The regulatory stratum (T4 to T6) is walled off from full-strength anchoring."
  - term: marker
    meaning: "● confirmed. ◐ policy or standards only. ○ grey, thin, or unverified because the source could not be retrieved."
  - term: ledger
    meaning: "references/project-standards.md, the append-only record of your rulings. An answer you give is written there in your words before work that depends on it starts."
  - term: verb
    meaning: "A db.py command, the only sanctioned way to change a row. Your decision on a row is carried out by a verb."
  - term: T-1 to T-8, D-1 to D-8
    meaning: "Pieces of work in the 2026-10-23 resolution workplan. T-n changes tooling (the engine, the writers, the renderer). D-n writes research data. A prompt says which ones it holds up."

decisions:
  - id: OR-1
    gates: true
    title: Which figures may feed a determination for a group of people?
    question: "Should a figure reach a determination only through the lens tags written on that figure, and never through the crossing maps between identity groups, ICF codes and needs?"
    why_yours: "Decision D-0184 says yes and is adopted with review pending, waiting for you. It is a rule about how evidence reaches people, which is doctrine."
    context: |-
      Every figure the project reads from a source is tagged with who it applies to: an identity group, an ICF function code, an access need, a medical condition. A determination is built for one parameter and one lens, for example 'running slope, wheelchair users'.

      D-0184 says a figure counts for a lens only if that lens is written on the figure itself. The alternative walks the crossing maps (identity to ICF to need) to decide which figures apply. D-0184 measured that traversal and rejected it, because it pulls in figures that do not apply.

      In practice, determinations of slope for autistic people, blind people, ADHD, an ICF movement code (d450) and an effort need have no figures written for them yet. Each would read 'pending', with a gap naming the missing lens, instead of borrowing the wheelchair-user figures.
    blocks: "The lens-routing change (T-3) and lens tagging of existing rows (D-2)."
    options:
      - key: "yes"
        label: "Yes, only the lens tags on the figure"
        recommended: true
        effect: "T-3 is built as written. Those five determinations read 'pending' with a gap that names the lens. Unblocks T-3 and D-2."
      - key: "no"
        label: "No, use the crossing maps"
        effect: "You state the traversal rule in your own words. D-0184 is recorded as superseded. T-3 then builds the walk over the identity, ICF and need maps, which is more code and the traversal D-0184 rejected."
    source: "Resolution report section 2 (OR-1); workplan section 4"

  - id: OR-1b
    gates: false
    title: Does a figure tagged for everyone ('ALL') apply to every group?
    question: "Should a figure tagged with the identity code ALL reach the determination of every identity group?"
    why_yours: "It decides whether a statement about everyone counts as evidence about each group."
    context: |-
      Some figures carry the identity code ALL. It is a scope marker: the source speaks to everyone, not to a particular group.

      If ALL figures reached every group, a determination for blind people could rest on a figure that was never about blind people. The page would then have to say the value is a statement of scope, not evidence about that group.
    blocks: "The lens-routing change (T-3)."
    options:
      - key: "no"
        label: "No, ALL reaches only an ALL determination"
        recommended: true
        effect: "ALL figures are used only for a determination whose lens is ALL."
      - key: "yes"
        label: "Yes, ALL reaches every group"
        effect: "T-3 adds one clause so identity determinations also take ALL figures, and the gap text says the value is a scope statement, not evidence about the group."
    source: "Resolution report section 2 (OR-1b)"

  - id: OR-2
    gates: true
    title: How is a conditional claim shown?
    question: "Should a determination show conditional claims as branches beside a headline taken only from unconditioned claims, leaving the headline empty when every claim is conditioned?"
    why_yours: "It changes what a reader sees for a parameter, and the alternatives trade strictness against readability."
    context: |-
      A source may state a figure only under a condition, for example 'a steeper slope is allowed if the ramp is under one metre'. Today a code's step table prints as one number, so the condition disappears.

      The proposal keeps each conditional claim as its own branch, shown beside the headline. The headline comes only from claims with no condition. If every claim has a condition, the headline is empty and the branches are all that is shown.
    blocks: "The conditions change (T-2) and the repair of parameter 3's rows (D-1)."
    options:
      - key: branches-empty-headline
        label: "Branches, and an empty headline when all are conditioned"
        recommended: true
        effect: "T-2 is built as written."
      - key: strictest-branch
        label: "Branches, and the strictest branch as headline when all are conditioned"
        effect: "T-2 composes the headline from all governing rows when none is unconditioned, and the note says so."
      - key: no-branches
        label: "No branches"
        effect: "T-2 is not built. The book prints one number for a code's table, as today."
    source: "Resolution report section 2 (OR-2)"

  - id: OR-3
    gates: true
    title: May a stored figure be reformatted in place?
    question: "May a figure's value, unit and empty setting be reformatted in place, keeping the same digits and quote and recording the old text in notes?"
    why_yours: "It narrows decision D-0168, which says a wrong value is a second row, a recorded contest, and never an overwrite."
    context: |-
      Some stored figures are in awkward forms: '6%' where the value is 6 and the unit is %, '30,0' where it is 30.0, a unit written 'ratio' where it is 'rise:run ratio', or a unit that is really a condition sentence. Reformatting does not change what the source said.

      D-0168 treats any change to a value as a contest: the old row stays and a new row is written. Allowing in-place reformatting only for these cases is a narrow exception to that rule.
    blocks: "The repair of parameter 3's rows (D-1), and the widening of the amend verb (T-1 step 8)."
    options:
      - key: "yes"
        label: "Yes, reformat in place"
        recommended: true
        effect: "The amend verb is widened to unit, value and an empty setting. D-1 repairs the affected rows."
      - key: "no"
        label: "No, write a new row for each"
        effect: "D-1 writes one new row per affected figure, as batch 21 did (row 73 restating row 72 as 30.0). The old rows stay as recorded contests and are still counted as unparsed in every value note."
    source: "Resolution report section 2 (OR-3); decisions/DR-2026-08-27-evidence-is-the-source-judgment-is-the-extraction.md"

  - id: OR-4
    gates: false
    title: Which value wins among anchoring sources that disagree?
    question: "Within T1, Co-1, T2 and Co-2, does the most accommodating value win, whichever of those tiers stated it?"
    why_yours: "It decides whose figure sets a published value when sources of equal standing differ."
    context: |-
      Illustration from the stress test (made-up numbers, not findings): one T1 source says a clear width of at least 900 mm and another T1 source says at least 1500 mm. Under the current rule the more accommodating figure, 1500, wins. T-4 adds a note showing the 900 to 1500 spread.

      The rule is the 2026-07-21 rule as the engine extends it. If you reject it, no replacement exists: the ledger of 2026-09-13 says 'the operands do not exist', so you would have to state one.
    blocks: "The agreement change (T-4), step 4."
    options:
      - key: "yes"
        label: "Yes, the most accommodating value wins"
        recommended: true
        effect: "No change to the rule."
      - key: "no"
        label: "No, I will state a rule"
        effect: "You state a composition rule in your own words. T-4 waits until one exists."
    source: "Resolution report section 2 (OR-4)"

  - id: OR-5
    gates: true
    title: Do lived-experience sources set direction but not a numeric value?
    question: "Does section 6.4 of the evidence-hierarchy mapping hold, so that Co-1 sets direction and identifies barriers but not a dimensional value, and the value comes from T1, T2 or T3 or the regulation's minimum?"
    why_yours: "Co-1 is co-primary with T1 under CRPD Art 4.3 (CLAUDE.md section 6). Whether its figures may set a number is a doctrine question."
    context: |-
      Illustration from the stress test (made-up numbers): T1 says 1000 mm, Co-1 says 1500 mm, T2 says 1200 mm. Today the Co-1 figure wins and sets 1500, which the methodology document says it should not.

      The same document claims a mechanism that expresses this boundary mechanically 'by value-directness'. The stress test found that mechanism does not exist.

      If you say yes, Co-1 figures stay out of the numeric bound but still govern the state and are shown beside the value. In the example the value becomes 1200 and the note names the Co-1 figure.
    blocks: "The agreement change (T-4)."
    options:
      - key: "yes"
        label: "Yes, Co-1 sets direction, not the number"
        recommended: true
        effect: "T-4 step 3 leaves Co-1 rows out of the numeric bound. They still govern the state and are rendered beside the value. The false sentence in section 6.4 is corrected."
      - key: "no"
        label: "No, Co-1 figures may set a value"
        effect: "No engine change. Section 6.4's first sentence and its mechanism claim are deleted, and the architecture document's claim-type split is restated as rendering guidance only."
    source: "Resolution report section 2 (OR-5); references/methodology-evidence-hierarchy-mapping.md section 6.4"

  - id: OR-6
    gates: true
    title: What happens when anchoring claims cannot all be true?
    question: "When anchoring claims cannot all hold, does the determination stay 'stated' with convergence 'divergent', and refuse to be written until an Opus-class session supplies the synthesis approach, as evidence-methodology section 3.3 already says?"
    why_yours: "Section 3.3 is canonical text, so the alternative amends it."
    context: |-
      Illustration from the stress test (made-up numbers): a T1 source says at least 1200 mm and a T2 source says at most 1000 mm. No value satisfies both.

      Section 3.3 says the determination is 'stated', is marked divergent, and carries a synthesis approach written by an Opus-class session. The engine would refuse to write it without one.

      The alternative caps the determination at 'provisional' with a confidence flag naming the divergence.
    blocks: "The agreement change (T-4)."
    options:
      - key: stated-divergent
        label: "Stated and divergent, with a synthesis approach"
        recommended: true
        effect: "T-4 step 2 as written."
      - key: cap-provisional
        label: "Cap at provisional"
        effect: "T-4 step 2 writes 'provisional' with a confidence flag and an optional synthesis approach. That amends section 3.3 ('No fifth state. The cell is stated'), so the ledger records the supersession."
    source: "Resolution report section 2 (OR-6); governance/evidence-methodology.md section 3.3"

  - id: OR-6b
    gates: false
    title: Do floors that differ but can all be met count as divergent?
    question: "Do anchoring floors that differ but can all be met, such as at least 900 and at least 1500, count as divergent?"
    why_yours: "It decides how often a synthesis approach is required."
    context: |-
      Both floors can be satisfied at once by building to 1500, so nothing is incoherent. The question is whether the difference still counts as a divergence that needs a synthesis approach.
    blocks: "The agreement change (T-4)."
    options:
      - key: "no"
        label: "No, the spread is printed in the note"
        recommended: true
        effect: "Not divergent. The spread is printed in the value note."
      - key: "yes"
        label: "Yes, any two different anchoring bounds on one side"
        effect: "T-4 step 2 also marks any two distinct anchoring bounds on one side as divergent, so most cells with several sources need a synthesis approach."
    source: "Resolution report section 2 (OR-6b)"

  - id: OR-7
    gates: false
    title: Does a regulation-only cell appear as a flagged weak row?
    question: "Confirm what 'Option A' already ratifies: a determination resting only on a regulation (T6) appears in the best-practice view as a flagged weak-marker row?"
    why_yours: "Saying no amends two ratified texts."
    context: |-
      Tier-system section 8 and the architecture document already say such a cell appears, flagged and marked weak. The report asks you to confirm rather than assume it.
    blocks: "The renderer (T-5), step 2 only."
    options:
      - key: "yes"
        label: "Yes, show it flagged"
        recommended: true
        effect: "T-5 step 2 drops the 'code floor only' filter from the view."
      - key: "no"
        label: "No, hide it"
        effect: "The view stays as it is, and the architecture document (line 121) and tier-system (line 98) are amended to say 'T4/T5-only'. That changes a ratified text."
    source: "Resolution report section 2 (OR-7)"

  - id: OR-8
    gates: true
    title: What counts as having searched a topic thoroughly?
    question: "Is exhaustion judged per parameter, per jurisdiction in buckets 1 and 2, per language, with the bucket list entered once as a table?"
    why_yours: "It defines the stopping rule for research, which is trajectory."
    context: |-
      Today coverage is counted per research topic (slug), jurisdiction and language. The proposal counts it per parameter instead, over the jurisdictions in buckets 1 and 2, and keeps the bucket list in one table with an approval reference on each row.

      Buckets 1 and 2 are the jurisdictions your 2026-09-28 ruling says must be exhausted before reaching further, for any topic.
    blocks: "The coverage tooling (T-6b steps 4 and 5)."
    options:
      - key: "yes"
        label: "Yes, per parameter and bucket"
        recommended: true
        effect: "T-6 steps 4 and 5 are built."
      - key: "no"
        label: "No, keep per slug"
        effect: "Coverage stays per slug, jurisdiction and language, and T-6 builds steps 1 to 3 only."
    source: "Resolution report section 2 (OR-8)"

  - id: OR-9
    gates: false
    title: Which indices must be searched for each evidence type?
    question: "Name the indices that must be searched for each evidence type, or answer 'none yet'."
    why_yours: "Which databases count as 'looked everywhere' is your call."
    context: |-
      Today nothing records which indices (for example PubMed or a standards registry) a search must cover before a topic counts as searched. The report recommends leaving this open until the coverage tooling exists.
    blocks: "The coverage tooling (T-6b step 6)."
    options:
      - key: none-yet
        label: "None yet"
        recommended: true
        effect: "T-6 step 6 is not built."
      - key: name-them
        label: "I will name them"
        effect: "Write the indices in the note. T-6 step 6 adds a table of search indices seeded with them."
    source: "Resolution report section 2 (OR-9)"

  - id: OR-10
    gates: false
    title: Convert exact length units?
    question: "May the engine compose across exact length units (inches and feet to millimetres and metres), presenting both, as it already does for ratio and percent?"
    why_yours: "It extends your 2026-09-17 ruling, whose ACTION (4) keeps units apart."
    context: |-
      Inches and feet convert to millimetres and metres exactly. Sources in the US and elsewhere state lengths in different units. Without conversion, a length parameter with both kinds of source cannot be composed.
    blocks: "The reading change (T-1 step 9)."
    options:
      - key: "yes"
        label: "Yes, convert and show both"
        recommended: true
        effect: "T-1 step 9 is built. It bumps the engine's rule version."
      - key: "no"
        label: "No, keep units apart"
        effect: "Every length parameter with US and metric sources declines to compose, with the message 'different units'."
    source: "Resolution report section 2 (OR-10)"

  - id: OR-11a
    gates: false
    title: Must 'verified' mean the source was read in full?
    question: "Does an extraction marked 'verified' require a recorded full-scope reading of the source that covers the figure's parameter?"
    why_yours: "It gives the word 'verified' a meaning the database can check."
    context: |-
      Today 'verified' is a word the writer sets. Nothing checks it against an actual reading.
    blocks: "The reading change (T-1 step 10)."
    options:
      - key: "yes"
        label: "Yes, require a full-scope scan"
        recommended: true
        effect: "T-1 step 10 is built, and the renderer prints the status for each row."
      - key: "no"
        label: "No, leave it as a word"
        effect: "'Verified' stays an unread, self-declared status. Nothing reads it today."
    source: "Resolution report section 2 (OR-11a)"

  - id: OR-11b
    gates: false
    title: May a figure read in full but not yet reviewed set a value?
    question: "May a figure read in full but still 'preliminary' (not reviewed) set a published value?"
    why_yours: "It has been open since 2026-10-09 and the code's own comment forbids deciding it without you."
    context: |-
      A figure read from the whole text can still carry the status 'preliminary' because nobody has reviewed it. The question is whether that is enough to set a published value, with a flag.
    blocks: "The flag in the renderer (T-5)."
    options:
      - key: yes-flagged
        label: "Yes, flagged"
        recommended: true
        effect: "No engine change. The renderer flags 'preliminary' rows."
      - key: "no"
        label: "No"
        effect: "Add 'preliminary' to the rule beside the not-publishable methods. The comment there forbids doing that without this answer. It adds a line of code that no work item owns yet."
    source: "Resolution report section 2 (OR-11b); workplan section 4"

  - id: OR-12a
    gates: false
    title: Scope four languages out until buckets 1 and 2 are exhausted?
    question: "Are Arabic, Bengali, Hindi and Swahili, which the language-to-jurisdiction map requires and which have no aliases, scoped out by the bucket table until buckets 1 and 2 are exhausted?"
    why_yours: "It sets the language scope of the research."
    context: |-
      The map of languages to jurisdictions lists AR, BN, HI and SW, but the project has no search aliases for them, so they cannot be searched properly.
    blocks: "The search-term tooling (T-6b step 3)."
    options:
      - key: "yes"
        label: "Yes, scope them out for now"
        recommended: true
        effect: "They wait behind buckets 1 and 2."
      - key: "no"
        label: "No, build aliases now"
        effect: "Alias building for those four languages becomes research debt."
    source: "Resolution report section 2 (OR-12 a)"

  - id: OR-12b
    gates: false
    title: May a model-generated alias be used if the search is flagged?
    question: "May an alias that a model generated be used for a search, if the search is flagged as using it?"
    why_yours: "It concerns the provenance of search terms."
    context: |-
      Some search aliases were generated by a model rather than taken from a source. `python3 scripts/audit/alias_provenance_audit.py` lists them.
    blocks: "The search-term tooling (T-6b step 3)."
    options:
      - key: "yes"
        label: "Yes, flagged"
        recommended: true
        effect: "Searches using them are flagged."
      - key: "no"
        label: "No"
        effect: "The model-generated aliases become unusable for searching at once."
    source: "Resolution report section 2 (OR-12 b)"

  - id: OR-13
    gates: false
    title: Seed the list of quantities from the codes already held, or topic by topic?
    question: "Should the quantity list be seeded by an open-pass scan of the bucket 1 and 2 codes already held, rather than slug by slug?"
    why_yours: "It was left open on 2026-10-09 (the unanswered 06:07 choice)."
    context: |-
      The list of design quantities (parameters) has to come from somewhere that does not state answers in advance. One route scans the regulations the project already holds and records the phrases they use. The other builds the list one research topic at a time from that topic's admitted sources.
    blocks: "Quantity seeding (D-8)."
    options:
      - key: codes
        label: "From the codes held"
        recommended: true
        effect: "D-8 as written."
      - key: slugs
        label: "Slug by slug"
        effect: "D-8 runs per slug from the slug's admitted sources."
    source: "Resolution report section 2 (OR-13)"

  - id: OR-14
    gates: false
    title: Derive a page for an element, such as a ramp?
    question: "Should a book page for an element (a ramp) be derived from a typed term pointer to its parameters' live determinations, with 'one parameter' as the degenerate case, and never be a container that rows are filed into?"
    why_yours: "It is the largest optional item, and it answers your repeated question about assembling a ramp as a whole."
    context: |-
      A coherent ramp specification needs slope, run, landing, rails, surface and location together. The old item layer used to provide containers for that, and was deleted because a container named for its answer biases every finding filed into it.

      The proposal is a page assembled on demand from the live determinations of the parameters a ramp points to. It holds no value and no item code of its own.
    blocks: "The element pointer (T-7) and its data (D-6)."
    options:
      - key: "yes"
        label: "Yes, derive it"
        recommended: true
        effect: "T-7 and D-6 are built (about 70 to 100 lines of code)."
      - key: "no"
        label: "No, pages are per parameter"
        effect: "Pages are per parameter only, and the ramp-as-a-whole question stays open."
    source: "Resolution report section 2 (OR-14)"

  - id: OR-15
    gates: false
    title: Use held batch-23 material for the inter-rater test?
    question: "Should the test of whether two readers extract the same figures use held batch-23 material, one code with a step table and one T1 paper with findings?"
    why_yours: "You choose the test material."
    context: |-
      To learn whether two independent readers record the same rows from the same source, the project needs a test set. Batch 23 already holds suitable material.
    blocks: "Inter-rater calibration (D-5)."
    options:
      - key: "yes"
        label: "Yes, use batch 23's material"
        recommended: true
        effect: "D-5 as written."
      - key: "no"
        label: "No, I will name the material"
        effect: "Name it in the note."
    source: "Resolution report section 2 (OR-15)"

  - id: OR-16
    gates: false
    title: Read the sources already held before fetching more?
    question: "Should sources already held, inside and outside buckets 1 and 2, be read before more are fetched?"
    why_yours: "It sets the order of research work."
    context: |-
      The project holds sources it has not fully read. Reading them first costs nothing in retrieval and may close gaps that fetching would only widen.
    blocks: "The scope of the scan work (D-3)."
    options:
      - key: "yes"
        label: "Yes, read what we hold first"
        recommended: true
        effect: "D-3 covers every source that has not been superseded."
      - key: "no"
        label: "No, only bucket 1 and 2 jurisdictions"
        effect: "D-3 is limited to bucket 1 and 2 jurisdictions."
    source: "Resolution report section 2 (OR-16)"

  - id: OR-17
    gates: false
    title: May the assistant approve vocabulary in bulk?
    question: "May the assistant approve new vocabulary in bulk under LED-154, with you reading the pull request?"
    why_yours: "LED-154 delegates adjudication only for enumerated items. Anything beyond them is yours."
    context: |-
      Turning observed phrases into aliases and seeding quantity names means approving many terms. Approving each one individually would put a long table in front of you before each mint. You said on 2026-10-14 you had 'no idea what these are' and asked for them to be resolved in a logical manner, which is the delegation this question extends.
    blocks: "The pace of alias and quantity work (D-4, D-8)."
    options:
      - key: "yes"
        label: "Yes, bulk, with me reading the PR"
        recommended: true
        effect: "D-4 and D-8 proceed with the assistant approving and you reading the pull request."
      - key: "no"
        label: "No, send each table to me first"
        effect: "Each D-4 and D-8 approval table comes to you before anything is minted."
    source: "Resolution report section 2 (OR-17)"

  - id: OR-18
    gates: false
    title: Are the saved transcripts enough to know which model and effort did the work?
    question: "Is the preserved transcript record, with model and effort on every assistant message, enough, or must each session record state them?"
    why_yours: "It sets what a session record must contain."
    context: |-
      The database stores no model or effort. The transcripts under transcripts/harness_*/ carry both on every assistant message.
    blocks: "Reporting for the calibration work (D-5)."
    options:
      - key: transcripts
        label: "Transcripts suffice"
        recommended: true
        effect: "D-5 derives model and effort from the transcripts."
      - key: state-them
        label: "Session records must state them"
        effect: "Every session record gains 'Model:' and 'Effort:' header lines, a convention last used on 2026-07-25."
    source: "Resolution report section 2 (OR-18)"

  - id: OR-19
    gates: false
    title: Presume a grey source repeating a code value is an echo?
    question: "Confirm the rebuttable-presumption shape: a grey source that repeats a code's value is presumed to echo the code, and is not re-tiered?"
    why_yours: "It affects how independent evidence is counted."
    context: |-
      A grey (T3) source stating the same number as a building code may simply be quoting the code. Counting it as independent would overstate agreement.
    blocks: "The roots tooling (T-8 step 3)."
    options:
      - key: "yes"
        label: "Yes, presume an echo"
        recommended: true
        effect: "T-8 step 3 applies the presumption. It can be rebutted."
      - key: "no"
        label: "No"
        effect: "T-8 does not apply it."
    source: "Resolution report section 2 (OR-19)"

  - id: OR-20
    gates: false
    title: Trace standards back to their original studies?
    question: "Should T4 to T6 anchors be mined backward, for root tracing only?"
    why_yours: "It amends the research contract's rule R2."
    context: |-
      Mining backward follows a standard's citations to find the study its figure came from, so that figures repeated across sources are not counted as independent. The report recommends not doing it now.
    blocks: "Roots data (D-7)."
    options:
      - key: "no"
        label: "No"
        recommended: true
        effect: "No change."
      - key: "yes"
        label: "Yes"
        effect: "An amendment of research contract rule R2, and D-7 gains a mining pass."
    source: "Resolution report section 2 (OR-20)"

  - id: OR-21
    gates: false
    title: Record a direction per lens when a direction is contested?
    question: "When a direction is contested, should a direction be recorded for each lens?"
    why_yours: "It would change what 'direction' means."
    context: |-
      The query that finds the case where this arises returns nothing today, so nothing is built either way.
    blocks: "Nothing now."
    options:
      - key: when-it-arises
        label: "Yes, when it first arises"
        recommended: true
        effect: "Nothing is built now."
      - key: "no"
        label: "No"
        effect: "Nothing is built now."
    source: "Resolution report section 2 (OR-21)"

  - id: OR-22
    gates: false
    title: What is a floor claim that a study confirms?
    question: "What kind of determination is a floor claim that a study confirms, when every row of that study is an absence finding?"
    why_yours: "Your 2026-09-13 ruling says a code value a study confirms is upgraded. Migration 116 holds a regulation-only floor at weak. Neither says what this cell is."
    context: |-
      REF-00980 is this case. It reports that it found no grounds to change a requirement, which you ruled on 2026-10-21 supports the tested value. Because all its rows are absences, no finding gives direction, so the cell is not a proxy determination. It is a regulation-only floor claim, and migration 116's rule keeps those at the weak marker, so a confirmation does not lift it.

      The ledger of 2026-10-22 (Correction, item 2) records this as yours to rule. There is no recommendation on record.
    blocks: "The REF-00980 cell in the first render (S-1). It is left out until you rule."
    options:
      - key: stays-weak
        label: "It stays a regulation-only floor, shown with the study beside it"
        effect: "No change. The confirming study is displayed but does not lift the marker."
      - key: lifts
        label: "A confirmed floor claim reads stronger"
        effect: "A new kind of determination, or a change to migration 116's rule, so that a confirmation lifts it. Say in the note what marker it should read."
      - key: other
        label: "Something else"
        effect: "Say what in the note."
    source: "Ledger 2026-10-22, Correction item 2; resolution report section 2 (OR-22)"

  - id: OR-23
    gates: false
    title: "Confirm: an unretrievable source keeps its tier but earns nothing above weak"
    question: "Confirm tier-system section 8: an unretrievable source keeps its tier and may still anchor, but earns no marker above the empty circle?"
    why_yours: "The ledger marks the 'keeps its tier and may anchor' half as the assistant's reading of the engine's behaviour, not something you were asked."
