# Exemptions for scripts/audit/schema_reference_audit.py.
#
# An exemption does NOT hide a finding: the check prints it as KNOWN with the
# reason below, and does not fail on it. An exemption that matches nothing is
# reported as STALE, so it cannot outlive the thing it exempts.
#
# Adding one is a claim that the reference is deliberate. Write the evidence.

zzz_phantom: >-
  Selftest fixture in scripts/audit/graph_audit.py -- a table name chosen
  BECAUSE it does not exist, to prove the audit reports a phantom.

no_such_table: >-
  Selftest fixture in scripts/audit/graph_audit.py, same purpose as zzz_phantom.

real_table: >-
  Selftest fixture in scripts/audit/graph/extract_code.py, proving the extractor
  distinguishes a real CREATE TABLE from a mention of one.

evidence_sources_v1_legacy: >-
  Guarded reference. scripts/tests/test_db_integrity.py reads it only after
  SELECT COUNT(*) FROM sqlite_master WHERE name='evidence_sources_v1_legacy'
  returns non-zero -- the parity check runs only while the legacy table exists.

items: >-
  Deliberate reference to the PRE-RESET corpus, not the live schema. scripts/db.py
  (_item_subject) opens
  _archived/data/corpus-pre-reset-2026-08-06.db read-only and immutable and reads its
  `items.name`, the 93 item subjects the owner admitted as a basis on 2026-11-06 (ledger:
  "Owner statements 2026-11-06"). The live database has no `items` table (migration
  drop_item_layer_cluster) and a rebuild does not restore one.
