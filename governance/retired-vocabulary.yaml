# retired-vocabulary.yaml — tokens that are READABLE AND WRONG.
#
# STATUS: OPERATIVE. Consumed by scripts/audit/retired_vocabulary_audit.py, which
# is registered in governance/check-registry.yaml as `retired_vocabulary` at level
# `advisory` (house norm: a newly-wired check starts advisory).
#
# WHAT THIS FILE IS FOR
# ---------------------
# The failure mode it addresses is not untidiness. It is this: a session greps for
# a fact, gets several answers, and cannot tell which is current. Every entry below
# is a string that still returns hits on the live surface and whose hits are wrong —
# a column that no longer exists, a workflow that was folded into another, a
# database path that was never the database, a population umbrella that doctrine
# bans. The cost of each is measured in the same unit: a wrong answer delivered
# confidently to whoever greps next.
#
# ADMISSION TEST — an entry belongs here only if ALL FOUR hold
# -----------------------------------------------------------
#   1. The token is retired by a NAMED authority (a DR, a migration, a dated
#      consolidation commit) — not by anyone's sense that it reads oddly.
#   2. The REPLACEMENT HAS ALREADY LANDED. A token retired by a decision whose
#      implementing migration has not run is still describing live data correctly.
#      Flagging it produces noise and teaches the reader to ignore the check.
#   3. A grep of the live surface today returns hits that are WRONG IN CONTEXT —
#      not merely historical.
#   4. The token can be matched MECHANICALLY without a judgment call. If telling a
#      true hit from a false one needs a human read of the surrounding paragraph,
#      it is not a tripwire; it is a backlog item.
#
# Entries that fail test 2 or 4 belong in `deferred:` or `rejected:` at the bottom,
# WITH THEIR REASONING. Those two sections are not filler. They exist so the next
# session does not spend an hour re-deriving a conclusion already reached, and then
# add an entry that floods the check. Read them before adding anything.
#
# MENTION vs USE
# --------------
# A document that RETIRES a token must be able to name it. Three mechanisms:
#   * global `exempt_paths` — immutable and historical records, listed below
#   * per-entry `exempt_paths` — the specific live files licensed to say it
#   * the inline escape `[RETIRED-VOCAB-OK]` anywhere on the same line
# The inline escape is deliberately noisy to type. Reaching for it often is a
# signal the entry is wrong, not that the file is special.
#
# THE TWO LICENSED MENTIONS — read this before adding an exemption
# ----------------------------------------------------------------
#   A. THE DOCUMENTS THAT RECORD THE RETIREMENT. The paper trail cannot
#      describe a retirement without naming what was retired.
#   B. FILES WHERE THE TOKEN IS STILL CORRECT. A crosswalk that maps the old
#      value to the new one must hold the old value; a scratch-path default is
#      the right use of a scratch path; a test fixture may legitimately seed a
#      retired value to prove the checker catches it.
#   Nothing else. In particular, NOT "this file has too many hits to fix".
#
#   Category B was added 2026-08-05 after an adversarial review pointed out that
#   RV-009 already exempted `scripts/tests/**` and `bootstrap.sh` on exactly this
#   ground, while the rule text admitted only category A — so the stated rule and
#   the actual exemption set disagreed. Declaring the category is the honest fix;
#   quietly widening category A would have been the dishonest one.
#
# So `ci.yml`'s header may say what it absorbed; `check-registry.yaml`'s header
# may say which four lists it replaced; CLAUDE.md may narrate the 2026-08-01
# fold. Those files are the retirement's paper trail and cannot describe it
# without naming it. A workplan that USES a retired name as a live instruction
# is not covered, no matter how convenient the exemption would be. The
# distinction is exactly mention-vs-use, and getting it wrong in the permissive
# direction turns this file into a way of making the check green rather than a
# way of making the repo true.
#
# Corollary, learned while first tuning this register: per-file exemptions are
# too COARSE for source files, which routinely both use and discuss a token —
# scripts/db.py names `doi_less_key` in a comment explaining that it strips the
# key (licensed) AND names `applicable_groups` in a live write path (a defect).
# Exempt per entry, never blanket, and use the inline escape for single lines.
#
# COUNTS IN `note:` FIELDS are DATED MEASUREMENTS, not invariants — same convention
# as check-registry.yaml. Use one to decide where to look, never to report state.

schema_version: 1

# --- global exemptions ------------------------------------------------------
# Paths whose whole purpose is to preserve text as written. Sweeping these would
# contradict the repo's forward-only, immutable-record convention — the same
# principle DR-2026-07-21 §4 invoked when it refused to rewrite `E-##` in past
# records, and the reason migrations are append-only (CLAUDE.md §4).
exempt_paths:
  - "_archived/**"                 # retired-but-preserved, mirrors origin paths
  - "scripts/migrations/**"        # append-only, immutable once committed
  - "sessions/**"                  # append-only session records
  - "decisions/**"                 # DRs are the record OF a retirement
  - "data/decisions/decision_register.yaml"   # the shadow store of decisions/, same class
  - "attestations/**"              # append-only adherence log; reattestation[] is forward-only
  - "references/project-standards.md"         # THE append-only operative rule ledger (CLAUDE.md §5)
  - "audits/**"                    # dated reports, frozen at their date
  - "references/audits/**"         # ditto
  - "references/search-log/**"     # verbatim query logs; R8 forbids backfilling
  - "workplan/_superseded/**"      # superseded by definition
  # A DATED workplan records a plan as it stood on that date, exactly as a dated
  # audit records findings as they stood. Rewriting `audit.yml` inside a
  # 2026-05-17 build plan would falsify what was actually planned in May. UNDATED
  # workplans are NOT exempt: they read as standing instructions, and
  # workplan/workplan-item-audit-pipeline-co0009.md is the worked example — it
  # names both a retired column and a database path that does not exist.
  - "workplan/*20??-??-??*.md"
  - "versions/**"                  # historical version snapshots
  # The two documented legacy script directories. CLAUDE.md §7 places both
  # outside the GUIDEBOOK_DB_PATH contract, and scripts/migrate/** is disarmed by
  # scripts/migrate/_legacy_guard.py. They encode the PRE-SQLite schema on
  # purpose: rewriting them would falsify the import they record, and commit
  # 366766ee deliberately kept them because architecture/sqlite-data-layer.md §9
  # names six of them in its build table. Guarded, not corrected.
  - "scripts/migrate/**"
  - "scripts/db/**"
  - "**/__pycache__/**"
  - ".git/**"
  - "governance/retired-vocabulary.yaml"           # this file names every token
  - "scripts/audit/retired_vocabulary_audit.py"    # so does its reader

# --- active entries ---------------------------------------------------------
entries:

  - id: RV-001
    token: applicable_groups
    match: identifier
    severity: broken
    retired_by: "schema migration — column dropped from `items`"
    replacement: "item_population_links (the junction that replaced the packed column)"
    note: >-
      Not a naming preference: the column DOES NOT EXIST in the live schema
      (verified against data/guidebook.db 2026-08-05 — all 67 tables and all 18
      views; a view could otherwise still expose it). Code that
      names it does not return a stale answer — it raises OperationalError.
      This is exactly how scripts/migrate/migrate_items.py was discovered: it took
      no required arguments, opened the canonical DB immediately, and was saved
      from writing it only by crashing on this column name. Measured 2026-08-05:
      17 files repo-wide before exemptions.

