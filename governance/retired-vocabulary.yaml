  # deferral was written by copying the DR's own status block, which still reads
  # "Ratified != executed ... B01/B02/B05 stay red until it does". That line was
  # true when the DR was drafted and is frozen there correctly — decisions/ is an
  # append-only record. The register is NOT. Reading a frozen document for a
  # volatile fact, instead of querying the database, is the precise failure this
  # whole file exists to catch, committed by this file. CLAUDE.md's standing
  # instruction covers it in one line: when a fact is volatile, derive it from the
  # live repo rather than trusting a number written down.
  #
  # The cost was not hypothetical. The deferral also said "Do not promote one
  # without checking its precondition", so an obedient session would have TRUSTED
  # it and left the largest wrong-answer class on the surface unswept.
  #
  # Substring trap, pre-solved: `match: identifier` is required, not optional — a
  # literal search for VERIFIED-1 also matches UNVERIFIED-1, and for
  # VERIFIED-WITH-CORRECTION it would double-count. See build_pattern().

