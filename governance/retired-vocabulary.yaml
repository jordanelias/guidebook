      - "architecture/sqlite-data-layer.md"
    note: >-
      Same class as RV-001 — the column is absent from every live table. This is
      the name that breaks scripts/validate_db.py (`no such column: doi_less_key`),
      which is why that script is quarantined in check-registry.yaml rather than
      run. A crashing gate reads as noise; see the registry's `broken` status note.
      validate_db.py is deliberately NOT exempted: it does not discuss the column,
      it queries it, and the check should keep saying so until the script is fixed
      or retired (an owner decision — see the registry's `broken` status).
      scripts/migrate_evidence_sources_v2.py is exempt on different grounds: it is
      a one-time migrator that reads the OLD schema by design, and its inputs are
