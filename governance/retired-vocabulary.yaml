# --- deferred: correct to retire, NOT YET SAFE TO FLAG ----------------------
# These fail admission test 2 — the replacement has not landed — so flagging them
# today would flag accurate descriptions of live data. Each records the precondition
# that would promote it. Do not promote one without checking its precondition.
deferred:

  - tokens: [VIS, UPL, DBL, NEU, PCS, OFS, CFS, MCAS, POTS, LCOV, SENS, EXH, IntD, ABI]
    retired_by: >-
      DR-2026-07-23-population-schema-replace (ADOPTED, DG-NON — population
      taxonomy is owner-only). Crosswalk: VIS->BLIND, UPL->LMB, DBL->DEAFBLIND,
      {NEU,PCS}->BRAIN, {OFS,CFS,MCAS,POTS,LCOV}->COM, SENS->NDV, EXH->TALL,
      IntD->ID, ABI->BRAIN.
    precondition: >-
      Fails admission test 4, and this is not close. Several tokens are CONDITION
      NAMES as well as former codes: POTS, MCAS, CFS and ABI all appear in the
      corpus as clinical terms in sentences that are correct English and correct
      evidence. `references/bpc/health-and-symptom-management/pain-ofs-built-
      environment-design.md` legitimately discusses OFS as a concept throughout.
      No regex separates the code use from the clinical use; only reading the
      sentence does. Wiring this would make the check wrong hundreds of files at a
      time, which trains readers to ignore it — the exact failure the `rejected:`
      section below exists to prevent.
      It also fails test 3 for most of its volume: the bulk sits in the research
      corpus, where a sweep is a CONTENT MIGRATION requiring per-file judgment and
      owner scope, not a text substitution.
    note: >-
      Measured 2026-08-05 over the 869 live-surface files this register scans:
      4,820 occurrences total. OFS 1,289 · VIS 840 · NEU 790 · DBL 523 · IntD 421 ·
      UPL 229 · SENS 152 · CFS 148 · MCAS 140 · PCS 93 · POTS 87 · ABI 72 · EXH 30 ·
      LCOV 6. Concentrated in references/connection-register-active.md,
      references/connections/**, references/claim-reference-join.json and the BPC
      corpus.
      Restricted to skills/ scripts/ schemas/ tools/ governance/ it is ~390
      occurrences across 267 files — a bounded, tractable sweep, and the one worth
      doing first, because those files INSTRUCT sessions. A skill that says "scope
      to UPL" makes the next session write a query against a code that does not
      exist.
      WHAT IS ALREADY ENFORCED, so this deferral is narrower than it looks: the
      DATABASE side is checked. scripts/validate_population.py (rewritten
      2026-08-05) grades every population-bearing column against the live taxonomy
      and reports retired codes with the crosswalk above. What is deferred is the
      PROSE, not the data.
      Promotion path, if the owner scopes it: add these as entries with the
      infrastructure directories in scope and the corpus deferred — which needs a
      per-entry `scope_paths` the reader does not yet support. Do not fake it with
      exempt_paths covering references/**; that would violate the licensed-mention
      rule at the top of this file and hide the larger half of the problem.

  - tokens: [DISPUTED]
    retired_by: "partially — DR-2026-08-04 §4.4"
    precondition: >-
      NOT fully retired, and this is the trap. The DR preserves DISPUTED as the
      closure reason `disputed-existence`, explicitly "because of the possibility
      that there is no resolution for something". Only its use as a
      verification_status value is retired. A bare token match cannot separate the
      two, so this fails admission test 4 as well as test 2. If promoted at all it
      must match the status use specifically, not the word.

# --- rejected: will NOT be added, and why -----------------------------------
# Adding any of these would flood the check and train readers to ignore it. Each
# was considered against the admission test on 2026-08-05 and failed.
rejected:

  - tokens: [cell_id]
    reason: >-
      Retired with RV-020/RV-021 (renamed to `specification_id` by schema 055) but
      fails admission test 4. `cell_id` is a bare column name, and
      architecture/schema-spec.md's aspirational `cell` table — a design that never
      shipped and is reconciled elsewhere — declares its own `cell_id TEXT PRIMARY
      KEY` fourteen times. No regex separates a stale reference to the renamed
      column from a correct reference to a design document's own field; only
      reading the surrounding block does. RV-020 and RV-021 already catch every
      case that matters, because a stale `cell_id` can only ever appear in a query
      that also names one of the two renamed tables. Adding it would flag the
      design spec on every run and train the reader to ignore the check — the exact
      outcome this section exists to prevent.

  - tokens: ["E-01 .. E-20 (entity codes)"]
    reason: >-
      Fails admission test 4, irreducibly. `E-08` is simultaneously the Item ENTITY
      TYPE (retired spelling) and Corridor Clear Width, a live `items.item_code`
      (correct spelling). No regex separates them; only reading the sentence does.
      DR-2026-07-21 §4 reached the same conclusion and excluded the sweep
      deliberately — it renamed the entity side precisely BECAUSE the item side is
      a data key that must not move. Re-deriving this costs an hour; do not.

  - tokens: [cross-population]
    reason: >-
      Fails admission test 3 in a way worth stating plainly: the token is retired by
      CO-0003 ("use co-occurring disability or multi-population"), but
      references/project-standards.md — the OPERATIVE ledger that carries the
      retirement — goes on to use the retired term in at least five later rules of
      its own. The rule is contradicted by its own authority. That is a finding
      requiring adjudication, not a tripwire; wiring a check to a self-contradicting
      rule makes the check wrong ~175 files at a time. Raise it as a DR.

  - tokens: ["two-marker scheme"]
    reason: >-
      Fails test 4. The drift between mission-and-epistemics.md's two-marker
      scheme and tier-system.md's operative three-marker scheme is real and is
      already recorded in CLAUDE.md §6, but it is expressed as prose about markers,
      not as a distinguishable token. The fix is to reconcile the doctrine
      documents, which is item F, not to grep for symbols that both schemes share.
