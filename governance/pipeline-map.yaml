    note: >
      Owner-gated rename pending: if the table catalogues jurisdictions it should
      be called `jurisdictions`, and the value columns should go with the rename.

  - id: BRK-23
    severity: medium
    verdict: NEW
    scope: map coverage
    kind: TABLES_IN_NO_LAYER
    detail: >
      13 of the 65 live tables appear in no layer above:
      case_study_outcomes, case_study_populations, case_study_specs,
      case_study_strategies, citation_population_links, data_migrations,
      decisions, economics_entry_populations, economics_entry_specs,
      extraction_population_links, item_audit_runs, pipeline_runs,
      probe_population_links.
    consequence: >
      A sequencer driven from this file would never visit them. Two classes:
      the *_populations / *_specs / *_links join tables are the SECOND HOP of
      layer-3 entities the map named only at their head table (case_studies,
      economics_entries, source_value_extractions, spec_value_probes,
      citation_mining) — so the map records the entity and drops its
      attachments, which is the same shape as BRK-03. data_migrations and
      decisions are standalone by design. pipeline_runs and item_audit_runs are
      job-owned run records.
    guard: none — no check compares this file against sqlite_master

  - id: BRK-24
    severity: medium
    verdict: NEW
    scope: read surface
    kind: VIEWS_UNREAD_AND_UNMAPPED
    detail: >
      The first draft of this file did not mention views at all. 17 exist; 11
      have zero code readers (see `views:` above). One, v_best_practice, holds a
      SEMANTIC GUARD in its WHERE clause — the "code floors and pending cells
      are not best practice" rule — enforced there and nowhere else.
    consequence: >
      Two failures in one. A reader that queries `specifications` directly gets
      an answer set the project's own rule excludes, with nothing to warn it.
      And 11 views are unread apparatus by CLAUDE.md 1's own test — the same
      defect class as BRK-18, eleven times over, on the read side.
    guard: none

# ---------------------------------------------------------------------------
# UNENFORCED CONTRACT CRITERIA. Declared in governance/pipeline-contract.yaml
# with `check: null`. The sequencer must treat these transitions as unguarded.
# ---------------------------------------------------------------------------
unenforced_transitions:
  - {stage: collection, criterion: discovery-provenance}
  - {stage: judgment,   criterion: derivation-handshake}
  - {stage: judgment,   criterion: convergence-independence}
  - {stage: synthesis,  criterion: opus-routing}
  - stage: render
    criterion: render-freshness
    qualification: >
      QUALIFIED 2026-08-21. The contract declares `check: null`, and the
      criterion's own text says "parts/ has no committed fingerprint gate" —
      both true. But four registered freshness checks DO exist and run on the
      render kind: site_pages_fresh, evidentiary_audit_fresh,
      pipeline_completeness_fresh and context_map_fresh. All four are ADVISORY,
      and none covers parts/. So this transition is unenforced in the sense the
      contract means (nothing BLOCKS on staleness) but not unwatched. Reading it
      as "no check exists" would be wrong.

# ---------------------------------------------------------------------------
# PATHS THAT SELECT NO CHECK BATTERY (run_checks.classify() -> no kind).
# A change here runs only the 8 `always` checks.
# ---------------------------------------------------------------------------
unclassified_paths:
  - path: "retrieval-log/**"
    why_it_matters: the fabrication-defence artefact store (BRK-07)
  - path: "working/**"
    why_it_matters: >
      contains working/claims-docket.md and working/pilot/pilot-renderings.html,
      both SUBJECTS of registered checks whose kinds a working/-only diff never
      selects
  - path: "references/standards-registry.md"
    why_it_matters: the subject of the BLOCKING validate_jurisdiction check
  - path: "skills/**"
  - path: "references/search-log/**"
  - path: "workplan/**"
  - path: "audits/** (except evidentiary-base-audit*)"
  - path: "CLAUDE.md, README.md, .ignore"

# ---------------------------------------------------------------------------
# ISLANDS. No FK in, no FK out.
# CORRECTED 2026-08-21 — the first draft's `populated_and_unread` and
# `empty_and_unwritten` lists were both wrong, in the same direction: they
# asserted absence of readers/writers without checking view SQL or job scripts.
# ---------------------------------------------------------------------------
islands:
  populated_and_unread: [source_locators, weighting_profile, access_duration,
                         access_stakes, life_stage_modifiers]
    # REMOVED: lang_jur_map. It has 70 rows and at least four readers —
    # scripts/audit/alias_provenance_audit.py (BLOCKING), scripts/db.py,
    # tools/pipeline_completeness.py, and the view v_coverage_priority. It is
    # not an island; it is the required-coverage bridge those readers denominate
    # against. The draft asserted "unread" without grepping.
  empty_and_unwritten:  [situations, external_root_registry]
  island_detail:
    - {table: access_duration,       rows: 3, code_readers: 0, view_readers: 0}
    - {table: access_stakes,         rows: 3, code_readers: 0, view_readers: 0}
    - {table: life_stage_modifiers,  rows: 2, code_readers: 0, view_readers: 0}
    - {table: weighting_profile,     rows: 5, code_readers: 0, view_readers: 0,
       note: "one grep hit exists at scripts/emit_data_migration.py:603 — it is an
              EXAMPLE STRING inside a docstring, not a reader. Counted as zero."}
    - {table: source_locators,       rows: 835, code_readers: 0, view_readers: 0, see: BRK-01}
    - {table: situations,            rows: 0, code_readers: 0, view_readers: 0}
    - table: external_root_registry
      rows: 0
      code_readers: 0
      view_readers: 3
      views: [v_registry_duplicate_descriptions, v_unregistered_roots, v_value_independence]
      note: >
        The one genuinely interesting island. It is empty and has no code
        reader, but three views query it — and all three are in the
        `with_zero_code_readers` list above. So it is read by apparatus that
        nothing reads: an unread table behind unread views. Two layers of
        CLAUDE.md 1's "nothing is added without naming what reads it", stacked.
    # REMOVED: pipeline_runs and url_verification_runs. Both are EMPTY but both
    # have code writers — scripts/resolve_dois.py:681/726/1013 and
    # scripts/verify_urls.py:377/474/515 respectively. They are job-owned run
    # records that no job has run against the canonical DB, which is a different
    # condition from unwritten and carries a different remedy (run the job, not
    # write the writer). pipeline_runs is additionally EXEMPT from
    # migration_reproducibility by DR-2026-05-28, precisely because it IS
    # job-written.
  standalone_by_design: [decisions, data_migrations]
  in_practice: >
    `rooms` (17 rows) has FK edges but is an island in practice: its only bridge
    (room_items) is empty and its only would-be reader queries phantom tables.

# ---------------------------------------------------------------------------
# WHAT THE ANTAGONIST PASSES CHANGED. Kept so the next reader can calibrate how
# much to trust an unrefuted survey.
# ---------------------------------------------------------------------------
verification_record:
  claims_tested: 20
  sustained_on_substance: 19
  cut_back: [BRK-15]
  supporting_assertions_found_wrong: 6
  wrong_assertions:
    - "BRK-01 guard: 'zero live code readers' — true semantically, false literally (deep check walks it)"
    - "BRK-02 guard: 'none that reads the DB' — L02 is blocking, reads the DB, and fired"
    - "BRK-03 guard: 'none' — H01/H02 blocking parity exists (though vacuous today)"
    - "islands: lang_jur_map listed unread — it has 4+ readers including a blocking check"
    - "islands: pipeline_runs / url_verification_runs listed unwritten — both have code writers"
    - "stage 2 steps_total: 14 — the instrument has 13 steps (0-12), two of them coded CLI"
  models_refuted:
    - "the four-stage linear model — stages are re-entrant layers, not phases; see `loops:`"
    - "stage 4 'unreachable' — 93 item pages render today; the SPECIFICATION-backed surface is what is empty"
  omissions_found: [BRK-21, BRK-22, BRK-23, BRK-24]
  retracted_claims:
    - "a 277-row evidence_sources divergence RED in migration_reproducibility_deep — the deep check PASSES; see BRK-21 latency_note"
  lesson: >
    Nineteen of twenty headline claims held, and six of the supporting details
    under them did not. The survey was right about WHAT is broken and wrong
    about WHO WOULD CATCH IT — which is the more dangerous half to be wrong
    about, because a sequencer trusts the guard line, not the prose.
