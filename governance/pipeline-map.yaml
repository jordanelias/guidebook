      `UPDATE evidence_sources SET {...} WHERE ref_id = ?` directly. CLAUDE.md
      3 says the DB is written by migrations only. evidence_sources is a
      layer-2 core table and is NOT on migration_reproducibility's
      EXEMPT_TABLES list (which holds only evidence_source_authors and
      pipeline_runs, per DR-2026-05-28).
    consequence: >
      Running the enrichment phase against the canonical DB would put committed
      bytes out of correspondence with the migration history. Because the
      BLOCKING reproducibility check compares COUNT(*) only (BRK-17), an UPDATE
      changes no count and the blocking gate stays green; only the ADVISORY
      deep check would see it.
    latency_note: >
      IMPORTANT — this is a live code path, not a live divergence. Verified
      2026-08-21: `migration_reproducibility.py --deep` PASSES, 63 tables
      identical, only the two DR-exempt tables excluded. An earlier draft of
      this entry asserted a "277-row divergence, RED in the deep check". That
      was WRONG and is retracted here; it was carried from an unverified
      report. Re-derive before repeating it.

  - id: BRK-22
    severity: medium
    verdict: NEW
    table: jurisdictional_values
    kind: RULING_NOT_ENFORCED_IN_SCHEMA
    detail: >
      The 2026-08-12 owner ruling made this table REFERENCE-ONLY: it names which
      document to go and get, never what the document says. The live data honours
      it — 109 rows, and value_text, value_numeric and spec_id are NULL on all
      109. But the schema still carries value_text, value_numeric, unit and
      is_code_minimum with no constraint, no trigger and no check forbidding a
      write.
    consequence: >
      On 2026-08-21 a session wrote 12 rows of claimed values into it. The
      violation was caught by L02's CARDINALITY parity (109 YAML vs 121 table),
      not by anything reading the value columns. A write that replaced values
      in place, at constant row count, would pass every gate.
    guard: test_db_integrity L02 (blocking, cardinality only)
    note: >
      Owner-gated rename pending: if the table catalogues jurisdictions it should
      be called `jurisdictions`, and the value columns should go with the rename.

  - id: BRK-23
    severity: medium
    verdict: NEW
    scope: map coverage
    kind: TABLES_IN_NO_LAYER
    detail: >
      13 of the 65 live tables appear in no layer above:
      case_study_outcomes, case_study_populations, case_study_specs,
      case_study_strategies, citation_population_links, data_migrations,
      decisions, economics_entry_populations, economics_entry_specs,
      extraction_population_links, item_audit_runs, pipeline_runs,
      probe_population_links.
    consequence: >
      A sequencer driven from this file would never visit them. Two classes:
      the *_populations / *_specs / *_links join tables are the SECOND HOP of
      layer-3 entities the map named only at their head table (case_studies,
      economics_entries, source_value_extractions, spec_value_probes,
      citation_mining) — so the map records the entity and drops its
      attachments, which is the same shape as BRK-03. data_migrations and
      decisions are standalone by design. pipeline_runs and item_audit_runs are
      job-owned run records.
    guard: none — no check compares this file against sqlite_master

  - id: BRK-24
    severity: medium
    verdict: NEW
    scope: read surface
    kind: VIEWS_UNREAD_AND_UNMAPPED
    detail: >
      The first draft of this file did not mention views at all. 17 exist and
      ALL SEVENTEEN have zero code readers (see `views:` above). One,
      v_best_practice, holds a SEMANTIC GUARD in its WHERE clause — the "code
      floors and pending cells are not best practice" rule — enforced there and
      nowhere else.
      CORRECTED 2026-08-22: this entry read "11 have zero code readers" — the
      figure from BEFORE the 2026-08-22 `views:` correction, which the
      correction did not propagate here. A fourth pass re-derived it per-view
      over the whole tree including the .ignore-hidden strata: no
      `FROM`/`JOIN <view>` exists in any .py, .sh, .js, .html or .yaml, current
      or archived. The number is 17.
    consequence: >
      Two failures in one. A reader that queries `specifications` directly gets
      an answer set the project's own rule excludes, with nothing to warn it.
      And all 17 views are unread apparatus by CLAUDE.md 1's own test — the same
      defect class as BRK-18, seventeen times over, on the read side. Every
      semantic distinction the views carry — the weak band, the code-floor wall,
      coverage priority — is dead read-surface today.
    guard: none

  - id: BRK-25
    severity: informational   # was: high
    verdict: >
      REFUTED AS A BREAK, 2026-08-22, by the fourth adversarial pass. The DDL
      observation below is correct and is retained; the doctrinal reading built
      on it is wrong, and the severity it carried was unwarranted. THIS ENTRY IS
      NOT A DEFECT TO FIX. Acting on it would revert ratified doctrine.
    view: v_best_practice
    kind: OBSERVATION_ONLY   # was: GUARD_NARROWER_THAN_DOCTRINE
    detail: >
      `regulatory_stratum_only` is a live column on `specifications` (verified in
      PRAGMA table_info). In `v_best_practice` it appears ONLY as a label —
      `CASE WHEN regulatory_stratum_only = 1 THEN 'weak' ELSE 'anchored' END AS
      strength_band` — and NEVER in the WHERE clause. The WHERE excludes
      `code_floor_only = 0` and non-stated states, nothing else.
      SUSTAINED: this is exactly what the live DDL does.
    why_refuted: >
      That behaviour is the RATIFIED design, not a gap. It was produced verbatim
      by `_archived/scripts/migrations/029_best_practice_weak_band.sql`, whose
      header reads: "under DR-2026-07-21-product-posture-thinking-tool-not-authority
      (RATIFIED) ... a determination whose entire evidence basis is the regulatory
      stratum (T4-T6, regulatory_stratum_only) IS a best-practice determination at
      the WEAK band -- rendered flagged, in every register, never at anchoring
      strength. The engine contradicted this: migration 027's v_best_practice
      EXCLUDED those rows outright. This migration reconciles the engine with the
      ratified doctrine." Migration 029 deliberately DROPPED the two 027 guards and
      ADDED strength_band so weak rows surface distinctly.
      The original entry quoted CLAUDE.md 6 as "walled off" and stopped there. The
      full clause is "walled off from FULL-STRENGTH ANCHORING" — and a row carrying
      strength_band='weak' is not at full-strength anchoring. The wall the doctrine
      names is the anchored/weak boundary, which the CASE expression implements.
      The entry cited neither DR-2026-07-21 nor migration 029, i.e. it re-derived a
      question the repository had already adjudicated and called the ratified answer
      a high-severity break — the "false novelty" failure named in
      references/project-standards.md (RULE, 2026-08-19).
    internal_contradiction_this_exposed: >
      BRK-25 faulted the live view for NOT excluding regulatory-stratum rows while
      BRK-26 faults assess_cell.py for shipping DDL that DOES exclude them. Both
      cannot be regressions. BRK-26 is the real one: it reverts 029.
    residual_true_point: >
      Only that the anchored/weak separation lives solely in view SQL that nothing
      queries — which is BRK-24's point, not a second finding.
    guard: not applicable — there is nothing here to guard
    latency: not applicable

  - id: BRK-26
    severity: high
    verdict: >
      SUSTAINED by the fourth adversarial pass, 2026-08-22, with two corrections
      recorded below (`guard:` and the word "weaker"). FIXED 2026-08-22 — the
      interim amendment is deleted from assess_cell.py; this entry is retained as
      the record of why, per the file's own convention of recording rather than
      quietly repairing. Originally: NEW, found by the 2026-08-22 read-only pass.
    script: scripts/assess/assess_cell.py
    lines: 590-604   # CORRECTED 2026-08-22: the block runs to 604, not 599
    kind: STALE_AMENDMENT_REGRESSES_LIVE_SCHEMA
    detail: >
      assess_cell DROPs and re-CREATEs `v_best_practice` as part of writing a
      determination, and ships that DDL INSIDE the emitted replayable SQL
      artifact. Its comment calls the replacement "interim ... until migration
      027 adds a real regulatory_stratum_only column". That column EXISTS today.
      So the amendment is stale, and applying it would REGRESS the live view in
      two ways: it drops the `strength_band` output column, and it swaps a
      column test for a string test,
      `tier_basis NOT LIKE '%(regulatory_stratum_only)'`.
    consequence: >
      The one fully-coded hop on the answer side rewrites the project's only
      semantic guard to the SUPERSEDED migration-027 form — and because the DDL
      travels in the emitted artifact, the regression would be carried into a
      migration and committed. Standing proof that it travels:
      `working/pilot/data_20260712_pilot-cell-backfill.sql:23-24` contains exactly
      this DROP/CREATE, and the archived replay migration had to note explicitly
      that the interim amendment is NOT re-applied. A string-marker test also fails
      silently the moment tier_basis formatting changes, which a column test cannot.
      CORRECTED 2026-08-22: the original said "an older, weaker form". Imprecise —
      the in-code DDL is MORE exclusionary than the live view, not laxer. It is
      weaker only as apparatus (marker-fragile, band-blind), and what it regresses
      is the RATIFIED DR-2026-07-21 / migration-029 definition. Say that, not
      "weaker".
    guard: >
      CORRECTED 2026-08-22. This line previously read "none ...
      migration_reproducibility.py:221 and :542 ... compare ROWS, so a view
      redefinition is invisible to them by their own admission." That INVERTS the
      meaning of the code it cites. `deep_compare` explicitly compares view,
      trigger and index DDL (schema_objects(), lines 218-224 and 311-315), and
      line 221 is the RATIONALE for doing so, not an admission of blindness — its
      own selftest at :541-543 builds two DBs differing only in a view's WHERE
      clause and asserts the difference is flagged.
      The true guard picture: the BLOCKING shallow check (user_version + COUNT(*)
      on 6 tables, BRK-17) would not see a view redefinition; the ADVISORY --deep
      check WOULD see an inconsistent one. The genuine residual gap is narrower
      than stated — a stale DDL that travels INSIDE a migration changes the
      committed and rebuilt sides consistently, so even the deep check passes.
      This entry committed the exact error the file's own `lesson:` names as the
      dangerous half: being wrong about WHO WOULD CATCH IT.

# ---------------------------------------------------------------------------
# UNENFORCED CONTRACT CRITERIA. Declared in governance/pipeline-contract.yaml
# with `check: null`. The sequencer must treat these transitions as unguarded.
# ---------------------------------------------------------------------------
unenforced_transitions:
  - {stage: collection, criterion: discovery-provenance}
  - {stage: judgment,   criterion: derivation-handshake}
  - {stage: judgment,   criterion: convergence-independence}
  - {stage: synthesis,  criterion: opus-routing}
  - stage: render
    criterion: render-freshness
    qualification: >
      QUALIFIED 2026-08-21. The contract declares `check: null`, and the
      criterion's own text says "parts/ has no committed fingerprint gate" —
      both true. But four registered freshness checks DO exist and run on the
      render kind: site_pages_fresh, evidentiary_audit_fresh,
      pipeline_completeness_fresh and context_map_fresh. All four are ADVISORY,
      and none covers parts/. So this transition is unenforced in the sense the
      contract means (nothing BLOCKS on staleness) but not unwatched. Reading it
      as "no check exists" would be wrong.

