  - id: BRK-11
    severity: medium
    verdict: SUSTAINED
    edge: "term_aliases.language <-> lang_jur_map.language"
    kind: CONVENTION_CASE_BROKEN
    detail: >
      Aliases store lowercase ('de'); lang_jur_map stores uppercase ('DE').
