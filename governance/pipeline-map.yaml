# pipeline-map.yaml — the walkable map of the Guidebook pipeline
#
# PURPOSE. A sequencer/wrapper needs to know, for every hop between tables:
# whether the edge is enforced, who writes it, who reads it, what guards it, and
# whether the hop is performed by CODE or by HAND. This file states that.
#
# HOW IT WAS BUILT. Four read-only agonist surveys (substrate · acquisition ·
# synthesis · render+meta), each evidence-first against the live repo, then TWO
# antagonist passes — one refuting every `breaks:` entry independently, one
# testing whether the pipeline can be walked forward, backward and sideways.
# Every entry below now carries a `verdict:` recording what survived.
#
# The `fk` relationships are read from the live schema (PRAGMA
# foreign_key_list). The `convention` and `absent` edges are hand-curated from
# the surveys — each was evidenced, and each is the kind of hop that fails
# silently.
#
# STATUS: DESCRIPTIVE, not normative. It records the pipeline as it IS on
# 2026-08-21, defects included. It is not a design.
#
# ADVERSARIAL VERIFICATION COMPLETE (2026-08-21). Of the 20 agonist claims, 19
# were sustained on the substance and 1 (BRK-15) was cut back. But SIX of the
# supporting `guard:` and island assertions were WRONG, and the four-stage
# linear model was refuted outright. Those corrections are applied below and
# marked. The lesson is the one this session kept relearning: an agonist claim
# is a hypothesis until something independent attacks it.
#
# THE RULE THIS FILE EXISTS TO SERVE: a hop that is CONVENTION or ABSENT cannot
# be trusted by a sequencer. Every defect found in the 2026-08-19/21 sessions
# was a convention or absent edge failing quietly.

meta:
  generated: "2026-08-21"
  verification: "agonist surveys + 2 antagonist passes, adjudicated 2026-08-21"
  user_version: 60
  tables: 65
  views: 17
  fk_edges: 80
  canonical_db_sha256_at_generation: f70c48d792662a59d1656e57904686bde6301c875798f3893381c460fbe03c2c
  # CORRECTED 2026-08-21: this field first held c4ad6cc3 — the sha AFTER the
  # first digestion migration but BEFORE the compensating one. A stale volatile
  # fact hardcoded inside the file meant to be authoritative, i.e. exactly the
  # CLAUDE.md 2(b) failure. Re-derive this field; never carry it forward.
  readers_today: 0
  readers_note: |
    Stated plainly because CLAUDE.md 1 requires it: NOTHING READS THIS FILE.
    Repo-wide grep for "pipeline-map" outside the file itself returns nothing.
    Its named reader is the sequencer/wrapper it was commissioned for, which
    does not exist yet. Until that reader lands, this file is documentation and
    should be judged as documentation — which means CLAUDE.md 2(b) applies to
    it in full: every volatile fact in it (row counts, reader counts, sha,
    step counts) is a hand-written count in a derived document and WILL drift.
    The `verification_record` at the bottom exists because it already did.
    Candidate, not yet added: a check comparing `layers:` against sqlite_master
    would catch BRK-23-class drift mechanically. Not added here, because
    CLAUDE.md 1 puts the burden of proof on the addition and the sequencer that
    would consume it is not built.
  authority: |
    FK relationships are read from the schema. Everything else is evidenced by
    survey and adversarial pass, and should be re-verified rather than trusted.
    Row counts drift; re-derive them.

# ---------------------------------------------------------------------------
# LAYERS (formerly "stages"). The sequencer's outer loop is NOT a traversal.
#
# REFUTED 2026-08-21: the first draft of this file modelled the pipeline as
# four sequential stages, entered once each, in order. The antagonist's finding:
# "the stages are table buckets, not phases." The evidence is this session's own
# work — digesting a reasoning document (a layer-3 artefact) produced research
# LEADS (layer-2 rows). That is a 3 -> 2 edge, and it is normal, not an anomaly.
#
# So: these are LAYERS a walk re-enters, not phases it passes through. A
# sequencer must be re-entrant and must not assume a table's layer tells it when
# the table is written. `loops:` below names the backward edges that are real.
# ---------------------------------------------------------------------------
layers:
  - id: 1-substrate
    name: Substrate and controlled vocabularies
    entered_by: migration only
    tables: [slugs, items, populations, axes, access_needs, access_need_icf,
             access_need_axis_map, access_duration, access_stakes,
             life_stage_modifiers, situations, rooms, room_items, terms,
             term_aliases, term_item_links, lang_jur_map, search_languages,
             jurisdictional_values, weighting_profile, external_root_registry,
             item_axis_links, item_population_links, item_population_elaborations,
             population_axis_map, item_bpc_links]
    exit_condition: >
      A slug exists with items, populations and axes resolvable. NOTE: this is
      satisfiable today for room-acoustic-performance and nothing downstream
      enforces it.

  - id: 2-acquisition
    name: Evidence acquisition and admission
    tables: [search_executions, search_candidates, search_admissions,
             evidence_sources, evidence_source_authors, source_locators,
             citation_mining, url_verification_runs, supersession_check,
             search_coverage]
    exit_condition: an evidence_sources row exists, admitted via search_admissions
    # CORRECTED 2026-08-21: the first draft said `steps_total: 14` with six
    # step numbers listed as having no code. The operative instrument
    # (DR-2026-08-19 §"runbook") has Steps 0 THROUGH 12 — thirteen steps — and
    # Steps 3 and 9 are coded CLI (`db.py log-search`, `db.py log-mining`), not
    # hand SQL. Step 4 is the one that says "No CLI" in its own text.
    steps_total: 13            # Steps 0-12 of the operative instrument
    steps_that_are_hand_sql: [4, 5, 8, 10]
    steps_with_coded_cli: [3, 9]
    steps_verified_against: decisions/DR-2026-08-19-research-restart-operative-instrument.md

  - id: 3-synthesis
    name: Attachment, grading, determination
    tables: [source_slug_links, evidence_population_match, gaps, gap_mining,
             convergence_assessment, specifications, specification_source_links,
             spec_value_probes, source_value_extractions, bpc_metadata,
             reasoning_doc_citations, conflicts, connections, connection_targets,
             case_studies, economics_entries]
    exit_condition: a specifications row exists with governing_refs
    fully_coded_hops: [assess_cell]
    note: >
      assess_cell is the ONLY fully-coded hop on the answer side and it REFUSES
      the canonical DB by design. Every hop feeding it is hand SQL.

  - id: 4-render
    name: Render
    outputs: [site/specs, site/populations, site/rooms, parts/, tools/*.html, audits/]
    exit_condition: rendered output cites a chaseable identifier
    # CORRECTED 2026-08-21: the first draft said "currently unreachable —
    # specifications is 0 rows". OVERSTATED. site/specs/ holds 93 live pages,
    # one per `items` row, rendered today. What is unreachable is the
    # SPECIFICATION-BACKED render — the determination layer — not the render
    # layer as such. The distinction matters to a sequencer: layer 4 runs, it
    # just renders substrate rather than answers.
    reachable: partial
    reachable_detail: >
      93 item pages render from `items` (layer 1). `specifications` is 0 rows,
      so every population-and-evidence-backed surface renders empty. The
      root index.html renders from nothing at all (BRK-10).

loops:
  # Backward and sideways edges that are NORMAL, not defects. A sequencer that
  # assumes 1->2->3->4 will mis-sequence all of these.
  - {from: 3-synthesis, to: 2-acquisition, edge: "reasoning prose digested into research leads / search_candidates",
     witness: "workplan/2026-08-21-reasoning-doc-digestion.md — 27 leads produced from a layer-3 document"}
  - {from: 2-acquisition, to: 1-substrate, edge: "an admitted source introduces terms/aliases (R11) and jurisdictional_values reference rows (R12)"}
  - {from: 3-synthesis, to: 2-acquisition, edge: "gaps / gap_mining drive the next search round (R2)"}
  - {from: 4-render, to: 1-substrate, edge: "audits/ read the DB and are themselves committed artefacts checked by layer-1-kind gates"}
  - {from: 3-synthesis, to: 3-synthesis, edge: "citation_mining re-enters admission from an already-admitted source (R2, depth 2-3)"}

# ---------------------------------------------------------------------------
# VIEWS. Omitted entirely from the first draft — a 17-object blind spot in a
# file whose whole purpose is to say who reads what.
#
# Views matter to a sequencer for two reasons: they are READ PATHS that no
# table-level survey sees, and at least one carries a SEMANTIC GUARD in its
# WHERE clause that is invisible to anything reading the base table.
# ---------------------------------------------------------------------------
views:
  count: 17
  with_code_readers:
    - {name: v_best_practice, readers: 3}
    - {name: v_coverage_jurisdiction, readers: 2}
    - {name: v_coverage_branch, readers: 1}
    - {name: v_coverage_language, readers: 1}
    - {name: v_divergence, readers: 1}
    - {name: v_pending, readers: 1}
  with_zero_code_readers:
    [v_code_floor_only, v_coverage_priority, v_item_extractions,
     v_item_provenance, v_pmp_latest_walk, v_registry_duplicate_descriptions,
     v_root_id_conflicts, v_source_admission, v_source_reach_all,
     v_unregistered_roots, v_value_independence]
  semantic_guard_in_view:
    view: v_best_practice
    clause: "WHERE state IN ('stated','provisional') AND code_floor_only = 0"
    why_it_matters: >
      The rule "a code floor is not a best practice, and a pending cell is not
      an answer" is enforced HERE, in view SQL, and nowhere else. Anything that
      queries `specifications` directly bypasses it silently. A sequencer
      reading the base table gets a different — and wrong — answer set.
  note: >
    v_coverage_priority is the counter-example that corrects the first draft's
    islands list: it reads lang_jur_map, which the draft called unread.

# ---------------------------------------------------------------------------
# THE BREAKS. What a sequencer must not assume works.
# Every entry was evidenced; `witness` says how it is known; `verdict` records
# what the antagonist passes did to it.
# ---------------------------------------------------------------------------
breaks:

  - id: BRK-01
    severity: critical
    verdict: SUSTAINED (guard line corrected)
    edge: "evidence_sources.ref_id -> source_locators.ref_id"
    kind: ABSENT
    detail: >
      source_locators (835 rows) is a SCHEMA ISLAND: no FK in, no FK out. There
      is no promotion path from a held locator to an admitted source, in code or
      in schema.
    consequence: >
      The R9 duplicate gate cannot see 835 held identifiers. This is OD-5. Two
      of them (REF-00561, REF-00578) were independently re-discovered by an
      adversarial pass that did not know the project already held them.
    witness: FK graph + repo-wide grep including .ignore'd paths
    guard: >
      CORRECTED — the first draft said "zero live code readers repo-wide", which
      is true of readers that INTERPRET the table but not of readers as such.
      migration_reproducibility --deep walks all 65 tables generically, so
      source_locators is compared row-for-row on rebuild. That is a fidelity
      guard, not a semantic one: it proves the rows survive migration replay and
      says nothing about whether anything uses them. No SEMANTIC reader exists,
      in code or in view SQL. And the deep check is ADVISORY.

  - id: BRK-02
    severity: critical
    verdict: SUSTAINED (guard line corrected)
    edge: "jurisdictional_values.jurisdiction -> (no jurisdictions table)"
    kind: ABSENT
    detail: >
      No `jurisdictions` table exists. No `languages` table exists. The blocking
      check validate_jurisdiction.py NEVER OPENS THE DB — it reads
      references/standards-registry.md and data/sources/*.yaml (which does not
      exist).
    consequence: >
      An invented jurisdiction code is rejected by nothing. Proven empirically
      (INSERT jurisdiction='XX' accepted, foreign_key_check clean, pydantic
      accepts plain str). Standing witness: 20 live rows hold 'GB' in direct
      violation of the project's own GB->UK rule, permanently uncaught. On
      2026-08-21 a session invented AU-NZ, DK-NO-SE-FI and INT and every
      validator passed.
    guard: >
      CORRECTED — the first draft said "none that reads the DB", which is false.
      test_db_integrity L02 ("jurisdictional_values: YAML record count matches
      the table") is BLOCKING, opens the DB, and FIRED on 2026-08-21, catching a
      109-vs-121 mismatch that forced a compensating migration. What L02 guards
      is CARDINALITY against a YAML manifest — it will catch rows appearing or
      vanishing. It does not read the jurisdiction VALUE, so an invented code
      substituted for a real one at constant row count still passes. The break
      is real; the phrasing was not.

  - id: BRK-03
    severity: critical
    verdict: SUSTAINED (guard line corrected)
    edge: "specifications <- specification_source_links"
    kind: NO_WRITER
    detail: >
      specification_source_links is the FK-ENFORCED form of the governing_refs
      JSON array. It has no writer anywhere in the repo. assess_cell writes the
      JSON convention edge instead.
    consequence: the enforced edge is unwritable; the trusted edge is unenforced
    guard: >
      CORRECTED — the first draft said "none". test_db_integrity carries a
      BLOCKING parity pair, H01/H02, "specification_source_links <->
      governing_refs" (and H03/H04 for search_admissions <-> admitted_ref_ids).
      So divergence between the two forms IS caught. But parity between an
      unwritten table and a JSON array is satisfied trivially while
      specifications is 0 rows — the guard is blocking AND currently vacuous,
      which is failure mode 2(a) of CLAUDE.md. It will start doing work on the
      first determination, and that is exactly when the missing writer bites.

  - id: BRK-04
    severity: critical
    verdict: SUSTAINED
    edge: "reasoning_doc_citations.source_ref_id -> evidence_sources.ref_id"
    kind: FK_BLOCKED
    detail: >
      NOT NULL FK. The one real reasoning document cites 11 REF-ids, 0 of which
      resolve in evidence_sources; all 11 live in source_locators.
    consequence: >
      The prose cannot be ingested until its sources are admitted, and they
      cannot be admitted while BRK-01 stands. OD-5 gates the prose-into-tables
      rule (owner directive D-2).
    guard: reasoning_doc_citations_audit (advisory, passes vacuously)

  - id: BRK-05
    severity: high
    verdict: SUSTAINED
    edge: "two divergent answer chains"
    kind: DESIGN_SPLIT
    detail: >
      The documented chain is source_slug_links -> source_value_extractions ->
      reasoning_doc_citations -> spec_value_probes -> items.pmp_* and terminates
      in ITEM COLUMNS. `specifications` is a PARALLEL consumer whose value
      dimension should be graded from source_value_extractions, but no rule
      exists so that edge is absent in code. Only promoted_to_rdc_id is FK-enforced.
    consequence: a sequencer would not know which chain is authoritative
    guard: none

  - id: BRK-06
    severity: high
    verdict: SUSTAINED (sharpened)
    edge: "retrieval-log artefact -> evidence_sources"
    kind: CONVENTION
    detail: >
      No column binds an artefact to a source. Three conventions exist; the only
      one code uses is DOI matching inside verify_authors. Tested: 20 of 22
      manifest lines resolve.
    sharpened_2026_08_21: >
      The exclusion is not incidental — verify_authors selects its subject set
      with `WHERE COALESCE(doi,'') <> ''`. A DOI-less source is not
      under-verified, it is NOT A SUBJECT AT ALL. The check prints CLEAN having
      examined nothing of it. Grey literature, standards documents and
      non-indexed non-English work — the R5 stratum this project explicitly
      admits — are precisely the DOI-less classes, so the fabrication defence is
      weakest exactly where fabrication is easiest to commit.
    consequence: the fabrication defence rests on a free-text convention
    guard: author_fidelity (advisory)

  - id: BRK-07
    severity: high
    verdict: SUSTAINED
    path: "retrieval-log/**"
    kind: UNCLASSIFIED_PATH
    detail: >
      run_checks.classify() maps retrieval-log/** to NO KIND. A change to a
      stored payload selects no kind-scoped battery.
    consequence: >
      The artefact store that exists to defend against fabrication can be
      altered without triggering the check that reads it.
    guard: none kind-scoped

  - id: BRK-08
    severity: high
    verdict: SUSTAINED
    table: item_bpc_links
    kind: NO_WRITER
    detail: >
      0 rows, no writer. The slug->item cell mapping is therefore manual;
