    guard: none

  - id: BRK-13
    severity: medium
    verdict: SUSTAINED (softened)
    edge: "citation_mining.connections_produced -> connections.con_id"
    kind: CONVENTION_PROMOTION_DEAD
    detail: >
      CORRECTED — the first draft called the whole convention "DEAD". Precisely:
