# ---------------------------------------------------------------------------
# ISLANDS. No FK in, no FK out.
# CORRECTED 2026-08-21 — the first draft's `populated_and_unread` and
# `empty_and_unwritten` lists were both wrong, in the same direction: they
# asserted absence of readers/writers without checking view SQL or job scripts.
# ---------------------------------------------------------------------------
islands:
  populated_and_unread: [source_locators, weighting_profile, access_duration,
                         access_stakes, life_stage_modifiers]
    # REMOVED: lang_jur_map. It has 70 rows and at least four readers —
    # scripts/audit/alias_provenance_audit.py (BLOCKING), scripts/db.py,
    # tools/pipeline_completeness.py, and the view v_coverage_priority. It is
    # not an island; it is the required-coverage bridge those readers denominate
    # against. The draft asserted "unread" without grepping.
  empty_and_unwritten:  [situations, external_root_registry]
  island_detail:
    - {table: access_duration,       rows: 3, code_readers: 0, view_readers: 0}
    - {table: access_stakes,         rows: 3, code_readers: 0, view_readers: 0}
    - {table: life_stage_modifiers,  rows: 2, code_readers: 0, view_readers: 0}
    - {table: weighting_profile,     rows: 5, code_readers: 0, view_readers: 0,
       note: "one grep hit exists at scripts/emit_data_migration.py:603 — it is an
              EXAMPLE STRING inside a docstring, not a reader. Counted as zero."}
    - {table: source_locators,       rows: 835, code_readers: 0, view_readers: 0, see: BRK-01}
    - {table: situations,            rows: 0, code_readers: 0, view_readers: 0}
    - table: external_root_registry
      rows: 0
      code_readers: 0
      view_readers: 3
      views: [v_registry_duplicate_descriptions, v_unregistered_roots, v_value_independence]
      note: >
        The one genuinely interesting island. It is empty and has no code
        reader, but three views query it — and all three are among the
        seventeen views the `views:` block records as having zero code readers.
        So it is read by apparatus that nothing reads: an unread table behind
        unread views. Two layers of CLAUDE.md 1's "nothing is added without
        naming what reads it", stacked.
        CORRECTED 2026-08-22: this note pointed at a `with_zero_code_readers`
        list that the 2026-08-22 `views:` correction had already removed — a
        stale cross-reference to a list that no longer exists.
    # REMOVED: pipeline_runs and url_verification_runs. Both are EMPTY but both
    # have code writers — scripts/resolve_dois.py:681/726/1013 and
    # scripts/verify_urls.py:377/474/515 respectively. They are job-owned run
    # records that no job has run against the canonical DB, which is a different
    # condition from unwritten and carries a different remedy (run the job, not
    # write the writer). pipeline_runs is additionally EXEMPT from
    # migration_reproducibility by DR-2026-05-28, precisely because it IS
    # job-written.
  standalone_by_design: [decisions, data_migrations]
  in_practice: >
    `rooms` (17 rows) has FK edges but is an island in practice: its only bridge
    (room_items) is empty and its only would-be reader queries phantom tables.

