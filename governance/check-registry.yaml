- id: research_dod
  cmd:
  - python3
  - scripts/audit/research_batch_dod.py
  - --all
  battery: research
  kinds:
  - data
  - synthesis
  level: advisory
  basis: unattributed
  cost: fast
  no_floor: not-instrumented — the research contract's rules each read a different table (searches, sources, admissions, DOIs,
    ...) with no single honest count across them. A combined figure would misrepresent which rule
    examined what. Left uninstrumented on 2026-08-14 (A5). CORRECTED 2026-09-17, and the correction
    is the point — this reason justified itself with "Genuinely non-vacuous today (R1 fails
    NON-COMPLIANT on live data)", which stopped being true and went unnoticed, exactly as CLAUDE.md
    rule 7a predicts of a volatile figure used as self-justification. Derive it with `python3
    scripts/audit/research_batch_dod.py --all`, never quote it. The STRUCTURAL claim (no single
    honest count) stands; the evidence offered for it had rotted.
# WHY THERE ARE TWO OF THESE, AND WHY THE CORPUS-WIDE ONE IS NOT ENOUGH. `research_dod` above
# runs `--all`, which asks "is the corpus as a whole compliant". That question cannot fail for a
# single bad batch once the corpus holds good sources: one batch admitting a source with no
# locator is invisible beside a corpus of sources that have them. The contract the owner ratified
# is per-BATCH — the session-start hook says in as many words "Gate before you claim done:
# research_batch_dod.py --session <id>" — and until 2026-09-17 nothing ran that. It was enforced
# only by an operator remembering, which is the state CLAUDE.md §2 calls "you are the gate".
#
# BLOCKING, deliberately. DR-2026-07-25 is not hedged: "RESEARCH IS INVALID IF IT IS NOT COMPLIANT
# WITH OUR GOVERNANCE AND VERIFICATION TOOLS AND RULES AND ETHOS." An advisory gate does not
# implement that sentence, it annotates it. This is not red-by-construction: batch 08, batch 09 and
# the corpus-wide posture all pass as this lands — verify rather than trust that, it is the whole
# precondition for the level.
#
# THE POINTER IS LATEST-RESEARCH AND ITS LAG IS A FEATURE HERE. It moves at CLOSE, so for the whole
# life of a running session it names the PREVIOUS one (CLAUDE.md §7). A PR opened mid-batch is
# therefore gated on the last CLOSED batch, and the new one is gated once its pointer moves — which
# is exactly when a batch claims to be done.
#
# THE '.md' TRAP THIS WOULD HAVE WALKED INTO. @SESSION@ is substituted from the pointer file, and
# pointer files carry '.md' while the DB stores the bare stem. `--session` is interpolated into
# `WHERE session = ?`, so the '.md' form matches zero rows and every rule reports PASS over an empty
# subject — §7's "wrong form scopes a gate to nothing and it passes green", installed on every PR.
# research_batch_dod.py now strips a trailing '.md' before any query runs. Registering this check
# without that fix would have been worse than not registering it.
- id: research_dod_session
  cmd:
  - python3
  - scripts/audit/research_batch_dod.py
  - --session
  - '@SESSION@'
  battery: research
  kinds:
  - data
  - synthesis
  level: blocking
  basis: unattributed
  cost: fast
  requires_session: true
  session_pointer: LATEST-RESEARCH
  no_floor: 'session-scoped — the subject is whatever the session named by LATEST-RESEARCH
    admitted, so it varies per session and a floor would fail a BLOCKING gate for correctly
    gating a small batch. Same shape and same reasoning as citation_mining_session, which is
    scoped to the same pointer. This is NOT the vacuity hole it resembles. R9a and R9b both
    FAIL on a session that admitted nothing, so an empty subject is caught by the rules
    themselves rather than passing silently, which is why session-scoped is honest here and
    not an excuse.'
