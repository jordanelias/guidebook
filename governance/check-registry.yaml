# DELETED 2026-09-10 (P7): the `validate_schema` id that ran `scripts/validate_schema.py --verbose`
# (no `--cross-check`). ENTITY_REGISTRY = {} (scripts/validate_schema.py:63) is iterated at :101 and
# :149 with nothing else gating the `--verbose` path, so this examined ENTITY_REGISTRY's zero entries
# on every possible input, not merely today's corpus -- vacuous by construction, not by decision, and
# it was registered BLOCKING. CLAUDE.md §5(a): "a blocking gate that can never examine anything gates
# nothing while appearing to gate everything."
#
# THE SCRIPT AND ITS `base/base-schema-validates` BASIS ARE NOT ORPHANED, so nothing below was
# repointed or unclaimed. `scripts/validate_schema.py` was NOT deleted, and this is the reason the
# task brief's premise (delete the file; then decide the criterion's fate) does not hold here:
#   1. `validate_schema_cross_check` below is a SEPARATE registered entry running the SAME file with
#      `--cross-check`, a code path independent of ENTITY_REGISTRY (it reconciles
#      research_code_leads against _archived/data/jurisdictional_values on (jurisdiction,
#      standard_name)). It is demonstrably non-vacuous -- its floor_basis (deleted in plan step 1.8,
#      still in git history) recorded "examines 83 leads and was proven to fire by deleting one" -- and it ALREADY claims
#      `basis: base/base-schema-validates`, so that criterion stays claimed without any edit here.
#   2. `skills/workplan-orchestrator_SKILL.md` step "2b — Data health check" runs
#      `python3 scripts/validate_schema.py --quick` as a documented, unconditional-when-`data/`-exists
#      session-start step (`data/` exists in this repo). Deleting the file breaks that live, active
#      skill's command. skills/ is out of this batch's edit scope, so that caller cannot be swept here
#      (CLAUDE.md rule 4: "a rename or removal is not done until the callers are swept... so is a
#      skill"). Per this batch's own caller-sweep instruction, a live active-skill caller is a STOP,
#      not a delete.
# Net effect: only the genuinely-vacuous blocking entry is gone. The file, `validate_schema_cross_check`,
# and the `base-schema-validates` criterion (governance/pipeline-contract.yaml) are all untouched.
