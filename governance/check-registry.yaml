# --- quarantine -------------------------------------------------------------
# Registered so they stay visible, never selected. Every entry needs a `reason`
# and, where applicable, the owner-gated action that would resolve it. Nothing is
# deleted: retirement is owner-gated (CLAUDE.md §9 guardrail 4), and these are
# recorded for that decision, not pre-judged.
quarantine:

  - id: table_connectivity
    cmd: [python3, scripts/audit/table_connectivity.py]
    status: quarantined
    reason: >-
      NOT A GATE, and registered here so that fact is recorded rather than
      inferred from its absence. It measures the pipeline walk — how far a
      published best practice can be traced backwards — and reports independent
      vs. in-sequence counts per stage. Its headline is the plan's headline
      (fully-evidenced walks, currently 0), which is a project state to report,
      not a condition to fail a diff on.
      Registered 2026-08-06 after an audit found it was the one enforcer script
      under `scripts/audit/` appearing in neither the active nor the quarantine
      list. That omission class is exactly what this registry was built for: the
      2026-07-24 finding that 28 enforcers were wired to nothing was possible
      only because nothing enumerated them. An unlisted script re-opens the hole
      on principle even when the individual script is harmless.
      Promote it if and when a target is set for the walk — then it becomes a
      ratchet with a number, which is the only form in which it could block.

  - id: validate_db
    cmd: [python3, scripts/validate_db.py]
    status: quarantined
    reason: >-
      REPAIRED 2026-08-05 — no longer `broken`, but still not selected. Two stale
      facts were killing it, both of the same species: C5 queried `doi_less_key`,
      a column dropped from the schema, which crashed the whole script with
      `sqlite3.OperationalError`; and C3 compared `PRAGMA user_version` against
      the literal `5`, written when 005 was the newest migration, so it failed on
      every correctly-migrated database. C5 now asks the question the dropped key
      stood in for (does this source carry ANY stable identifier), and C3 derives
      the expected version from the migrations directory.
      This mattered beyond the check: `scripts/db.py validate` invokes the script
      as a subprocess, so that CLI command was a guaranteed traceback rather than
      a validation. It now runs.
      STILL QUARANTINED, deliberately. test_db_integrity.py supersedes it (69
      checks vs 9) and CLAUDE.md §7 already says to prefer that one; wiring both
      would mean two overlapping gates to keep in step. The repair was to unbreak
      a live CLI path and to stop the file reading as a working gate that
      crashes — not to argue for selection. Retirement stays owner-gated.
      Its one substantive finding on the live DB — C4, 31 connections with zero
      targets — is a CONTENT defect, not a tooling one, and is recorded here so
      the repair does not bury it.

  - id: validate_temporal
    cmd: [python3, scripts/validate_temporal.py]
    status: vacuous
    reason: >-
      QUARANTINED 2026-08-04 — it was `blocking` on `kinds: [schema, data]` while
      examining ZERO records. It loads rules, standards, versions and supersedence
      links from `data/temporal/`, and that directory DOES NOT EXIST; the run prints
      "Temporal validation: 0 rules, 0 standards, 0 versions, 0 supersedence links /
      All checks passed" and exits 0. Every schema and data change in this repo has
      been passing a temporal-integrity gate that inspects nothing.
      It has no `min_items` floor — the exact defect the 2026-08-01 rework fixed in
      validate_schema.py and did not sweep for elsewhere. Only T-05 (a filename
      pattern over `versions/`) touches real files.
      NOT given a hard-fail guard instead: with the directory absent, failing on
      empty input would turn a blocking check red on every data/schema diff, which
      trades a silent lie for a loud blockage. Quarantine states the truth without
      that cost.
      RE-REGISTER when the `data/temporal/` corpus lands (its generator,
      scripts/convert/version_retrofit.py, still exists) — and only with a
      `min_items` floor so it can never again pass by having nothing in scope.
