schema_version: 1
kinds:
  schema:
    description: Schema definitions and the migrations that move them.
    paths:
    - schemas/**
    - scripts/migrations/**
  governance:
    description: Doctrine, decision records, attestations, the operative rule ledger.
    paths:
    - governance/**
    - decisions/**
    - attestations/**
    - references/project-standards.md
    - references/skill-registry.md
    - architecture/**
  synthesis:
    description: Reasoning docs and the BPC corpus — the synthesis paths that carry the doctrine token
      and the attestation requirement.
    paths:
    - references/bpc-reasoning/**
    - references/connection-reasoning/**
    - references/bpc/**
    - sessions/**
  data:
    description: The canonical DB and the entity YAML beneath it.
    paths:
    - data/**
  render:
    description: Generated product surfaces — never hand-edited, always derived.
    paths:
    - parts/**
    - site/**
    - specs/**
    - tools/*.html
    - audits/evidentiary-base-audit*
    - index.html
    - assets/**
  tooling:
    description: The apparatus itself — scripts, generators, workflows, hooks, deps.
    paths:
    - scripts/**
    - tools/**
    - .github/**
    - .claude/**
    - requirements.txt
batteries:
  syntax:
    deps: []
    description: Encoding and parse checks.
  structure:
    deps: []
    description: Corpus structure and cross-reference integrity.
  data:
    deps: []
    description: Migration reproducibility and data-layer integrity (stdlib only).
  db_integrity:
    deps: []
    description: DB content integrity. Re-run the check for its current state; do not cite a count from
      here.
  tests:
    deps: []
    description: Regression cover for the audit scripts.
  schema:
    deps:
    - pydantic
    description: Entity/schema validators.
  governance:
    deps:
    - pydantic
    description: Decision protocol, doctrine recheck, adversarial-use.
  attestation:
    deps:
    - jsonschema
    description: Adherence-log attestations.
  research:
    deps:
    - pydantic
    - jsonschema
    description: Research definition-of-done and its enforcers.
  render:
    deps: []
    description: Derived-output freshness and rendered-document integrity.
