    boundary fails. THE ORCHESTRATOR MUST FLIP THIS GUARD TO False IN THE SAME COMMIT THAT
    BACKFILLS figure_role ON THE PRE-075 ROWS — after which every NULL row fails unconditionally
    and the boundary computed below stops being consulted. Do not remove the guard line; flip
    its literal value only.


    THE BOUNDARY ITSELF: migrate_db.py ledgers DATA migrations (`data_migrations.applied_at`)
    but NOT schema migrations — a schema step only bumps PRAGMA user_version, atomically with
    its own DDL, and is not otherwise timestamped anywhere in the database (confirmed against
    sqlite_master: no `schema_migrations` table exists). Git history of the migration file
    does carry the true instant (075 landed in one isolated commit, 2026-09-13T02:15:07+00:00),
    but this check''s own CI job (db-integrity:, .github/workflows/ci.yml) checks out at the
    actions/checkout default fetch-depth (1) with no history to walk — a git-log-based boundary
    would silently lie in exactly the job that runs this check. So the boundary is
    MAX(data_migrations.applied_at), a real fact the runner does ledger and a safe (never too
    early, per migrate_db.py''s documented schema-before-data ordering within a run) lower bound
    on 075''s true application, converging to it further only as data migrations accrue.


