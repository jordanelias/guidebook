- id: register_integrity_check
  cmd:
  - python3
  - scripts/audit/register_integrity_check.py
  - --selftest
  status: quarantined
  reason: 'QUARANTINED 2026-09-11 — RED BY CONSTRUCTION FROM THE FIRST DETERMINATION ONWARD, which
    is the one state it could not be tested in until today. It compares the live DB against
    _archived/working/pilot/pilot-renderings.html, a FROZEN document keyed on [A-Z]-NN item codes.
    Migration 071 dropped item_code from specifications and re-keyed it on parameter_id, so the
    document can never agree with the DB again and cannot be regenerated against a key it does not
    have. Measured, not assumed: against the DB at commit 7e9b9c8 (specifications = 0 rows) the
    selftest printed "clean pass on untampered document: yes" and PASS over 15 cells x 6 registers;
    against the DB one commit later, holding the project''s FIRST determination (parameter 1 x MOB),
    it aborts with "1xMOB: COMPLETENESS VIOLATION — specifications row exists but no rendering
    appears in the document" plus four inverse errors for the pilot''s own E-08xDEAF, E-12xMOB,
    G-03xMOB and C-02xDEM. So it passed only while it had nothing to cross-check, and the first real
    subject turns it red permanently. CLAUDE.md rule 6: a check that is red by construction teaches
    its reader to ignore it. NOT DELETED, and the logic is sound — its --selftest mutation-fires on
