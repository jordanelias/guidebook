    - .claude/**
    - requirements.txt
# THE ONE HOME OF THE no_floor VOCABULARY. Every `no_floor:` reason must OPEN with one of
# these tokens followed by an em dash. The token is not decoration: `run_checks.py` reads it
# to decide whether the reason makes a claim it can falsify.
#
# WHY THIS EXISTS. A `no_floor` reason is an ASSERTION ABOUT THE WORLD ("my subject is
# empty, so a floor would be wrong") and until 2026-09-16 nothing checked it. Eleven of the
# 33 had gone false, several on BLOCKING gates running over live subjects with no floor —
# the state where a gate can go vacuous and pass green forever (CLAUDE.md §5a). Derive the
# split rather than trusting a number here; this comment said "three" until 2026-09-16, a
# figure carried over from an earlier nine-item probe that had dropped citation_mining_session
# (blocking). It was four. A hand-typed count went stale inside the mechanism built to catch
# hand-typed counts, which is the argument for the mechanism.
#
# WHAT THE RUNNER CAN AND CANNOT PROVE, stated honestly. Only the `asserts_empty` kinds make
# a claim a machine can contradict: the reason says the subject is empty, the check prints a
# non-zero EXAMINED, and those cannot both be true. The other three kinds make claims about
# a check's SHAPE (its subject is a diff, or fixtures, or several unlike things), which no
# count can refute. Those are reported, never failed. A detector that pretended otherwise
# would be manufacturing findings.
#
# THIS DOES NOT MAKE A REASON HONEST. A corpus check mislabelled `selftest` escapes the
# falsification test — and that had already happened twice before this vocabulary existed
# (test_verification_pipeline and test_directness_2_2 both reach live data while claiming
# fixtures). What the token buys is that mislabelling is now a single greppable word rather
# than a paragraph of prose nobody re-reads.
no_floor_kinds:
  empty-by-decision:
    asserts_empty: true
    description: The subject is empty because the project emptied it — a clean-room reset, an
      owner ruling, a corpus clear. Falsifiable, because a non-zero EXAMINED contradicts it.
  vocabulary-owed:
    asserts_empty: true
    description: The subject is empty because rows are OWED and unwritten, not because anything
      was removed. Distinct from empty-by-decision because the remedy is to write the rows, not
      to wait for a re-run. Equally falsifiable.
  changeset-scoped:
    asserts_empty: false
    description: The subject is a diff, so its size varies per commit and zero is a routine,
      correct result. A floor here would fail every commit out of scope.
  session-scoped:
    asserts_empty: false
    description: The subject is whatever the CURRENT session touched, so it varies per session
      and zero is an honest result for a session that touched none of it. Same shape as
      changeset-scoped, different axis — the commit diff versus the session pointer.
  selftest:
    asserts_empty: false
    description: The subject is the check's own fixtures. A row-count floor would count the
      wrong thing. NOT a guarantee the check avoids live data — see the header above.
  not-instrumented:
    asserts_empty: false
    description: The check reads several unlike subjects, so no single EXAMINED is honest for
      it. The remedy is per-subject reporting, not a floor.

batteries:
  syntax:
    deps: []
    description: Encoding and parse checks.
  structure:
    deps: []
    description: Corpus structure and cross-reference integrity.
  data:
    deps: []
    description: Migration reproducibility and data-layer integrity (stdlib only).
  db_integrity:
    deps: []
    description: DB content integrity. Re-run the check for its current state; do not cite a count from
      here.
  tests:
    deps: []
    description: Regression cover for the audit scripts.
  schema:
    deps:
    - pydantic
    description: Entity/schema validators.
  governance:
    deps:
    - pydantic
    description: Decision protocol, doctrine recheck, adversarial-use.
  attestation:
    deps:
    - jsonschema
    description: Adherence-log attestations.
  research:
    # pypdf/cffi ADDED 2026-09-16. THE PROJECT COULD NOT READ THE FORMAT ITS EVIDENCE
    # ARRIVES IN. retrieval_log.py's own comment says PDF "is the format Co-1 and
    # disability-led evidence overwhelmingly arrives in", and no sanctioned dependency
    # could open one: a fresh container has no pypdf, no pdfminer and no pdftotext. The
    # batch-09 R1 pass hit this on its first non-English source (REF-00988, a DGUV PDF)
    # and had to install a reader ad hoc to read a document it had already persisted.
    #
    # cffi IS NOT OPTIONAL AND IS NOT COSMETIC. The container's Debian cryptography
    # 41.0.7 is installed WITHOUT its _cffi_backend, so `import pypdf` does not raise
    # ImportError -- it raises pyo3_runtime.PanicException from a Rust binding, which
    # `except ImportError` does not catch. pypdf alone therefore installs successfully
    # and still cannot be imported, and ensure-deps.sh would report it missing forever.
    # Installing cffi repairs cryptography and pypdf imports clean.
    #
    # pymupdf ADDED 2026-09-20, AND THE REASON IS A MEASURED FAILURE, NOT A PREFERENCE.
    # pypdf reads a PDF's TEXT LAYER. When that layer is damaged -- as it is on every
    # scanned pre-1990 report this project keeps reaching for -- pypdf returns mush, and
    # batch 19 read that mush as a fact about the DOCUMENT. It recorded "no OCR engine is
    # available in this environment, so this text layer is the best that exists here",
    # transcribed 38 bibliography entries with authors marked illegible and years marked
    # unresolvable, built a floor/ceiling band into mining_screen.py to bound the damage,
    # and carried all of it into a session record, an attestation, three candidates, two
    # extractions and an amendment to a filed gap. The pages are JBIG2 IMAGES and render
    # legibly in under a second: the entry transcribed as "[?] [Un]iversity" reads
    # "New York: Columbia University, 1974", and the one whose initial and year were
    # called unreadable reads "Walter, F. ... Disabled Living Foundation, 1971".
    #
    # A text layer is evidence about the text layer. The page is the document. Without a
    # renderer the project has only the first, and a session that meets a damaged scan
    # will reason about its limits instead of reading it -- carefully, at length, and
    # wrongly. scripts/research/page_image.py is the second route.
    #
    # NO CHECK IMPORTS pypdf OR pymupdf TODAY, stated plainly rather than implied. It is declared
    # here because this file is the one home of the dependency list (CLAUDE.md §1) and
    # because the research WRITE path needs it: a PDF-only source cannot have its
    # --claim-text or --quote verified against bytes, so every standards and Co-1 PDF
    # routes through --verbatim-exempt, and §5(c)'s floor is bypassed structurally
    # rather than by anyone's choice. Making quote_in_artefacts PDF-aware is the change
    # that turns this into a dependency a CHECK needs; it is proposed, not made here.
    #
    # CORRECTED 2026-09-18 (batch 18): the sentence above was HALF TRUE when written.
    # --claim-text could route through the exemption; --quote on a relation edge could
    # NOT, because add-extraction accepted the flag and never passed it to
    # _write_relation_edge (GAP-007, closed in that batch). So a PDF-only source could
    # not carry a relation edge at all, and the note read as though it could. Fixed in
    # scripts/db.py; relate-extraction and derive-extraction still expose no flag of
    # their own. Derive the state: grep -n 'verbatim_exempt' scripts/db.py.
    deps:
    - pydantic
    - jsonschema
    - cffi
    - pypdf
    - pymupdf
    description: Research definition-of-done and its enforcers.
  render:
    deps: []
    description: Derived-output freshness and rendered-document integrity.
