    battery: tests
    kinds: [tooling, governance]
    level: advisory
    cost: fast

  - id: test_url_verifier
    cmd: [python3, scripts/tests/test_url_verifier.py]
    battery: tests
    kinds: [tooling]
    level: advisory
    cost: fast
