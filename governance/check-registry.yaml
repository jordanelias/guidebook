    reason: >-
      RED (~7 real findings; the raw hit count is unstable — see below, and do not
      write a number here). CORRECTED 2026-08-01 — this entry previously said it
      "detects schemas/*.py vs SQLite drift". It does not, and the script's own
      docstring disclaims exactly that ("Does not parse schemas/*.py Pydantic
      models against column definitions... checks table-name reachability only").
      What it actually does is lexically scan scripts/**/*.py for SQL table
      references and flag identifiers absent from the live DB. Pydantic-vs-SQLite
      parity belongs to validate_pydantic_schemas, now wired; these two never
      overlapped, so the "one of the two should own schema drift" framing was
      false on both sides.
      Held because the signal has been overtaken by lexical false positives: 14 of
      them are prose words in docstrings (THE, of, table), selftest fixture
      literals (no_such_table, zzz_phantom) and tables of a DIFFERENT database
      (build_meta/edges/findings/nodes live in the gitignored audit_graph.db).
      DO NOT WRITE A FIXED NUMBER HERE — re-run it. This entry said 19, then 21,
      then 22, across three commits of a single session, and each move was caused
      by the session's own prose and test fixtures rather than by any change to the
      code being audited: a docstring reading "an UPDATE changes no count" made it
      report `changes` as a missing table, and selftest fixtures named `t` and `vf`
      added two more. Writing English about SQL manufactures findings in this tool.
      That is the strongest available evidence that its lexical scan has stopped
      being a signal, and a demonstration that a count written into a register can
      be falsified by the next commit rather than the next year. The
      ~7 real hits are room_page.py's 6 phantom tables — an already-tracked,
