  status: quarantined
  reason: 'RE-MEASURED 2026-08-22: 1 tier-derivation inconsistency of 5 checked, not 274. The 274 figure
    predates the 2026-08-06 clean-room reset, which deleted the corpus that produced it; it survived here
    for sixteen days as a live-sounding justification for a state that no longer existed, and the 2026-08-18
    cull plan then measured it again and recorded PASS/0 — also wrong, because the 2026-08-19 batch had
    not yet landed its five sources. WHAT IT ACTUALLY FINDS TODAY, and why this entry is NOT retired:
    `scope` was NULL on all five admitted sources, and schemas/tier_derivation.py keys the ratified tier
    table on (evidence_type, scope) — so every stored tier was UNDERIVABLE, asserted with its own derivation
    input missing. Four were fixed 2026-08-22 by recording the one scope their evidence_type admits; no
    tier changed. The one that remains is REF-00967, where evidence_type=''clinical'' admits high_control
    (Tier 1) and lower_control (Tier 3), the stored tier is 1, and choosing IS the disputed tier — owner
    decision OD-E. The gate is pointing at a real open question, which is what a gate is for. A NOTE ON
    THE 2026-08-20 KEEP-RATIONALE, because it was false and load-bearing. That cull kept this script and
    its wrapper on the ground that "test_adjudication_integrity is a LIVE registered check". It is not,
    and never was: that id appears in this file only inside this prose. The right reason to keep it is
    the one above — it is not vacuous — and it is worth recording that the correct decision was reached
    through an incorrect premise. Still quarantined: run_checks.py never selects it, so it does not gate
    anything. Promotion is owner-gated and waits on OD-E.'
