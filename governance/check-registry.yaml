- id: validate_schema_cross_check
  cmd:
  - python3
  - scripts/validate_schema.py
  - --cross-check
  battery: schema
  kinds:
  - schema
  - data
  level: advisory
  basis: base/base-schema-validates
  cost: fast
  min_items: 1
  floor_basis: 'FLOOR RESTORED 2026-09-02, a day after it was retired, because the check acquired a subject
    for the first time in its life. It was retired on the true premise that no YAML entity type was declared.
    It has since been REPOINTED: it no longer reconciles a YAML corpus against jurisdictional_values (both
    sides of that pairing are gone -- the table emptied by the item-layer ruling, the YAML archived) but
    reconciles research_code_leads against the _archived/ corpus D-0185 restored it from, on the
    (jurisdiction, standard_name) identity. It examines 83 leads and was proven to fire by deleting one.
