    (DR-2026-09-26-recurring-defect-shapes-remediation.md RC4): mechanises a requirement that
    already existed three times over (the 2026-08-19 RULE, DR-2026-09-11 clause 2, this same
    criterion) and had no enforcer. `CURRENT`, not `LATEST-RESEARCH` — the latter names the
    PREVIOUS session for the whole life of this one (CLAUDE.md section 7). Advisory for now:
    the level is a rollout decision, not an owner question (DR-2026-09-26 section 1.4) — it
    promotes to blocking once the first research batch closes a recorded, closed, disposed
    pass with EXAMINED above zero.'
