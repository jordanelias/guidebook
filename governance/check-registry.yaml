schema_version: 1
kinds:
  schema:
    description: Schema definitions and the migrations that move them.
    paths:
    - schemas/**
    - scripts/migrations/**
  governance:
    description: Doctrine, decision records, attestations, the operative rule ledger.
    paths:
    - governance/**
    - decisions/**
    - attestations/**
    - references/project-standards.md
    - references/skill-registry.md
    - architecture/**
  synthesis:
    description: Reasoning docs and the BPC corpus — the synthesis paths that carry the doctrine token
      and the attestation requirement.
    paths:
    - references/bpc-reasoning/**
    - references/connection-reasoning/**
    - references/bpc/**
    - sessions/**
  data:
    description: The canonical DB and the entity YAML beneath it.
    paths:
    - data/**
  render:
    description: Generated product surfaces — never hand-edited, always derived.
    paths:
    - parts/**
    - site/**
    - specs/**
    - tools/*.html
    - audits/evidentiary-base-audit*
    - index.html
    - assets/**
  tooling:
    description: The apparatus itself — scripts, generators, workflows, hooks, deps.
    paths:
    - scripts/**
    - tools/**
    - .github/**
    - .claude/**
    - requirements.txt
batteries:
  syntax:
    deps: []
    description: Encoding and parse checks.
  structure:
    deps: []
    description: Corpus structure and cross-reference integrity.
  data:
    deps: []
    description: Migration reproducibility and data-layer integrity (stdlib only).
  db_integrity:
    deps: []
    description: DB content integrity. Re-run the check for its current state; do not cite a count from
      here.
  tests:
    deps: []
    description: Regression cover for the audit scripts.
  schema:
    deps:
    - pydantic
    description: Entity/schema validators.
  governance:
    deps:
    - pydantic
    description: Decision protocol, doctrine recheck, adversarial-use.
  attestation:
    deps:
    - jsonschema
    description: Adherence-log attestations.
  research:
    deps:
    - pydantic
    - jsonschema
    description: Research definition-of-done and its enforcers.
  render:
    deps: []
    description: Derived-output freshness and rendered-document integrity.
checks:
- id: check_utf8_md
  cmd:
  - python3
  - scripts/ci_helpers/check_utf8_md.py
  battery: syntax
  kinds:
  - always
  level: blocking
  basis: hygiene
  cost: fast
  min_items: 1000
- id: check_json
  cmd:
  - python3
  - scripts/ci_helpers/check_json.py
  battery: syntax
  kinds:
  - always
  level: blocking
  basis: hygiene
  cost: fast
  min_items: 50
- id: check_yaml
  cmd:
  - python3
  - scripts/ci_helpers/check_yaml.py
  battery: syntax
  kinds:
  - always
  level: blocking
  basis: hygiene
  cost: fast
  min_items: 20
- id: validate_bpc
  cmd:
  - python3
  - scripts/validate_bpc.py
  - --all
  battery: structure
  kinds:
  - always
  level: blocking
  basis: hygiene
  cost: fast
  min_items: 1
  note: 'Cheap enough that gating it would buy nothing and risk a misclassified diff slipping a malformed
    BPC through. Deliberately ungated. INSTRUMENTED 2026-08-14 (A5): EXAMINED prints the references/bpc/**/*.md
    file count (102 today). File-glob-derived, so min_items:1 — a run that finds zero files means the
    glob broke, not that BPCs were legitimately retired to none.'
- id: validate_cross_refs
  cmd:
  - python3
  - scripts/validate_cross_refs.py
  - --repo-root
  - .
  battery: structure
  kinds:
  - always
  level: blocking
  basis: hygiene
  cost: fast
  no_floor: not-instrumented — several distinct subjects (slugs, CON-IDs, BPC files, search-logs, scan
    files, the handoff pointer), each with its own count and no single one honestly speaks for the whole
    check; instrumenting any one of them would misrepresent the others. Left uninstrumented on 2026-08-14
    (A5) rather than invent a combined figure — see CLAUDE.md guardrail 1.
  note: Cross-references span every corpus, so no path filter is correct here.
- id: test_db_integrity
  cmd:
  - python3
  - scripts/tests/test_db_integrity.py
  battery: db_integrity
  kinds:
  - data
  - schema
  level: blocking
  basis: unattributed
  cost: fast
  min_items: 1
  floor_basis: 'INSTRUMENTED 2026-08-24. This entry read `no_floor: not-instrumented — ... it prints no
    whole-check EXAMINED count, so no floor is declarable yet`, and that was accurate: the gate printed
    70 green ticks with no denominator anywhere, so a pass could not be told apart from an abstention.
    Every sub-check now declares its subject and the run prints a whole-check `EXAMINED: <n>` line, so
    a floor is declarable and this is it.

    min_items:1, not a larger number, and the reason is on the record: the 2026-08-06 clean-room reset
    took evidence_sources from 863 rows to 10. A floor pinned to a corpus size would have gone red on
    a deliberate decision and stayed red. What this floor asserts is the one thing that must never stop
    being true — that the gate looked at SOMETHING. Derive the live figure; do not read a number here.

    WHAT THE INSTRUMENTATION FOUND, and it is the reason this was worth doing: 29 of the 70 sub-checks
    currently pass HAVING EXAMINED NOTHING, including all four of section F (pipeline_runs is empty),
    all of J and K, and D04/D05. They were indistinguishable from real coverage. They are now listed by
    id at the end of every run under `PASSED HAVING EXAMINED NOTHING`. They are reported, not failed:
    an empty scope is often simply true — D04/D05 examine DOI-less sources and every live source has a
    DOI — and failing on it would turn the gate red for a correct state, which is not what CLAUDE.md §2(a)
    asks for.

    '
  note: "RE-MEASURED 2026-08-22: 72/72 checks pass. The previous text here read \"RED on main (63/69 checks\
    \ pass as of 2026-08-04)\" and was carried unchanged for eighteen days after it stopped being true\
    \ — a hardcoded volatile fact inside the gate inventory itself, which is the CLAUDE.md §2(b) failure\
    \ one level up from where that rule is usually applied. Correcting it was scheduled by the 2026-08-16,\
    \ 08-17 and 08-18 plans and skipped three times. Derive it; do not read a number here: `python3 scripts/tests/test_db_integrity.py`.\
    \ Level left as declared, and held in its own battery so enabling branch protection does not deadlock\
    \ every data-touching PR on a content backlog. SUPERSEDED 2026-08-04 — everything below this line\
    \ about the verification_status vocabulary describes a database that no longer exists, and is retained\
    \ only so the reasoning is auditable. D-0157 (DR-2026-08-04-verification-status-is-a- standing-not-a-history)\
    \ was RATIFIED and its migrations ran: the live distribution is VERIFIED 752 / UNVERIFIED 111 and\
    \ nothing else. VERIFIED-1, VERIFIED-2, VERIFIED-WITH-CORRECTION, UNVERIFIED-1, UNVERIFIED-CLOSED,\
    \ SUPERSEDED and DISPUTED are retired as status values (DISPUTED survives only as a closure reason).\
    \ B01/B02/B05/B06 now PASS. The six remaining failures are I2 (the D-0157 adjudication queue: rows\
    \ asserting VERIFIED with no recorded attempt) plus C02/C03/C04/D05/G02, which ARE the genuine content\
    \ backlog the note below correctly identified. In particular the closing instruction below — \"ratifying\
    \ it is a D-SCHEMA decision for the owner, not a unilateral edit to a blocking gate\" — has been satisfied;\
    \ do not read it as still-open guidance. CORRECTED 2026-08-01 — this entry and the register both said\
    \ \"106 of 863 evidence_sources rows carry a verification_status outside the enum\" and called the\
    \ whole failure a content backlog. Both halves were wrong:\n  - The count is 81, not 106. 106 is 863\
    \ minus the 757 plain-VERIFIED rows,\n    which wrongly counts the 25 UNVERIFIED-1 rows that ARE in\
    \ the enum.\n    Verified distribution: VERIFIED 757, VERIFIED-2 71, UNVERIFIED-1 25,\n    DISPUTED\
    \ 7, VERIFIED-WITH-CORRECTION 2, VERIFIED-1 1.\n  - The verdict is split, not uniform. B01/B06 are\
    \ a STALE TEST: the test's\n    list was last curated in May 2026, while DISPUTED and CLOSED-DECIDED\
    \ were\n    created by the owner-approved DR-2026-07-20 migration, and\n    VERIFIED-WITH-CORRECTION\
    \ is in schemas/enums.py, which the test omits.\n    VERIFIED-2 (71 rows across 19 migrations) is\
    \ a deliberate honesty\n    distinction — verification by convergent retrieval rather than a\n   \
    \ first-hand render — that collapsing to VERIFIED would destroy.\n    C01-C04 and G02 ARE a genuine\
    \ content backlog (one July citation-mining\n    batch inserted with DOIs but no resolution outcome,\
    \ no source_type and\n    premature COMPLETE labels), and B02/B05 are mixed.\nWidening the test's\
    \ enum is NOT done here: verification_status has no CHECK constraint and four vocabularies coexist\
    \ (test list, schemas/enums.py, architecture/schema-spec.md, live practice), so ratifying it is a\
    \ D-SCHEMA decision for the owner, not a unilateral edit to a blocking gate. Deliberately NOT triggered\
    \ by `tooling`: it asserts things about DB CONTENT, which a scripts-only diff cannot change. db_path_env_audit\
    \ and pipeline_contract_audit are the checks that a tooling diff can actually break."
- id: migration_reproducibility
  cmd:
  - python3
  - scripts/audit/migration_reproducibility.py
  battery: data
  kinds:
  - data
  - schema
  level: blocking
  basis: cross_stage/reproducibility-invariant
  cost: slow
  min_items: 1
  note: 'INSTRUMENTED 2026-08-14 (A5): EXAMINED prints the count of core invariants compared (7 today:
    schema_version + six table COUNT(*)s). A fixed, code-declared list — zero would mean the comparator
    itself broke, not that the DB shrank, so min_items:1. GAP-290 enforcement — the gate that actually
    stops direct DB writes. Was two hand-kept inline heredocs (audit.yml and preflight.sh); now one script.
    SCOPE, recorded 2026-08-01 because the description above overstates it: this compares PRAGMA user_version
    plus COUNT(*) on six tables. An UPDATE changes no count, so value-level edits are invisible to it,
    as is anything in the other 55 tables. CLAUDE.md §0 rule 4 says CI "fails on any divergence", which
    this has never done. See migration_reproducibility_deep.'
- id: migration_reproducibility_deep
  cmd:
  - python3
  - scripts/audit/migration_reproducibility.py
  - --deep
  battery: data
  kinds:
  - data
  - schema
  level: advisory
  basis: cross_stage/reproducibility-invariant
  cost: slow
  min_items: 1
  note: 'INSTRUMENTED 2026-08-14 (A5): EXAMINED prints the count of tables walked by the deep comparison
    (67 today: every user table plus the two DR-2026-05-28 exemptions). Fixed by the schema, not the data
    — min_items:1. Every table, every row — the comparison the core invariants cannot make. Added 2026-08-01
    after an adversarial trace showed the blocking check above passes on a tampered DB: editing a row''s
    tier and title, and inserting a forged `stated` row into specifications (then `evidence_cell_state`),
    both leave all seven invariants identical. RED, and the two findings look like an incomplete exemption
    list rather than a hand-edited DB: evidence_sources diverges on 277 rows (subtype, citation_count,
    pages, pub_month) because scripts/resolve_dois.py writes Crossref enrichment straight into it, and
    url_verification_runs diverges by one row because verify-urls.yml inserts its run record. Both are
    written by the same scheduled workflows that DR-2026-05-28 already exempted evidence_source_authors
    and pipeline_runs for — they were simply never added. ADVISORY, not blocking, and deliberately so:
    resolving this is an owner call between widening the DR''s exemption list and requiring those jobs
    to emit migrations. Promoting it before that decision would block every data PR on a divergence the
    project may well consider legitimate. Timestamp-only divergence is reported separately from content
    so the check does not cry wolf: 4 further tables differ only in created_at/updated_at. RESOLVED 2026-08-01:
    the second rebuild is gone. A rebuild''s only input is the migration files, so it is cached on their
    SHA; this check and the blocking one run in the same `data` battery job, so the pair now costs one
    rebuild rather than two (45.4s -> 0.1s on the second invocation). Any migration edit changes the fingerprint
    and forces a fresh build, verified by mutation, so the cache cannot mask what the check exists to
    detect. Reuse is printed rather than silent.'
- id: source_slug_links_duplicates
  cmd:
  - python3
  - scripts/audit/source_slug_links_duplicates.py
  battery: data
  kinds:
  - data
  level: blocking
  basis: unattributed
  cost: fast
  no_floor: empty-by-decision — instrumented and examining 0 because the corpus was emptied by decision,
    not by accident; see note
  note: 'EXAMINED line added 2026-08-06: "0 duplicate sets in 1011 rows" and "0 in 0 rows" printed byte-identically,
    and this is blocking, so the pass carried no information about whether the table was intact or gone.
    `min_items: 1` was declared alongside it and RETIRED the same day by the clean-room reset, which emptied
    source_slug_links by decision. The guard exists to catch a check passing on an ACCIDENTALLY empty
    subject; an empty subject that is the declared state of the project is not that, and leaving the guard
    would have made a blocking gate red for telling the truth. The EXAMINED line stays, so the emptiness
    is still visible rather than inferred.'
- id: validate_parameters
  cmd:
  - python3
  - scripts/validate_parameters.py
  battery: data
  kinds:
  - data
  - schema
  level: advisory
  basis: base/base-parameter-vocabulary
  cost: fast
  min_items: 1
  note: 'P5, 2026-09-10, REPLACES validate_items.py (deleted in the same commit). validate_items.py read
    `items`, which holds 0 rows by the owner''s 2026-09-01 ruling and cannot ever hold rows again without
    a new ruling -- so it failed EXAMINED:0 against min_items:1 permanently, by construction, not by a
    correctable defect. A check that can never pass is not a floor, it is a fixed red light nobody can
    act on, which teaches its reader to ignore it (CLAUDE.md §5a in miniature).

    This asserts the ONE thing SQLite cannot state itself: no `terms.canonical_en` reached by a live
    `base_parameters` row matches the value-bearing pattern (a digit, a comparator, or a min/max word)
    -- the item-layer defect (DR-2026-08-19 §1.1: 42 of 93 item names embedded a determination) restated
    one layer down, against the table the owner named as `items`''s replacement subject (owner ruling
    2026-08-26, "the judgment object is the canonical parameter"). Full reasoning is in the script''s own
    header per CLAUDE.md §8.

    NOT A SECOND COPY OF A RULE (CLAUDE.md rule 5): the regex is imported from `scripts/db.py`''s
    `_VALUE_BEARING`, which `add-term` and `add-parameter` already refuse against at write time. This
    check is the backstop for what that refusal cannot cover -- a migration written directly against
    dbcore, or a future writer that does not route through `db.py` -- not a first line of defense.

    `base_parameters` is empty today (2026-09-10, no batch has minted a parameter yet), so this reports
    NOTHING-IN-SCOPE. min_items:1, not no_floor: unlike `items`, this table was never emptied by ruling
    -- it is the intended home for exactly the work the owner wants done next, so an empty result today
    is a stage with no subject yet, and the day it gets one this floor is what makes a silently-reopened
    item-layer defect visible instead of silent. Fault-injected 2026-09-10: a scratch-DB row named
    `corridor width >=1200 mm` was rejected (EXAMINED:1, exit 1); a row named `corridor width` passed
    (EXAMINED:1, exit 0).'
- id: readonly_db_open_audit
  cmd:
  - python3
  - scripts/audit/readonly_db_open_audit.py
  battery: data
  kinds:
  - data
  - tooling
  level: advisory
  basis: unattributed
  cost: fast
  min_items: 1
  note: 'INSTRUMENTED 2026-08-14 (A5): EXAMINED prints the read-only-consumer count (39 today). min_items:1
    matches the check''s own vacuity guard, which already FAILS outright on zero readers found. A script
    that only reads must open the canonical DB read-only. Sibling of db_path_env_audit — same scope filter,
    same EXCLUDE_PARTS, so "legacy" means one thing repo-wide — but a different contract: that one asks
    WHICH database a script opens, this one asks HOW. The cost is not the `-wal`/`-shm` sidecars, though
    those are real enough that .gitignore already carries an entry for them. It is that a read-write handle
    is a write the reproducibility gate CANNOT SEE: migration_reproducibility compares PRAGMA user_version
    plus COUNT(*) on six tables, so a checkpoint or a stray mutation changes nothing it looks at. The
    migrations-only rule (CLAUDE.md §0 rule 4) is absolute; its detection floor is not. Every unnecessary
    rw handle is another way for the canonical DB to change without a migration. A writer is OUT OF SCOPE,
    not an offender — write status is decided by AST, inspecting only string literals actually passed
    to an execute call. A whole-file keyword scan reports UPDATE and DROP from prose in comments; the
    first draft of the sweep did exactly that and produced 35 false writers including pure readers. Scratch
    opens (lower-case `db_path`, `:memory:`, a rebuilt copy) stay allowed: only connects naming a canonical
    constant count. Carries a vacuity guard — zero read-only consumers found means the scope filter is
    broken, and FAILS rather than passing on an empty set. Measured 2026-08-06: 39/39 green after the
    sweep; 16 of 43 before it. Advisory per house norm; promote once the false-positive rate is known.'
- id: db_path_env_audit
  cmd:
  - python3
  - scripts/audit/db_path_env_audit.py
  battery: data
  kinds:
  - data
  - tooling
  level: blocking
  basis: unattributed
  cost: fast
  min_items: 1
  note: 'INSTRUMENTED 2026-08-14 (A5): EXAMINED prints the count of in-scope scripts audited (55 today,
    direct + exempt). min_items:1 — a run that finds zero in-scope scripts means the scope filter broke.
    Triggers on `tooling` too: the contract it enforces is a property of the SCRIPTS, so a scripts-only
    diff is exactly when it can regress.'
- id: alias_provenance_audit
  cmd:
