# --- quarantine -------------------------------------------------------------
# Registered so they stay visible, never selected. Every entry needs a `reason`
# and, where applicable, the owner-gated action that would resolve it. Nothing is
# deleted: retirement is owner-gated (CLAUDE.md §9 guardrail 4), and these are
# recorded for that decision, not pre-judged.
quarantine:

  - id: validate_db
    cmd: [python3, scripts/validate_db.py]
    status: broken
    reason: >-
      Crashes — `sqlite3.OperationalError: no such column: doi_less_key`. Written
      against a schema the DB no longer has. Superseded by test_db_integrity.py,
      which CLAUDE.md §7 already tells you to prefer.
      DO NOT RETIRE without fixing the caller first: scripts/db.py:1120 INVOKES it
      as a subprocess, so archiving the file breaks a live path in the read/query
      workhorse. Its other references live in sessions/ records and a DR — historical
      documents that describe what was true then and must not be rewritten to tidy a
      filename. Quarantine is the correct terminal state here, not retirement:
      it already stops the script being mistaken for a working gate.

  - id: validate_items
    cmd: [python3, scripts/validate_items.py]
    status: broken
    reason: >-
      Crashes — `IndexError: No item with that key`. Duplicate of validate_item.py
      (green): same subject, table-oriented rather than corpus-oriented.
      Retirement would require touching DR-2026-07-23-population-schema-replace and
      two workplans — historical records. Quarantined instead; fix or leave.

  - id: validate_item
    cmd: [python3, scripts/validate_item.py]
    status: quarantined
    reason: >-
      Green, but its YAML corpus (data/items) does not exist, so it validates only
      the markdown surface and passes with 21 warnings. Wire once the item corpus
      lands, or fold into validate_schema. Not wired on a pass that proves nothing.

  - id: validate_conflict
    cmd: [python3, scripts/validate_conflict.py]
    status: quarantined
    reason: >-
      RED — 11 errors, all unknown population codes in references/conflict-matrices/
      ('IntD', 'VIS'). That is either stale matrices or a stale code list; it is a
      real finding needing adjudication, not a gate to switch on. Overlaps
      validate_conflicts.py (DB-side, green, 0 rows).

  - id: validate_conflicts
    cmd: [python3, scripts/validate_conflicts.py]
    status: quarantined
    reason: >-
      Green but vacuous — the conflicts table has 0 rows, so it asserts nothing.
      Wire when the table is populated.

  - id: register_integrity_check
    cmd: [python3, scripts/audit/register_integrity_check.py]
    status: quarantined
    reason: >-
      Requires an `html` positional argument, so it cannot run corpus-wide as-is.
      Also carries the ENGINE-LAG flagged in the 2026-07-23 plan: it still enforces
      I3's repealed absolute form and will false-fail correct weak-band rendering
      under DR-2026-07-21 Option A. Needs the Option-A patch AND an --all mode.

  - id: claims_docket
    cmd: [python3, scripts/audit/claims_docket.py]
    status: quarantined
    reason: >-
      A subcommand CLI with no default action (prints usage, exits 0). Needs a
      `check` invocation against a working diff to be meaningful in CI.

  - id: pmp_audit
    cmd: [python3, scripts/audit/pmp_audit.py]
    status: quarantined
    reason: RED (3 issues). Named by the 2026-07-23 plan WS1; triage the 3 before wiring.

  - id: reasoning_doc_citations_audit
    cmd: [python3, scripts/audit/reasoning_doc_citations_audit.py]
    status: quarantined
    reason: RED (2 issues). Triage before wiring.

  - id: schema_reference_drift_audit
    cmd: [python3, scripts/audit/schema_reference_drift_audit.py]
    status: quarantined
    reason: >-
      RED. Detects schemas/*.py vs SQLite drift — which CLAUDE.md §10 calls a bug,
      not a convention. A real finding; needs triage, then wiring as advisory.

  - id: adjudication_integrity
    cmd: [python3, scripts/audit/adjudication_integrity.py]
    status: quarantined
