- id: validate_items
  cmd:
  - python3
  - scripts/validate_items.py
  battery: data
  kinds:
  - data
  - schema
  level: advisory
  basis: base/base-parameter-vocabulary
  cost: fast
  min_items: 1
  note: 'INSTRUMENTED 2026-08-14 (A5): EXAMINED prints the items-table row count (93 today) — the table
    this validator is named for. min_items:1: an empty items table would mean the DB or the query broke,
    not a legitimate state. REPAIRED AND WIRED 2026-08-05; was quarantined `broken`. It crashed with `IndexError:
    No item with that key` reading `items.applicable_groups`, a CSV  # [RETIRED-VOCAB-OK] of population
    codes packed into one column and dropped when the item×taxonomy junction replaced it — so V5 had been
    validating nothing, loudly, for as long as that was true. V5 now checks the junction: every link resolves
    to a live `populations` row and to a live `items` row. Both foreign keys are re-checked rather than
    trusted, because SQLite enforces FKs per-connection and they are OFF by default, so a file can carry
    orphans its own DDL forbids. It also dropped KNOWN_POPS, a 23-code population taxonomy transcribed
    into the validator, which had drifted from the `populations` table it was supposedly validating. Codes
    now come from that table, so the validator cannot disagree with the data it checks. `applicability`
    is NOT re-checked — the schema''s CHECK constraint owns it, and a fault-injection run caught the first
    draft re-transcribing it two values too narrow. Measured 2026-08-05: 93 items, 372 links across 92
    items, green. Advisory per house norm. The previous quarantine note called this a duplicate of validate_item.py;
    it is not — that one validates the markdown and YAML corpus, this one validates the table.'
- id: readonly_db_open_audit
  cmd:
  - python3
  - scripts/audit/readonly_db_open_audit.py
  battery: data
  kinds:
  - data
  - tooling
  level: advisory
  basis: unattributed
  cost: fast
  min_items: 1
  note: 'INSTRUMENTED 2026-08-14 (A5): EXAMINED prints the read-only-consumer count (39 today). min_items:1
    matches the check''s own vacuity guard, which already FAILS outright on zero readers found. A script
    that only reads must open the canonical DB read-only. Sibling of db_path_env_audit — same scope filter,
    same EXCLUDE_PARTS, so "legacy" means one thing repo-wide — but a different contract: that one asks
    WHICH database a script opens, this one asks HOW. The cost is not the `-wal`/`-shm` sidecars, though
    those are real enough that .gitignore already carries an entry for them. It is that a read-write handle
    is a write the reproducibility gate CANNOT SEE: migration_reproducibility compares PRAGMA user_version
    plus COUNT(*) on six tables, so a checkpoint or a stray mutation changes nothing it looks at. The
    migrations-only rule (CLAUDE.md §0 rule 4) is absolute; its detection floor is not. Every unnecessary
    rw handle is another way for the canonical DB to change without a migration. A writer is OUT OF SCOPE,
    not an offender — write status is decided by AST, inspecting only string literals actually passed
    to an execute call. A whole-file keyword scan reports UPDATE and DROP from prose in comments; the
    first draft of the sweep did exactly that and produced 35 false writers including pure readers. Scratch
    opens (lower-case `db_path`, `:memory:`, a rebuilt copy) stay allowed: only connects naming a canonical
    constant count. Carries a vacuity guard — zero read-only consumers found means the scope filter is
    broken, and FAILS rather than passing on an empty set. Measured 2026-08-06: 39/39 green after the
    sweep; 16 of 43 before it. Advisory per house norm; promote once the false-positive rate is known.'
- id: db_path_env_audit
