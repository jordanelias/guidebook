    CARRIES A DELIBERATE, SELF-DOCUMENTING BACKFILL GUARD: module-level `PRE_075_GRANDFATHER =
    True` in the script. All 8 live extraction rows predate 075 and are ungraded
    (figure_role IS NULL); while the guard is True they are reported as `UNGRADED: 8` and do
