- id: citation_mining_session
  cmd:
  - python3
  - scripts/audit/citation_mining_completeness.py
  - --session
  - '@SESSION@'
  - --tier-max
  - '2'
  battery: data
  kinds:
  - data
  - synthesis
  level: blocking
  basis: unattributed
  cost: fast
  no_floor: empty-by-decision — instrumented and examining 0 because the corpus was emptied by decision,
    not by accident; see note
  requires_session: true
  session_pointer: LATEST-RESEARCH
  note: '@SESSION@ is substituted from **sessions/LATEST-RESEARCH**, not LATEST. W4, 2026-08-06. This
    gate previously read LATEST, which was simultaneously the continuity pointer ("where did work leave
    off") and this gate''s subject ("whose research should be checked"). Those are different objects and
    they had drifted six weeks apart: LATEST named a June continuity session while the newest session
    that actually mined citations was 2026-07-26. The gate therefore scoped itself to a session that touched
    no sources and reported `Outstanding: 0` at 4.7% coverage — a BLOCKING check passing by having nothing
    in scope. CLAUDE.md §2(a) (pointer corrected 2026-08-22, was §10) calls both states meaningless and
    was right: stale, it validates a closed set; advanced to the newest session, it reports zero because
    that session did no research. LATEST-RESEARCH names the newest session with rows in citation_mining
    / search_executions / evidence_sources, so the gate has a real subject. Pointer honesty is enforced
    in three existing places rather than a fourth file: `run_checks.py` FAILS a blocking check whose pointer
    does not resolve (it used to SKIP, which disarmed this gate in silence); `validate_cross_refs` checks
    the handoff''s named record and plan; `test_db_integrity` L04 reports when this pointer drifts out
    of the gate''s Tier 1-2 scope. The standalone `session_pointer_audit.py` was deleted on 2026-08-06
    — it patrolled a hazard whose root cause was a five-line fix in the dispatcher it was watching. The
    split was necessary and not sufficient. Pointing the gate at the right session still returned `Outstanding:
    0`, because the pointer files hold a FILENAME (`….md`) while `evidence_sources.created_by_session`
    holds the bare stem on 32 of its 33 values — so `created_by_session = :session` had been selecting
    nothing under either pointer, for every session, since the flag was added. Both halves were fixed
    together; the audit now normalises the name and reports an `Examined` count so an empty scope is visible
    as `NOTHING-IN-SCOPE` rather than as a pass.'
- id: citation_mining_backlog_t2
  cmd:
  - python3
  - scripts/audit/citation_mining_completeness.py
  - --tier-max
  - '2'
  battery: data
  kinds:
  - data
  level: informational
  basis: unattributed
  cost: fast
  no_floor: empty-by-decision — instrumented and examining 0 because the corpus was emptied by decision,
    not by accident; see note
# DELETED 2026-09-10 (P7): the `validate_schema` id that ran `scripts/validate_schema.py --verbose`
# (no `--cross-check`). ENTITY_REGISTRY = {} (scripts/validate_schema.py:63) is iterated at :101 and
# :149 with nothing else gating the `--verbose` path, so this examined ENTITY_REGISTRY's zero entries
# on every possible input, not merely today's corpus -- vacuous by construction, not by decision, and
# it was registered BLOCKING. CLAUDE.md §5(a): "a blocking gate that can never examine anything gates
# nothing while appearing to gate everything."
#
# THE SCRIPT AND ITS `base/base-schema-validates` BASIS ARE NOT ORPHANED, so nothing below was
# repointed or unclaimed. `scripts/validate_schema.py` was NOT deleted, and this is the reason the
# task brief's premise (delete the file; then decide the criterion's fate) does not hold here:
#   1. `validate_schema_cross_check` below is a SEPARATE registered entry running the SAME file with
#      `--cross-check`, a code path independent of ENTITY_REGISTRY (it reconciles
#      research_code_leads against _archived/data/jurisdictional_values on (jurisdiction,
#      standard_name)). It is demonstrably non-vacuous -- its own floor_basis records "examines 83
#      leads and was proven to fire by deleting one" -- and it ALREADY claims
#      `basis: base/base-schema-validates`, so that criterion stays claimed without any edit here.
#   2. `skills/workplan-orchestrator_SKILL.md` step "2b — Data health check" runs
#      `python3 scripts/validate_schema.py --quick` as a documented, unconditional-when-`data/`-exists
#      session-start step (`data/` exists in this repo). Deleting the file breaks that live, active
#      skill's command. skills/ is out of this batch's edit scope, so that caller cannot be swept here
#      (CLAUDE.md rule 4: "a rename or removal is not done until the callers are swept... so is a
#      skill"). Per this batch's own caller-sweep instruction, a live active-skill caller is a STOP,
#      not a delete.
# Net effect: only the genuinely-vacuous blocking entry is gone. The file, `validate_schema_cross_check`,
# and the `base-schema-validates` criterion (governance/pipeline-contract.yaml) are all untouched.
- id: claude_md_spine
  cmd: ['python3', 'scripts/audit/claude_md_spine.py']
  battery: governance
  kinds: ['governance', 'docs']
  level: blocking
  basis: base/base-names-resolve
  cost: fast
  min_items: 1
  note: >-
    CLAUDE.md is auto-loaded into every session and its stage list is the frame rule 5
    is applied against, so drift there is made at the cost of a duplicated fact in the
    database rather than a red check. For thirteen days the file carried both
    "Substrate is not a stage" and, forty lines below, the paragraph recording that the
    machine enforces base as one. Prose could not catch that; this compares the single
    SPINE line against governance/pipeline-contract.yaml, the declared single home of
    the stage ids. Proven to fail on a dropped stage and on a duplicated SPINE line.

- id: schema_reference_audit
  cmd:
  - python3
  - scripts/audit/schema_reference_audit.py
  battery: schema
  kinds:
  - schema
  - code
  - governance
  level: blocking
  basis: base/base-names-resolve
  cost: fast
  min_items: 1
  note: 'Rule 4 made mechanical. 33 of 66 tables hold 0 rows, so a caller left pointing at a renamed
    table renders NOTHING and every downstream byte-diff certifies it clean. Exemptions live in
    governance/schema-reference-exemptions.yaml, carry a reason, are PRINTED as KNOWN rather than
