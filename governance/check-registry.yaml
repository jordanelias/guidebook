  reason: 'RETIRED 2026-08-15 by owner approval of the Tier-1 batch. Archived to _archived/scripts/validate_db.py,
    mirroring its origin path; the entry is kept rather than deleted so a session that finds the id knows
    where the script went and why, instead of concluding the gate was silently dropped. It was quarantined-but-repaired,
    not broken. The retirement is not about its health: test_db_integrity.py supersedes it (72 checks
    vs 9), CLAUDE.md §7 already directed readers to that one, and wiring both would mean two overlapping
    gates to keep in step. Its `scripts/db.py validate` CLI path was retired with it in the same commit,
    so nothing invokes it. ITS ONE UNRESOLVED SUBSTANTIVE FINDING SURVIVES THE RETIREMENT: C4 found 31
    connections with zero targets. That is a CONTENT defect, not a tooling one, and it is recorded here
    — and only here — so archiving the script does not bury the finding with it.'
