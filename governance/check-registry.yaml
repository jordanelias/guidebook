- id: author_fidelity
  cmd:
  - python3
  - scripts/research/retrieval_log.py
  - --session
  - '@SESSION@'
  - --verify-authors
  battery: research
  kinds:
  - data
  - synthesis
  session_pointer: LATEST-RESEARCH
  requires_session: true
  level: advisory
  basis: DR-2026-08-19 §7 adversarial pass, lens L1 (2026-08-19)
  cost: fast
  min_items: 1
  note: 'Compares STORED author surnames against the Crossref record for every DOI-bearing source. Added
    because the first research batch after the restart stored FABRICATED author lists on all five of its
    admissions — 12 of 19 evidence_source_authors rows named people who did not write the cited paper
    — and NOTHING caught it: C03, G02, R9, R10, test_db_integrity 72/72, research_protocol_audit 0 issues
    and fully green CI all passed it.

    The reason is exact and worth keeping in front of whoever reads this next: every pre-existing check
    asks whether the author fields are POPULATED. None asked whether they are TRUE. A presence check cannot
    detect confabulation; only a comparison against the authoritative payload can. The rows were simultaneously
    stamped verified_by_tool=''crossref'' — the flag asserted precisely the property that failed, so nothing
    downstream would ever revisit them.

    Worst instance was doctrinal, not clerical: a Co-1 source — lived experience, co-primary with T1 under
    CRPD Art 4.3 — had its autistic community co-authors deleted and academics substituted. The Co-1 tier
    was claimed while the evidence of co-production was erased.

    LEVEL RATIONALE, CORRECTED 2026-08-19. The original text here justified advisory on the grounds that
    the check "needs network egress to api.crossref.org" — true of the re-fetching variant that was deleted,
    false of the offline verifier this entry now points at, which reads persisted payloads and needs no
    network at all. The stated promotion condition ("once a run has demonstrated reachability in CI")
    was therefore unsatisfiable by irrelevance, and would have left the check advisory forever.

    Real rationale: it is advisory only until it has demonstrated a NON-VACUOUS subject across more than
    the one session that created the log. Promote to blocking after the second research batch. It fails
    rather than passes when a source has no logged retrieval, so an unlogged corpus cannot read as clean.

    session_pointer is LATEST-RESEARCH, not the default LATEST: LATEST moves on every session close, so
    a governance-only session would point this check at a session that never did research and was never
    supposed to have a log. citation_mining_session is the precedent for the same reason.

    RETIRED the re-fetching variant 2026-08-19. Two verifiers of one property shipped in the same commit
    and DISAGREED — one folded accents, one did not, so a stored "Rosas-Perez" for the actual "Rosas-Pérez"
    passed one and failed the other. This entry now points at the offline verifier, which compares against
    the payload the authoring session actually received: no network, no drift, and it fails rather than
    passes when a source has no logged retrieval.'
