# conflicts.yaml -- the ACTIVE-CONFLICTS REGISTER. Hand-adjudicated; every atom id below is checked to exist
# by `build_graph.py --check`, and every `probe` id must exist in the generator and be re-run on each build.
#
# WHAT A CONFLICT IS HERE: two or more ACTIVE atoms (or an atom and a measured mechanism) that cannot both be
# obeyed/true. A candidate pair from the mechanical detector is NOT a conflict until it is adjudicated here.
# Nothing in this file is a ruling. `direction` states what CLAUDE.md rule 0 / the precedence chain implies and
# says who can actually settle it; where the later statement is not an owner statement the direction is
# "UNSETTLED". Doctrine (mission, tiers, taxonomy, CRPD posture, licensing, jurisdiction) is owner-gated
# (CLAUDE.md section 8), so resolver=OWNER for those even when the direction is clear.
#
# class:    RULING-RULING   two ratified/owner statements disagree
#           RULING-DOC      a standing document restates something a later ruling changed (stale doc loses)
#           RULING-MECHANISM  a ruling the schema/code/CI does not carry (measured by a probe, not read off prose)
#           DOC-DOC         two documents disagree and no later owner statement decides between them
#           UNRECORDED      an owner statement whose only home is a session record (invisible to a ledger search)
#           PROVENANCE      a statement is treated as binding although its recorded speaker/status is weaker
# severity: S1 changes what work may be done, or what a gate/engine permits, today
#           S2 misleads a reader or agent; no gate or engine is affected
#           S3 housekeeping (count drift, stale cross-reference)
# Each `sides` entry: atoms (ids) + says (the reading of those atoms, one line).

