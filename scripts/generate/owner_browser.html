    --chip: #22302d; --accent: #78b9e4; --accent-ink: #0b1a22; --warn-bg: #3a2f10; --warn-ink: #f0d9a0;
    --bad: #f2917d; color-scheme: dark;

}
:root[data-theme="dark"] {
  --bg: #0f1614; --panel: #172120; --ink: #e2eae6; --muted: #92a49c; --rule: #2a3835;

  const list = h("div", { class: "stack", id: "rows" }), more = h("div", { class: "stack" }), status = h("p", { class: "gl" });
  const search = h("input", { type: "search", placeholder: "Search this table", "aria-label": "Search this table", value: state.search[name] || "" });
  const sort = h("select", { "aria-label": "Order by" }, h("option", { value: "" }, "Order added"), t.cols.map((c) => h("option", { value: c.name, selected: state.sort[name] && state.sort[name].col === c.name }, c.name)));
  const dir = h("button", { type: "button", "aria-label": "Reverse order" }, state.sort[name] && state.sort[name].desc ? "↓" : "↑");

    if (state.filter && state.filter.table === name) { parts.push(q(state.filter.col) + " = ?"); params.push(state.filter.val); }

      h("span", { class: "top" }, h("span", { class: "ttl" }, keyOf(t, r)), isRetired(t, r) ? h("span", { class: "chip" }, "retired") : null),
      fields.filter((f) => f in r).map((f) => h("span", { class: "kv" }, h("span", { class: "k" }, f), h("span", { class: "v" }, value(r[f])))))));

  }

  search.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => { state.search[name] = search.value; state.limit[name] = PAGE; draw(); }, 250); });

  dir.addEventListener("click", () => { const so = state.sort[name] || { col: "" }; so.desc = !so.desc; state.sort[name] = so; dir.textContent = so.desc ? "↓" : "↑"; draw(); });
  const pick = h("details", { class: "fieldpick" }, h("summary", null, "Fields on each card"), h("div", { class: "body" }, t.cols.map((c) =>
    h("label", null, h("input", { type: "checkbox", checked: fields.includes(c.name), onchange: (e) => { const i = fields.indexOf(c.name); if (e.target.checked && i < 0) fields.push(c.name); if (!e.target.checked && i >= 0) fields.splice(i, 1); draw(); } }), h("code", null, c.name)))));
  const gl = META.glossary[name];
  const page = [

      h("div", { class: "chips" }, h("span", { class: "chip" }, stageOf(name) || "unmapped"), h("span", { class: "chip" }, fmt(t.rows) + (t.rows === 1 ? " row" : " rows")), chipsFor(t)),
      gl && h("p", { class: "gl" }, gl)),

}

// Every filled field of a row, in full, with pointers followed and field notes on tap; empty fields collapsed.
function fieldsOf(t, r) {
  const fieldBlock = (c) => {
    const v = r[c.name], ptr = pointerOf(t, c.name);
    const { bits } = noteBox(t, c.name);
    let shown = value(v, true);
    if (ptr && !isNil(v)) {
      const target = rowidOf(ptr.table, ptr.to, v);
      shown = target ? h("a", { href: "#r-" + slug(ptr.table) + "-" + target }, String(v), " → ", ptr.table) : h("span", null, String(v), " ", h("span", { class: "chip warn" }, "no such row in " + ptr.table));
    }
    const label = bits.length ? h("details", { class: "fld" }, h("summary", { class: "k" }, c.name + " ⓘ"), h("div", { class: "notes" }, bits)) : h("span", { class: "k" }, c.name);
    return h("div", { class: "kv" }, label, h("span", { class: "v" }, shown));
  };
  const empty = t.cols.filter((c) => isNil(r[c.name]));
  return [...t.cols.filter((c) => !isNil(r[c.name])).map(fieldBlock),
    empty.length ? h("details", null, h("summary", null, "Empty fields · " + empty.length), h("div", { class: "body" }, h("div", { class: "chips" }, empty.map((c) => h("span", { class: "chip" }, c.name))))) : null];
}

function rowPage(name, rid) {

  const fields = fieldsOf(t, r);
  const inbound = [];
  const seen = new Set();
  for (const i of t.inbound) {
    const k = i.table + "." + i.col; if (seen.has(k) || isNil(r[i.to])) continue; seen.add(k);
    const n = one("select count(*) from " + q(i.table) + " where " + q(i.col) + " = ?", [r[i.to]]);
    if (n) inbound.push(h("a", { class: "item", href: "#t-" + slug(i.table), onclick: () => { state.filter = { table: i.table, col: i.col, val: r[i.to] }; state.limit[i.table] = PAGE; } },
      h("span", { class: "top" }, h("span", { class: "nm" }, i.table), h("span", { class: "n" }, fmt(n))), h("span", { class: "gl" }, "through " + i.col + (i.implicit ? " (inferred)" : ""))));
  }

    h("div", { class: "stack" }, h("a", { href: "#t-" + slug(name), class: "mono" }, name), h("h1", { class: "mono" }, keyOf(t, r)),
      META.glossary[name] && h("p", { class: "gl" }, META.glossary[name]),
      isRetired(t, r) ? h("p", { class: "note" }, "This row is no longer in force (retired, superseded or merged).") : null),
    h("div", { class: "stack" }, fields),
    holds && holds.length ? h("div", { class: "sec" }, h("h2", null, "Determinations resting on this source"), h("div", { class: "chips" }, holds.map((x) => h("span", { class: "chip" }, x.join(" #"))))) : null,
    inbound.length ? h("div", { class: "sec" }, h("h2", null, "Pointed to by"), h("div", { class: "stack" }, inbound)) : null,
  ];
}

function viewPage(name) {
  const v = SCHEMA.views[name];
  if (!v) return notFound(name);
  const rows = all("select * from " + q(name) + " limit " + PAGE);
  return [
    h("div", { class: "stack" }, h("h1", { class: "mono" }, name), h("div", { class: "chips" }, h("span", { class: "chip" }, "view"), h("span", { class: "chip" }, fmt(v.rows) + " rows")),
      h("p", { class: "gl" }, "A saved query. It is recomputed every time it is read, so it always matches the tables it reads.")),
    h("div", { class: "sec" }, h("h2", null, "Reads"), h("div", { class: "stack" }, v.reads.map((n) => h("a", { class: "item", href: (SCHEMA.tables[n] ? "#t-" : "#v-") + slug(n) }, h("span", { class: "nm" }, n))))),
    h("details", null, h("summary", null, "Definition"), h("div", { class: "body" }, h("pre", null, v.sql))),
    h("div", { class: "sec" }, h("h2", null, rows.length < v.rows ? "First " + rows.length + " of " + fmt(v.rows) : fmt(rows.length) + " rows"),
      h("div", { class: "stack" }, rows.length ? rows.map((r) => h("div", { class: "card" }, Object.entries(r).slice(0, 8).map(([k, x]) => h("span", { class: "kv" }, h("span", { class: "k" }, k), h("span", { class: "v" }, value(x)))))) : h("p", { class: "gl" }, "No rows."))),

// ---------- decisions: prompts and saved answers ----------
// An answer is saved in this page's own store (the `answers` collection). It records what the owner chose; it is
// not a ruling until the ledger entry that quotes it is written.
const ANSWERS = {};
let ANSWER_DB = null;
async function loadAnswers() {
  try {
    ANSWER_DB = window.claude && window.claude.use ? await window.claude.use("db") : null;
    if (!ANSWER_DB) return;
    for (const d of (await ANSWER_DB.collection("answers").get()).docs) ANSWERS[d.id] = d.data();
  } catch (e) { ANSWER_DB = null; }
}
// A row the ledger already rules on leaves the open list and is shown with the ruling (the queue entry's `ruled` map).
// The ruled list is read from the map, not from the query, so a card stays once the row has left the query's results.
const queueRows = () => META.queue.map((e) => {
  const got = all(e.sql), ruled = e.ruled || {};
  return { e, rows: got.filter((r) => !ruled[String(r.id)]),
    ruled: Object.keys(ruled).map((id) => ({ id, label: (got.find((r) => String(r.id) === id) || {}).label || "Row " + id })) };
});
const openDecisions = () => META.decisions.filter((d) => !d.answered);
function promptKeys() { return [...openDecisions().map((d) => d.id), ...queueRows().flatMap(({ e, rows }) => rows.map((r) => e.id + "-" + r.id))]; }
function updateCounts() {
  const keys = promptKeys(), done = keys.filter((k) => ANSWERS[k]).length;
  const nav = document.getElementById("nav-waiting"); if (nav) nav.textContent = "Waiting on you (" + (keys.length - done) + ")";
  const el = document.getElementById("answered"); if (el) el.textContent = done + " of " + keys.length + " answered" + (ANSWER_DB ? "." : ". Saving is not available in this view; use Copy and send your answer in chat.");
}
// p: {key, tag, title, question, why, body, blocks, options, source}
function promptCard(p) {
  const chip = h("span", { class: "chip" }), msg = h("p", { class: "gl", role: "status" }), sent = h("code", null);
  let choice = ANSWERS[p.key] ? String(ANSWERS[p.key].choice) : null;
  const note = h("textarea", { id: "note-" + p.key, rows: 4, placeholder: "Your words. The ledger quotes them." }, ANSWERS[p.key] ? ANSWERS[p.key].note || "" : "");
  const buttons = p.options.map((o) => {
    const b = h("button", { type: "button", class: "opt" }, h("span", { class: "lab" }, o.label + (o.recommended ? " · recommended" : "")), h("span", { class: "fx" }, o.effect));
    b.addEventListener("click", () => { choice = String(o.key); refresh(); });
    return b;
  });
  const picked = () => p.options.find((o) => String(o.key) === choice);
  function refresh() {
    buttons.forEach((b, i) => b.setAttribute("aria-pressed", String(String(p.options[i].key) === choice)));
    const a = ANSWERS[p.key];
    chip.className = "chip " + (a ? "ok" : "warn"); chip.textContent = a ? "Answered: " + a.label : "Open";
    sent.textContent = picked() ? p.tag + ": " + picked().label + (note.value.trim() ? " — " + note.value.trim() : "") : "";
  }
  note.addEventListener("input", refresh);
  const save = h("button", { type: "button", disabled: ANSWER_DB ? null : true }, "Save my answer");
  save.addEventListener("click", async () => {
    const o = picked();
    if (!o) { msg.textContent = "Choose an option first."; return; }
    if (/\bnote\b/i.test(o.effect) && !note.value.trim()) { msg.textContent = "This option asks for your words in the note."; return; }
    const doc = { prompt: p.key, question: p.question, choice, label: o.label, note: note.value.trim(), at: new Date().toISOString(), database: META.stamp.sha256.slice(0, 12) };
    try { await ANSWER_DB.doc("answers/" + p.key).set(doc); ANSWERS[p.key] = doc; msg.textContent = "Saved. Tell Claude to record your answers."; }
    catch (e) { msg.textContent = "It could not be saved here (" + ((e && (e.code || e.message)) || e) + "). Use Copy and send it in chat."; }
    refresh(); updateCounts();
  });
  const clear = h("button", { type: "button", disabled: ANSWER_DB ? null : true }, "Clear");
  clear.addEventListener("click", async () => {
    try { await ANSWER_DB.doc("answers/" + p.key).delete(); delete ANSWERS[p.key]; choice = null; note.value = ""; msg.textContent = "Cleared."; }
    catch (e) { msg.textContent = "It could not be cleared here."; }
    refresh(); updateCounts();
  });
  const copy = h("button", { type: "button" }, "Copy");
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(sent.textContent); msg.textContent = "Copied."; }
    catch (e) { const r = document.createRange(); r.selectNodeContents(sent); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = "Select and copy the line above."; }
  });

    h("summary", null, h("span", { class: "sum" }, h("span", { class: "tag" }, p.tag), h("span", { class: "lab" }, p.title), chip)),
    h("div", { class: "body" },
      h("p", null, h("strong", null, p.question)),
      h("div", { class: "stack" }, h("h2", null, "Why this is yours"), h("p", { class: "gl" }, p.why)),
      h("div", { class: "stack ctx" }, h("h2", null, "Context"), p.body),
      p.blocks ? h("div", { class: "stack" }, h("h2", null, "What it holds up"), h("p", { class: "gl" }, p.blocks)) : null,
      h("h2", null, "Your options"), h("div", { class: "stack" }, buttons),
      h("label", { for: "note-" + p.key, class: "gl" }, "Your words (needed only when an option asks for them)"), note,
      h("div", { class: "stack" }, h("p", { class: "gl" }, "To answer in chat, send:"), sent),

// The row a queue prompt is about, in full, and the row it points at when the list names one.
function rowContext(e, id) {
  const t = SCHEMA.tables[e.table], rid = rowidOf(e.table, e.key, id);
  if (!rid) return [h("p", { class: "gl" }, "The row is no longer in the table.")];
  const r = all("select * from " + q(e.table) + " where rowid = ?", [rid])[0];
  const out = [h("div", { class: "stack" }, fieldsOf(t, r)), h("a", { href: "#r-" + slug(e.table) + "-" + rid }, "Open the row page")];
  const sub = e.subject && SCHEMA.tables[r[e.subject.table_col]];
  const pk = sub && sub.cols.filter((c) => c.pk);
  const srid = pk && pk.length === 1 ? rowidOf(sub.name, pk[0].name, r[e.subject.key_col]) : null;
  if (srid) out.push(h("a", { href: "#r-" + slug(sub.name) + "-" + srid }, "The row it concerns: " + sub.name + " " + r[e.subject.key_col]));
  return out;
}
// What the owner said and what it changed, taken from the ledger entry that records it (its single home).
function rulingParts(id, text) {
  const lines = text.split("\n"), words = [], clean = (x) => x.replace(/\*\*/g, "").replace(/`/g, "");
  for (let i = 0; i < lines.length; i++) {
    if (!lines[i].startsWith(id + ":")) continue;
    const rest = lines[i].slice(id.length + 1).trim();
    if (rest) words.push(rest.replace(/^"|"$/g, ""));
    else for (let j = i + 1; j < lines.length && (lines[j].trim() === "" || lines[j].startsWith(">")); j++) if (lines[j].startsWith(">")) words.push(lines[j].replace(/^>\s?/, "").replace(/^"|"$/g, ""));
    break;
  }
  const item = lines.find((l) => new RegExp("^\\d+\\. \\*\\*" + id + "\\.\\*\\*").test(l));
  return { words: words.map(clean), change: item ? clean(item.replace(/^\d+\.\s*/, "")) : null };
}
// s: {key, tag, title, question, ledger, rid}. rid is the id the ledger entry quotes the owner's words under.
function answeredCard(s) {
  const text = META.rulings[s.ledger], { words, change } = text ? rulingParts(s.rid, text) : { words: [], change: null };
  const on = (s.ledger.match(/\d{4}-\d{2}-\d{2}/) || [""])[0];
  return h("details", { class: "prompt", id: "p-" + s.key },
    h("summary", null, h("span", { class: "sum" }, h("span", { class: "tag" }, s.tag), h("span", { class: "lab" }, s.title), h("span", { class: "chip ok" }, "Ruled " + on))),
    h("div", { class: "body" },
      h("p", null, h("strong", null, s.question)),
      h("div", { class: "stack" }, h("h2", null, "Your words"), words.length ? words.map((w) => h("p", null, w)) : h("p", { class: "gl" }, "The ledger entry could not be read here.")),
      change ? h("div", { class: "stack" }, h("h2", null, "What it changes"), h("p", { class: "gl" }, change)) : null,
      h("p", { class: "gl" }, "Recorded in references/project-standards.md, in the entry that begins \"" + s.ledger + "\".")));
}
function waitingPage() {
  const words = h("details", null, h("summary", null, "Words used in these questions"), h("div", { class: "body" }, META.words.map((w) => h("div", { class: "kv" }, h("span", { class: "k" }, w.term), h("span", { class: "v" }, w.meaning)))));
  const dprompt = (d) => promptCard({ key: d.id, tag: d.id, title: d.title, question: d.question, why: d.why_yours, blocks: d.blocks, options: d.options, source: d.source,
    body: d.context.split(/\n\s*\n/).map((x) => h("p", null, x)) });
  const group = (title, note, list, n = list.length) => h("section", { class: "sec" }, h("h2", null, title + " · " + n), note ? h("p", { class: "gl" }, note) : null, h("div", { class: "stack" }, list));
  const page = [
    h("div", { class: "stack" }, h("h1", null, "Waiting on you"),
      h("p", { class: "gl" }, "Each item is a question with the context needed to answer it. Tap one to open it, choose an option, and add your words where the option asks. An answer saved here is not a ruling until Claude writes it into the ledger in your words, so tell Claude to record your answers."),
      h("p", { class: "ok", id: "answered" })),
    words,
    group("Decisions that hold up building", "The workplan names six as the ones that gate building. Your rulings on them raised the questions left here.", openDecisions().filter((d) => d.gates).map(dprompt)),
    group("Other decisions on the plan", "Each has a recommended answer from the report, except where none is recorded. The plan follows the recommendation unless you answer otherwise.", openDecisions().filter((d) => !d.gates).map(dprompt)),
    group("Ruled and recorded in the ledger", "Your answers, in your words, with what each one changes.", [
      ...META.decisions.filter((d) => d.answered).map((d) => answeredCard({ key: d.id, tag: d.id, title: d.title, question: d.question, ledger: d.answered.ledger, rid: d.id })),
      ...queueRows().flatMap(({ e, ruled }) => ruled.map((r) => answeredCard({ key: e.id + "-" + r.id, tag: e.table + " " + r.id, title: r.label, question: e.question, ledger: e.ruled[String(r.id)], rid: e.table + " " + r.id })))]),
    ...queueRows().map(({ e, rows }) => group(e.title, e.why, rows.length
      ? rows.map((r) => promptCard({ key: e.id + "-" + r.id, tag: e.table + " " + r.id, title: r.label, question: e.question, why: e.why_yours, options: e.options, body: rowContext(e, r.id) }))
      : [h("p", { class: "gl" }, "Nothing waiting.")], rows.length)),
  ];
  setTimeout(updateCounts, 0);
  return page;
}
function notFound(what) { return [h("div", { class: "stack" }, h("h1", null, "Not found"), h("p", { class: "gl" }, "There is no " + what + " in this copy of the database."), h("a", { href: "#stages" }, "Back to the tables"))]; }

// ---------- routing ----------
function route() {
  const hash = location.hash.slice(1) || "stages";
  let page, title = "Guidebook Data Browser";
  try {
    if (hash === "stages") page = homePage();
    else if (hash === "waiting") { page = waitingPage(); title = "Waiting on you"; }
    else if (hash.startsWith("t-")) { title = unslug(hash.slice(2)); page = tablePage(title); }
    else if (hash.startsWith("v-")) { title = unslug(hash.slice(2)); page = viewPage(title); }
    else if (hash.startsWith("r-")) { const i = hash.lastIndexOf("-"); title = unslug(hash.slice(2, i)); page = rowPage(title, Number(hash.slice(i + 1))); }
    else page = notFound(hash);
  } catch (e) { page = [h("p", { class: "err" }, "This page failed to open: " + ((e && e.message) || e))]; }
  document.getElementById("main").replaceChildren(...page.flat().filter(Boolean));
  document.getElementById("ttl").textContent = title;
  document.getElementById("back").hidden = hash === "stages";
  document.getElementById("nav-stages").setAttribute("aria-current", hash === "waiting" ? "false" : "page");
  document.getElementById("nav-waiting").setAttribute("aria-current", hash === "waiting" ? "page" : "false");
  window.scrollTo(0, 0);
}
document.getElementById("back").addEventListener("click", () => { if (history.length > 1) history.back(); else location.hash = "stages"; });

(async function boot() {
  try {
    const SQL = await window.initSqlJs({ wasmBinary: b64(WASM_B64) });
    db = new SQL.Database(b64(DB_B64));
    SCHEMA = loadSchema();
    await loadAnswers();
    updateCounts();
    window.addEventListener("hashchange", route);
    route();
    document.documentElement.setAttribute("data-ready", "1");
  } catch (e) {
    document.getElementById("main").replaceChildren(h("p", { class: "err" }, "The database could not be opened here: " + ((e && e.message) || e)));
    document.documentElement.setAttribute("data-ready", "error");
  }
})();
