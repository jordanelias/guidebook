<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schema Walkability</title>
<style>
:root{--bg:#fbfaf8;--panel:#fff;--ink:#1a1a1a;--dim:#6b6b6b;--line:#e2ded7;
 --accent:#7a4b2a;--warn:#9a3412;--ok:#2f6b47;--chip:#f0ece5;--hl:#fff8e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#14151a;--panel:#1c1e25;--ink:#e9e6e1;--dim:#9a968f;--line:#2e313a;
 --accent:#d9a066;--warn:#f08a5d;--ok:#6fc08d;--chip:#262932;--hl:#2a2418}}
:root[data-theme="dark"]{--bg:#14151a;--panel:#1c1e25;--ink:#e9e6e1;--dim:#9a968f;
 --line:#2e313a;--accent:#d9a066;--warn:#f08a5d;--ok:#6fc08d;--chip:#262932;--hl:#2a2418}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:13.5px;margin-bottom:6px}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.spine{margin:14px 0 18px;padding:10px 12px;background:var(--panel);
 border:1px solid var(--line);border-radius:10px;overflow-x:auto;white-space:nowrap}
.spine b{color:var(--accent)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input[type=search]{flex:1 1 260px;min-width:0;padding:9px 12px;border:1px solid var(--line);
 border-radius:8px;background:var(--panel);color:var(--ink);font-size:14px}
select,button{padding:9px 11px;border:1px solid var(--line);border-radius:8px;
 background:var(--panel);color:var(--ink);font-size:13.5px;cursor:pointer}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;
 padding:8px 13px;min-width:92px}
.stat b{display:block;font-size:21px;line-height:1.2}
.stat span{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.cols{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.list{background:var(--panel);border:1px solid var(--line);border-radius:10px;
 max-height:72vh;overflow:auto}
.row{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;
 display:flex;gap:8px;align-items:baseline}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hl)}
.row.sel{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .ct{color:var(--dim);font-size:12px}
.chip{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--chip);
 color:var(--dim);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
.chip.w{background:var(--warn);color:#fff}
.chip.k{background:var(--accent);color:#fff}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel h2{margin:0 0 2px;font-size:20px}
.panel h3{margin:20px 0 7px;font-size:12.5px;text-transform:uppercase;
 letter-spacing:.06em;color:var(--dim)}
.note{border-left:3px solid var(--warn);padding:9px 12px;background:var(--hl);
 border-radius:0 8px 8px 0;margin:12px 0;font-size:13.5px}
.note.ok{border-left-color:var(--ok)}
ul.edges{list-style:none;margin:0;padding:0}
ul.edges li{padding:6px 0;border-bottom:1px dashed var(--line)}
ul.edges li:last-child{border-bottom:0}
a.tl{color:var(--accent);cursor:pointer;text-decoration:none;border-bottom:1px dotted}
a.tl:hover{text-decoration:none;border-bottom-style:solid}
.x{color:var(--warn);font-weight:600}
.muted{color:var(--dim)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px;
 overflow:auto;font-size:12px;margin:8px 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.empty{padding:28px;text-align:center;color:var(--dim)}
footer{margin-top:28px;color:var(--dim);font-size:12.5px;line-height:1.7}

de_floor_only","v_determination_provenance","v_item_provenance","v_source_reach_all","v_unregistered_roots","v_value_independence"],"disputed":null,"island":false},{"name":"url_verification_runs","stage":"evidence","rows":0,"cols":[{"name":"run_id","type":"TEXT","notnull":false,"pk":true},{"name":"started_at","type":"TEXT","notnull":true,"pk":false},{"name":"completed_at","type":"TEXT","notnull":false,"pk":false},{"name":"candidates_pool","type":"INTEGER","notnull":false,"pk":false},{"name":"attempted","type":"INTEGER","notnull":false,"pk":false},{"name":"verified","type":"INTEGER","notnull":false,"pk":false},{"name":"probabilistic","type":"INTEGER","notnull":false,"pk":false},{"name":"no_match","type":"INTEGER","notnull":false,"pk":false},{"name":"dead","type":"INTEGER","notnull":false,"pk":false},{"name":"wayback_verified","type":"INTEGER","notnull":false,"pk":false},{"name":"wayback_probabilistic","type":"INTEGER","notnull":false,"pk":false},{"name":"dead_dns","type":"INTEGER","notnull":false,"pk":false},{"name":"transient","type":"INTEGER","notnull":false,"pk":false},{"name":"verified_before","type":"INTEGER","notnull":false,"pk":false},{"name":"verified_after","type":"INTEGER","notnull":false,"pk":false},{"name":"created_by_session","type":"TEXT","notnull":false,"pk":false}],"ncols":16,"out":[],"in":[],"unwritable":false,"unwritable_via":[],"views":[],"disputed":null,"island":true},{"name":"weighting_profile","stage":"render","rows":5,"cols":[{"name":"audience","type":"TEXT","notnull":true,"pk":true},{"name":"use_pattern","type":"TEXT","notnull":true,"pk":true},{"name":"tier_weights","type":"TEXT","notnull":true,"pk":false},{"name":"notes","type":"TEXT","notnull":false,"pk":false}],"ncols":4,"out":[],"in":[],"unwritable":false,"unwritable_via":[],"views":[],"disputed":null,"island":true}],"views":[{"name":"v_best_practice","reads":["specifications"],"spans":["specification"],"crosses":false,"rows":0,"sql":"CREATE VIEW v_best_practice AS\n    SELECT *,\n           CASE\n               WHEN regulatory_stratum_only = 1 THEN 'weak'\n               ELSE 'anchored'\n           END AS strength_band\n    FROM \"specifications\"\n    WHERE state IN ('stated', 'provisional')\n      AND code_floor_only = 0\n      AND retired_at IS NULL"},{"name":"v_code_floor_only","reads":["base_parameters","specifications","terms"],"spans":["specification"],"crosses":false,"rows":0,"sql":"CREATE VIEW v_code_floor_only AS\n    SELECT ecs.*, t.canonical_en AS parameter_name\n    FROM \"specifications\" ecs\n    JOIN base_parameters bp ON bp.parameter_id = ecs.parameter_id\n    JOIN terms t            ON t.term_id       = bp.term_id\n    WHERE ecs.code_floor_only = 1\n      AND ecs.retired_at IS NULL"},{"name":"v_coverage_branch","reads":["search_executions"],"spans":["research"],"crosses":false,"rows":46,"sql":"CREATE VIEW v_coverage_branch AS\nSELECT slug, jurisdiction, target_tier, target_evidence_type, target_scope,\n       COUNT(*) AS targeted_searches, SUM(results_admitted) AS admitted\nFROM search_executions WHERE deferred_reason IS NULL\nGROUP BY 1,2,3,4,5"},{"name":"v_coverage_jurisdiction","reads":["search_executions"],"spans":["research"],"crosses":false,"rows":16,"sql":"CREATE VIEW v_coverage_jurisdiction AS\nSELECT slug, jurisdiction,\n       COUNT(*) AS searches, SUM(results_admitted) AS admitted,\n       MAX(depth_method='systematic') AS reached_systematic,\n       MAX(saturation_signal='saturated') AS saturated\nFROM search_executions WHERE deferred_reason IS NULL\nGROUP BY slug, jurisdiction"},{"name":"v_coverage_language","reads":["search_executions"],"spans":["research"],"crosses":false,"rows":16,"sql":"CREATE VIEW v_coverage_language AS\nSELECT slug, language, COUNT(*) AS searches, SUM(results_admitted) AS admitted\nFROM search_executions WHERE deferred_reason IS NULL\nGROUP BY slug, language"},{"name":"v_coverage_priority","reads":["lang_jur_map","search_executions","slugs"],"spans":["research"],"crosses":false,"rows":7199,"sql":"CREATE VIEW v_coverage_priority AS\nSELECT\n    s.slug,\n    ljm.jurisdiction,\n    ljm.language,\n    ljm.role,\n    ( (CASE ljm.role WHEN 'PRIMARY' THEN 3 ELSE 1 END)\n      + (CASE WHEN (SELECT COUNT(*) FROM search_executions se2\n                    WHERE se2.slug = s.slug AND se2.deferred_reason IS NULL) = 0\n              THEN 2 ELSE 0 END)\n    ) AS priority_score,\n    (SELECT COUNT(*) FROM search_executions se3\n     WHERE se3.slug = s.slug AND se3.deferred_reason IS NULL) AS slug_searches\nFROM slugs s\nJOIN lang_jur_map ljm            \nWHERE s.status IN ('ACTIVE', 'STUB')\n  AND NOT EXISTS (\n      SELECT 1 FROM search_executions se\n      WHERE se.slug = s.slug\n        AND se.jurisdiction = ljm.jurisdiction\n        AND se.language = ljm.language\n  )"},{"name":"v_derived_figure_check","reads":["extraction_relations","source_value_extractions"],"spans":["evidence"],"crosses":false,"rows":0,"sql":"CREATE VIEW v_derived_figure_check AS\nSELECT\n    d.extraction_id                                              AS derived_id,\n    CAST(d.claimed_value AS REAL)                                 AS stored,\n    CAST(b.claimed_value AS REAL)                                 AS base_value,\n    CAST(e.claimed_value AS REAL)                                 AS delta_value,\n    CAST(b.claimed_value AS REAL) + CAST(e.claimed_value AS REAL) AS recomputed\nFROM source_value_extractions d\nJOIN extraction_relations rb\n  ON rb.from_extraction_id = d.extraction_id\n AND rb.relation = 'derived_from'\n AND rb.input_role = 'base'\nJOIN source_value_extractions b ON b.extraction_id = rb.to_extraction_id\nJOIN extraction_relations rd\n  ON rd.from_extraction_id = d.extraction_id\n AND rd.relation = 'derived_from'\n AND rd.input_role = 'delta'\nJOIN source_value_extractions e ON e.extraction_id = rd.to_extraction_id\nWHERE d.figure_role = 'derived'\n  AND d.claimed_value GLOB '*[0-9]*' AND d.claimed_value NOT GLOB '*[^0-9.eE+-]*'\n  AND b.claimed_value GLOB '*[0-9]*' AND b.claimed_value NOT GLOB '*[^0-9.eE+-]*'\n  AND e.claimed_value GLOB '*[0-9]*' AND e.claimed_value NOT GLOB '*[^0-9.eE+-]*'\n  AND d.claimed_unit = b.claimed_unit\n  AND d.claimed_unit = e.claimed_unit"},{"name":"v_determination_provenance","reads":["base_parameters","evidence_sources","source_value_extractions","specification_extraction_links","specifications","terms"],"spans":["evidence","specification"],"crosses":true,"rows":0,"sql":"CREATE VIEW v_determination_provenance AS\nSELECT s.specification_id,\n       s.parameter_id,\n       t.canonical_en                AS parameter_name,\n       s.state,\n       COALESCE(s.identity_code, s.icf_code, s.needs_code, s.medical_code) AS lens,\n       l.role,\n       l.exclusion_reason,\n       x.extraction_id,\n       x.figure_role,\n       x.comparator,\n       x.claimed_value,\n       x.claimed_unit,\n       x.claim_text,\n       x.ref_id,\n       e.tier,\n       e.evidence_type,\n       e.verification_status\n  FROM specifications s\n  JOIN specification_extraction_links l ON l.specification_id = s.specification_id\n  JOIN source_value_extractions       x ON x.extraction_id    = l.extraction_id\n  JOIN base_parameters                p ON p.parameter_id     = s.parameter_id\n  JOIN terms                          t ON t.term_id          = p.term_id\n  LEFT JOIN evidence_sources          e ON e.ref_id           = x.ref_id\n WHERE s.retired_at IS NULL"},{"name":"v_divergence","reads":["convergence_assessment","specifications"],"spans":["specification","synthesis"],"crosses":true,"rows":0,"sql":"CREATE VIEW v_divergence AS\n    SELECT ecs.*, ca.status AS convergence_status, ca.rationale AS convergence_rationale,\n           ca.synthesis_approach AS convergence_synthesis_approach\n    FROM \"specifications\" ecs\n    JOIN convergence_assessment ca ON ca.convergence_id = ecs.convergence_id\n    WHERE ca.status = 'divergent'\n      AND ecs.retired_at IS NULL"},{"name":"v_evidence_authors","reads":["evidence_source_authors","evidence_sources"],"spans":["evidence"],"crosses":false,"rows":27,"sql":"CREATE VIEW v_evidence_authors AS\nSELECT\n  e.ref_id                                                                   AS ref_id,\n  (SELECT COUNT(*) FROM evidence_source_authors a\n     WHERE a.ref_id = e.ref_id)                                              AS author_count,\n  (SELECT CASE WHEN a.is_corporate = 1 THEN a.corporate_name ELSE a.last_name END\n     FROM evidence_source_authors a\n     WHERE a.ref_id = e.ref_id ORDER BY a.position LIMIT 1)                  AS first_author_last,\n  (SELECT CASE WHEN a.is_corporate = 1 THEN NULL ELSE a.first_name END\n     FROM evidence_source_authors a\n     WHERE a.ref_id = e.ref_id ORDER BY a.position LIMIT 1)                  AS first_author_first,\n  (SELECT CASE WHEN a.is_corporate = 1 THEN 1 ELSE 0 END\n     FROM evidence_source_authors a\n     WHERE a.ref_id = e.ref_id ORDER BY a.position LIMIT 1)                  AS is_corporate_primary,\n  (SELECT group_concat(\n            CASE WHEN a.is_corporate = 1 THEN COALESCE(a.corporate_name, '')\n                 ELSE TRIM(COALESCE(a.last_name, '') || ' ' ||\n                           substr(COALESCE(a.first_name, ''), 1, 1)) END,\n            '; ' ORDER BY a.position)\n     FROM evidence_source_authors a\n     WHERE a.ref_id = e.ref_id)                                              AS author_display\nFROM evidence_sources e"},{"name":"v_item_provenance","reads":["base_parameters","evidence_sources","specification_source_links","specifications","terms"],"spans":["evidence","specification"],"crosses":true,"rows":0,"sql":"CREATE VIEW v_item_provenance AS\nSELECT\n    bp.parameter_id,\n    t.canonical_en              AS parameter_name,\n    t.domain                    AS parameter_domain,\n    ecs.specification_id,\n    COALESCE(ecs.identity_code, ecs.icf_code, ecs.needs_code, ecs.medical_code) AS lens_code,\n    ecs.state                   AS cell_state,\n    ecs.tier_basis,\n    ecs.regulatory_stratum_only,\n    csl.role                    AS source_role,\n    es.ref_id,\n    es.pub_title,\n    \n    \n    \n    va.author_display,\n    es.pub_year,\n    es.tier                     AS source_tier,\n    es.evidence_type,\n    es.verification_status,\n    es.jurisdiction\nFROM base_parameters bp\nJOIN terms t                            ON t.term_id           = bp.term_id\nJOIN \"specifications\" ecs               ON ecs.parameter_id    = bp.parameter_id\nJOIN \"specification_source_links\" csl   ON csl.specification_id = ecs.specification_id\nJOIN evidence_sources es                ON es.ref_id           = csl.ref_id\nLEFT JOIN v_evidence_authors va         ON va.ref_id           = es.ref_id\nWHERE ecs.retired_at IS NULL"},{"name":"v_open_determination_gates","reads":["determination_gates"],"spans":["specification"],"crosses":false,"rows":1,"sql":"CREATE VIEW v_open_determination_gates AS\nSELECT g.gate_id, g.parameter_id, g.identity_code, g.verdict,\n       g.trigger_ref_id, g.trigger_tier, g.trigger_evidence_type, g.detail,\n       g.raised_at, g.raised_by_session\n  FROM determination_gates g\n WHERE g.resolved_at IS NULL"},{"name":"v_pending","reads":["gaps","specifications"],"spans":["specification","synthesis"],"crosses":true,"rows":0,"sql":"CREATE VIEW v_pending AS\n    SELECT ecs.*, g.description AS gap_description, g.category AS gap_category,\n           g.priority AS gap_priority\n    FROM \"specifications\" ecs\n    JOIN gaps g ON g.gap_id = ecs.gap_register_id\n    WHERE ecs.state = 'pending'\n      AND ecs.retired_at IS NULL"},{"name":"v_pmp_latest_walk","reads":["spec_value_probes"],"spans":["specification"],"crosses":false,"rows":0,"sql":"CREATE VIEW v_pmp_latest_walk AS\nSELECT\n    item_code,\n    slug,\n    walk_id,\n    MAX(created_at) AS walk_completed_at,\n    SUM(CASE WHEN phase IN (\n            'outer-pass-1st','outer-pass-2nd',\n            'refinement-pass-1st','refinement-pass-2nd'\n        ) THEN 1 ELSE 0 END) AS supported_steps,\n    SUM(CASE WHEN phase IN (\n            'outer-stop','refinement-stop'\n        ) THEN 1 ELSE 0 END) AS terminator_steps\nFROM spec_value_probes\nGROUP BY item_code, slug, walk_id"},{"name":"v_registry_duplicate_descriptions","reads":["external_root_registry"],"spans":["evidence"],"crosses":false,"rows":0,"sql":"CREATE VIEW v_registry_duplicate_descriptions AS\n    SELECT LOWER(TRIM(description)) AS normalised_description,\n           COUNT(*) AS stub_count,\n           GROUP_CONCAT(root_id, ', ') AS root_ids\n    FROM external_root_registry\n    GROUP BY LOWER(TRIM(description))\n    HAVING COUNT(*) > 1"},{"name":"v_root_id_conflicts","reads":["source_value_extractions"],"spans":["evidence"],"crosses":false,"rows":0,"sql":"CREATE VIEW v_root_id_conflicts AS\n    SELECT 'ref_id_has_multiple_root_ids' AS conflict_type,\n           root_ref_id AS conflict_key,\n           COUNT(DISTINCT root_id) AS distinct_count\n    FROM source_value_extractions\n    WHERE root_ref_id IS NOT NULL AND root_id IS NOT NULL\n    GROUP BY root_ref_id HAVING COUNT(DISTINCT root_id) > 1\n    UNION ALL\n    SELECT 'root_id_spans_multiple_ref_ids' AS conflict_type,\n           root_id AS conflict_key,\n           COUNT(DISTINCT root_ref_id) AS distinct_count\n    FROM source_value_extractions\n    WHERE root_ref_id IS NOT NULL AND root_id IS NOT NULL\n    GROUP BY root_id HAVING COUNT(DISTINCT root_ref_id) > 1"},{"name":"v_source_admission","reads":["evidence_sources","search_admissions","search_executions"],"spans":["evidence","research"],"crosses":true,"rows":26,"sql":"CREATE VIEW v_source_admission AS\nSELECT\n    es.ref_id,\n    es.pub_title,\n    es.tier                     AS source_tier,\n    es.evidence_type,\n    es.verification_status,\n    es.verification_disposition,\n    se.exec_id,\n    se.slug                     AS admitted_under_slug,\n    se.query_text,\n    se.engine,\n    se.language,\n    se.jurisdiction             AS search_jurisdiction,\n    se.depth_method,\n    se.mining_direction,\n    se.target_tier,\n    se.backfill                 AS search_was_backfilled,\n    se.created_by_session                  AS admitting_session,\n    se.created_at              AS admitted_at,\n    \n    \n    se.prior_expectation\nFROM evidence_sources es\nJOIN search_admissions sa ON sa.ref_id  = es.ref_id\nJOIN search_executions se ON se.exec_id = sa.exec_id"},{"name":"v_source_reach_all","reads":["base_parameters","evidence_sources","source_slug_links","specification_source_links","specifications","terms"],"spans":["evidence","specification"],"crosses":true,"rows":57,"sql":"CREATE VIEW v_source_reach_all AS\nSELECT\n    es.ref_id,\n    es.pub_title,\n    es.tier                     AS source_tier,\n    es.verification_status,\n    CASE WHEN ecs.specification_id IS NULL THEN 0 ELSE 1 END AS reaches,\n    ecs.specification_id,\n    ecs.parameter_id,\n    t.canonical_en              AS parameter_name,\n    COALESCE(ecs.identity_code, ecs.icf_code, ecs.needs_code, ecs.medical_code) AS lens_code,\n    ecs.state                   AS cell_state,\n    (SELECT GROUP_CONCAT(ssl.slug, '; ')\n       FROM source_slug_links ssl\n      WHERE ssl.ref_id = es.ref_id)  AS admitted_under_slugs\nFROM evidence_sources es\nLEFT JOIN \"specification_source_links\" csl ON csl.ref_id = es.ref_id\n\n\nLEFT JOIN \"specifications\" ecs ON ecs.specification_id = csl.specification_id\n                              AND ecs.retired_at IS NULL\nLEFT JOIN base_parameters bp   ON bp.parameter_id = ecs.parameter_id\nLEFT JOIN terms t              ON t.term_id       = bp.term_id"},{"name":"v_unregistered_roots","reads":["base_parameters","external_root_registry","source_value_extractions","terms"],"spans":["evidence"],"crosses":false,"rows":0,"sql":"CREATE VIEW v_unregistered_roots AS\n    SELECT sve.extraction_id,\n           sve.slug,\n           sve.parameter_id,\n           t.canonical_en AS parameter_label,\n           sve.root_id,\n           'unregistered' AS defect\n    FROM source_value_extractions sve\n    JOIN base_parameters p ON p.parameter_id = sve.parameter_id\n    JOIN terms t           ON t.term_id      = p.term_id\n    WHERE sve.root_id IS NOT NULL\n      AND sve.root_ref_id IS NULL\n      AND NOT EXISTS (\n          SELECT 1 FROM external_root_registry err\n          WHERE err.root_id = sve.root_id)\n\n    UNION ALL\n\n    SELECT sve.extraction_id,\n           sve.slug,\n           sve.parameter_id,\n           t.canonical_en AS parameter_label,\n           sve.root_id,\n           'rootless' AS defect\n    FROM source_value_extractions sve\n    JOIN base_parameters p ON p.parameter_id = sve.parameter_id\n    JOIN terms t           ON t.term_id      = p.term_id\n    WHERE sve.root_id IS NULL\n      AND sve.root_ref_id IS NULL\n      AND sve.root_type IS NOT NULL\n      AND sve.root_type NOT IN ('untraced', 'derived_calculation')"},{"name":"v_value_independence","reads":["base_parameters","external_root_registry","source_value_extractions","terms"],"spans":["evidence"],"crosses":false,"rows":1,"sql":"CREATE VIEW v_value_independence AS\n    SELECT sve.parameter_id,\n           t.canonical_en AS parameter_label,\n           COUNT(DISTINCT COALESCE(sve.root_ref_id, sve.root_id)) AS independent_root_count\n    FROM source_value_extractions sve\n    JOIN base_parameters p ON p.parameter_id = sve.parameter_id\n    JOIN terms t           ON t.term_id      = p.term_id\n    WHERE sve.root_type IN ('measurement_primary', 'participatory_finding',\n                            'derived_calculation')\n      AND (sve.root_ref_id IS NOT NULL\n           OR sve.root_id IN (SELECT root_id FROM external_root_registry))\n    GROUP BY sve.parameter_id, t.canonical_en"}],"dead_roots":{"base_taxonomy_medical":["icf_medical_map.medical_code","identity_medical_map.medical_code"],"case_studies":["case_study_outcomes.case_study_id","case_study_populations.case_study_id","case_study_specs.case_study_id","case_study_strategies.case_study_id"],"connections":["connection_targets.con_id"],"items":["case_study_specs.item_code","economics_entry_specs.item_code","item_audit_runs.item_code","item_bpc_links.item_code","item_population_elaborations.item_code","item_taxonomy_links.item_code","jurisdictional_values.item_code","room_items.item_code","spec_value_probes.item_code","term_item_links.item_code"],"reasoning_doc_citations":["citation_population_links.citation_id"],"spec_value_probes":["probe_population_links.probe_id"]},"counts":{"tables":77,"views":20,"edges":108,"empty":36,"unwritable":6,"islands":13,"crossing_views":6}}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const T=Object.fromEntries(D.tables.map(t=>[t.name,t]));
const F={un:false,is:false,em:false,vw:false};
let sel=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('spine').innerHTML='SPINE: <b>'+D.spine.join('</b> &rarr; <b>')+'</b>';
const C=D.counts;
document.getElementById('stats').innerHTML=[
 ['tables',C.tables],['views',C.views],['fk edges',C.edges],['empty',C.empty],
 ['empty parents',C.unwritable],['islands',C.islands],['crossing views',C.crossing_views]
].map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');

const sg=document.getElementById('stage');
sg.innerHTML='<option value="">every stage</option>'+
  D.stage_order.map(s=>`<option value="${s}">${s}</option>`).join('');

function items(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const st=sg.value;
  let ts=D.tables.filter(t=>
     (!q||t.name.toLowerCase().includes(q))&&(!st||t.stage===st)&&
     (!F.un||t.unwritable)&&(!F.is||t.island)&&(!F.em||t.rows===0));
  let vs=D.views.filter(v=>(!q||v.name.toLowerCase().includes(q))&&
     (!F.vw||v.crosses)&&(!st||v.spans.includes(st))&&!F.un&&!F.is&&!F.em);
  if(F.vw) ts=[];
  return {ts,vs};
}
function renderList(){
  const {ts,vs}=items();
  const el=document.getElementById('list');
  if(!ts.length&&!vs.length){el.innerHTML='<div class="empty">Nothing matches.</div>';return}
  el.innerHTML=
   ts.map(t=>`<div class="row ${sel===t.name?'sel':''}" data-k="t:${esc(t.name)}">
     <span class="nm mono">${esc(t.name)}</span>
     ${t.unwritable?'<span class="chip w">blocked</span>':''}
     ${t.island?'<span class="chip">island</span>':''}
     <span class="ct">${t.rows}</span>
     <span class="chip">${esc(t.stage)}</span></div>`).join('')+
   vs.map(v=>`<div class="row ${sel==='v:'+v.name?'sel':''}" data-k="v:${esc(v.name)}">
     <span class="nm mono">${esc(v.name)}</span>
     ${v.crosses?'<span class="chip k">pointer</span>':''}
     <span class="ct">${v.rows===null?'?':v.rows}</span></div>`).join('');
  el.querySelectorAll('.row').forEach(r=>r.onclick=()=>{show(r.dataset.k);});
}
function link(n){return `<a class="tl mono" onclick="show('t:${esc(n)}')">${esc(n)}</a>`}

function show(key){
  sel=key.startsWith('v:')?key:key.slice(2);
  renderList();
  const el=document.getElementById('detail');
  if(key.startsWith('v:')){
    const v=D.views.find(x=>x.name===key.slice(2));
    el.innerHTML=`<h2 class="mono">${esc(v.name)}</h2>
     <div class="sub">view &middot; renders ${v.rows===null?'?':v.rows} row(s)</div>
     ${v.crosses?`<div class="note"><b>This view is a POINTER.</b> It joins
       <b>${v.spans.join('</b> and <b>')}</b>. CLAUDE.md &sect;3: a cross-stage view is what
       &ldquo;point, do not copy&rdquo; means in SQL, and is the most protected object in
       the schema. Deleting it forces the next reader back to copying the fact.
       ${v.rows===0?'<br><br><b>It currently renders 0 rows</b> &mdash; which is exactly how migration 064&rsquo;s missed caller looked. Rule 4: treat a 0-row object as unproven, not clean.':''}</div>`
      :`<div class="note ok">Spans ${v.spans.length?'<b>'+v.spans.join('</b>, <b>')+'</b> only':'no pipeline stage'}
        &mdash; not a cross-stage pointer. (<code>base</code> and <code>infrastructure</code>
        are excluded by &sect;3&rsquo;s convention.)</div>`}
     <h3>Reads</h3><div>${v.reads.map(link).join(' &middot; ')||'<span class="muted">nothing resolvable</span>'}</div>
     <h3>Definition</h3><pre>${esc(v.sql)}</pre>`;
    return;
  }
  const t=T[key.slice(2)];
  if(!t){el.innerHTML='<div class="empty">Unknown.</div>';return}
  const out=t.out.map(e=>`<li>${e.notnull?'<b>NOT NULL</b> ':''}<code>${esc(e.col)}</code>
     &rarr; ${link(e.dst)}<code>.${esc(e.to_col)}</code>
     ${T[e.dst]&&T[e.dst].stage!==t.stage?`<span class="chip">${esc(t.stage)}&rarr;${esc(T[e.dst].stage)}</span>`:''}
     ${e.dead?'<span class="x"> &mdash; target is EMPTY, so this table cannot accept a row</span>':''}</li>`).join('');
  const inn=t.in.map(e=>`<li>${link(e.src)}<code>.${esc(e.col)}</code> &rarr;
     <code>${esc(e.to_col)}</code>${e.notnull?' <span class="muted">(required there)</span>':''}</li>`).join('');
  el.innerHTML=`<h2 class="mono">${esc(t.name)}</h2>
   <div class="sub">stage <b>${esc(t.stage)}</b> &middot; ${t.rows} row(s) &middot; ${t.ncols} columns</div>
   ${t.unwritable?`<div class="note"><b>BLOCKED BY AN EMPTY PARENT.</b> ${t.unwritable_via.map(esc).join(', ')}.
     A NOT NULL foreign key into an emptied table refuses at INSERT, never at migration time
     (CLAUDE.md &sect;4) &mdash; so the schema looks healthy, a rebuild reproduces it exactly,
     and every gate stays green.
     <br><br><b>THIS OVER-REPORTS, deliberately.</b> The probe asks only whether the parent is
     empty right now. Where one <code>db.py</code> call inserts parent and child in the same
     transaction the write succeeds anyway &mdash; <code>connection_targets</code>,
     <code>identity_medical_map</code> and <code>icf_medical_map</code> are flagged here and are
     all fine. <b>Only a child whose parent NOTHING fills is dead.</b> The empty PARENT is the
     finding; this row is its consequence. Same probe as <code>tools/pipeline_walk.py</code>,
     imported rather than re-derived, so the two pages cannot disagree.</div>`:''}
   ${t.island?`<div class="note"><b>ISLAND.</b> No foreign key in either direction. Either it is
     standalone vocabulary, or its pointer was never built &mdash; and rule 5 says a fact is
     reached by pointer, so nothing here can be reached that way.</div>`:''}
   ${t.disputed?`<div class="note">Stage disputed: ${esc(JSON.stringify(t.disputed))}</div>`:''}
   <div class="grid2">
     <div><h3>Points at (${t.out.length})</h3>
       <ul class="edges">${out||'<li class="muted">nothing</li>'}</ul></div>
     <div><h3>Pointed at by (${t.in.length})</h3>
       <ul class="edges">${inn||'<li class="muted">nothing</li>'}</ul></div>
   </div>
   <h3>Read by views (${t.views.length})</h3>
   <div>${t.views.map(v=>`<a class="tl mono" onclick="show('v:${esc(v)}')">${esc(v)}</a>`).join(' &middot; ')||'<span class="muted">none</span>'}</div>
   <h3>Columns</h3>
   <div class="mono" style="font-size:12px">${t.cols.map(c=>
      `${esc(c.name)}<span class="muted">:${esc(c.type||'?')}${c.notnull?' NOT NULL':''}${c.pk?' PK':''}</span>`
    ).join(' &middot; ')}</div>`;
}
['q'].forEach(i=>document.getElementById(i).oninput=renderList);
sg.onchange=renderList;
[['fUn','un'],['fIs','is'],['fEm','em'],['fVw','vw']].forEach(([id,k])=>{
  document.getElementById(id).onclick=e=>{F[k]=!F[k];e.target.classList.toggle('on',F[k]);renderList();};
});
document.getElementById('foot').innerHTML=
 `Rendered from <code>data/guidebook.db</code> at schema version
  <b>${D.schema_version}</b>. This page carries no generation date and no commit sha on
  purpose: it is a pure function of the schema, so <code>--check</code> can compare it
  byte-for-byte. For WHEN it was last regenerated, ask git &mdash;
  <code>git log -1 -- tools/schema-walkability.html</code>. Stage ids from
  <code>governance/pipeline-contract.yaml</code>; table&rarr;stage from
  <code>governance/stage-map.yaml</code>. <b>Do not hand-edit this file</b> &mdash;
  regenerate with <code>scripts/regenerate_derived.sh</code>.<br>
  A view&rsquo;s stage span is DERIVED from the tables its SQL names. <code>stage-map.yaml</code>
  records the per-view <code>pointer:</code> list as still owed; this page computes it rather
  than waiting for it, so it is a derivation and not a second home.`;
renderList();
show('t:'+D.tables[0].name);
</script></body></html>
